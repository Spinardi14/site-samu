      const PortalLoadingScreen = ({ phrase = "Preparando seu acesso..." }) => (
        <div
          className="loading-screen min-h-screen flex items-center justify-center bg-[#fafafa]"
          role="status"
          aria-label={phrase}
        >
          <div className="flex flex-col items-center">
            <img
              src="https://i.imgur.com/sD1OnjL.png"
              alt="SAMU"
              className="w-14 h-14 object-contain"
            />
            <div className="mt-8 w-44 h-[3px] rounded-full bg-slate-200/70 overflow-hidden">
              <div className="loading-slide h-full w-1/3 rounded-full bg-gradient-to-r from-transparent via-red-600 to-transparent"></div>
            </div>
          </div>
        </div>
      );
      const App = () => {
        const [currentView, setCurrentView] = useState("landing");
        // Tutorial do Painel Administrativo (Coordenador para cima, contas atuais e futuras).
        const [painelTour, setPainelTour] = useState(null); // { nivel, step } (fica no App: o tour atravessa a troca de tela)
        const painelTourChecado = useRef("");
        const [maintenanceActive, setMaintenanceActive] = useState(false);
        const [currentMember, setCurrentMember] = useState(null);
        const [assistedTicket, setAssistedTicket] = useState(() => {
          const match = window.location.hash.match(/^#acesso-assistido=([0-9a-f]{64})$/i);
          return match ? match[1] : "";
        });
        const [memberToken, setMemberToken] = useState(
          () => window.location.hash.startsWith("#acesso-assistido=") ? "" :
            (sessionStorage.getItem("samu_assisted_token") || localStorage.getItem("samu_portal_token") || ""),
        );
        const [authReady, setAuthReady] = useState(false);
        const [portalOnline, setPortalOnline] = useState(0);
        const [portalOnlineUsers, setPortalOnlineUsers] = useState([]);

        const authenticated = (member, token) => {
          setCurrentMember(member);
          setMemberToken(token);
          setCurrentView("landing");
          setAuthReady(true);
        };

        const logoutPortal = () => {
          // Avisa o servidor para apagar o login salvo deste aparelho.
          try {
            if (memberToken) fetch("https://api.144.22.247.17.sslip.io/portal/logout", { method: "POST", headers: { Authorization: "Bearer " + memberToken }, keepalive: true }).catch(() => {});
          } catch {}
          if (!sessionStorage.getItem("samu_assisted_token")) localStorage.removeItem("samu_portal_token");
          sessionStorage.removeItem("samu_assisted_token");
          setCurrentMember(null);
          setMemberToken("");
          setCurrentView("landing");
        };

        const loadPortalMember = async () => {
          if (assistedTicket) return;
          if (!memberToken) {
            setAuthReady(true);
            return;
          }
          // So desloga se o servidor RECUSAR o login (401/403/manutencao).
          // Internet fraca ou API reiniciando: tenta de novo e mantem o login salvo.
          let recusado = false;
          for (let tentativa = 0; tentativa < 4; tentativa++) {
            try {
              const res = await fetch(
                "https://api.144.22.247.17.sslip.io/portal/me",
                { headers: { Authorization: "Bearer " + memberToken } },
              );
              const data = await res.json().catch(() => ({}));
              if (res.ok && data.sucesso) {
                setCurrentMember(data.membro);
                setAuthReady(true);
                return;
              }
              if (res.status === 401 || res.status === 403 || data.manutencao) { recusado = true; break; }
            } catch {}
            await new Promise((ok) => setTimeout(ok, 1500 * (tentativa + 1)));
          }
          if (recusado) {
            if (!sessionStorage.getItem("samu_assisted_token")) localStorage.removeItem("samu_portal_token");
            sessionStorage.removeItem("samu_assisted_token");
            setMemberToken("");
          }
          setCurrentMember(null);
          setAuthReady(true);
        };

        useEffect(() => {
          if (!assistedTicket) return;
          let cancelled = false;
          fetch("https://api.144.22.247.17.sslip.io/portal/acesso-assistido", {
            method: "POST", headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ ticket: assistedTicket }),
          }).then(async (response) => {
            const data = await response.json();
            if (!response.ok) throw new Error(data.erro);
            if (!cancelled) {
              sessionStorage.setItem("samu_assisted_token", data.token);
              setCurrentMember(data.membro);
              setMemberToken(data.token);
            }
          }).catch((err) => { if (!cancelled) alert(err.message || "Acesso assistido indisponível."); })
            .finally(() => {
              if (!cancelled) { history.replaceState(null, "", window.location.pathname + window.location.search); setAssistedTicket(""); setAuthReady(true); }
            });
          return () => { cancelled = true; };
        }, [assistedTicket]);

        const updatePresence = async () => {
          if (!memberToken) return;
          try {
            const heartbeat = await fetch(
              "https://api.144.22.247.17.sslip.io/portal/heartbeat",
              {
                method: "POST",
                headers: { Authorization: "Bearer " + memberToken, "Content-Type": "application/json" },
                // Só conta tempo ativo quando a aba do portal está aberta na tela.
                body: JSON.stringify({ ativo: document.visibilityState === "visible" }),
              },
            );
            if (heartbeat.status === 401 || heartbeat.status === 403 || heartbeat.status === 503) {
              logoutPortal();
              return;
            }
            const res = await fetch(
              "https://api.144.22.247.17.sslip.io/portal/online",
            );
            const data = await res.json();
            setPortalOnline(Number(data.online || 0));
            setPortalOnlineUsers(Array.isArray(data.usuarios) ? data.usuarios : []);
          } catch {}
        };

        const carregarManutencao = async () => {
          try {
            const res = await fetch(
              "https://api.144.22.247.17.sslip.io/manutencao",
            );
            const data = await res.json();
            setMaintenanceActive(Boolean(data.ativo));
          } catch {
            setMaintenanceActive(false);
          }
        };

        useEffect(() => {
          carregarManutencao();
          const intervalo = setInterval(carregarManutencao, 30000);
          return () => clearInterval(intervalo);
        }, []);

        useEffect(() => {
          loadPortalMember();
        }, [memberToken, assistedTicket]);

        useEffect(() => {
          if (maintenanceActive && memberToken && !assistedTicket) loadPortalMember();
        }, [maintenanceActive]);

        useEffect(() => {
          if (!currentMember || !memberToken) return;
          updatePresence();
          const timer = setInterval(updatePresence, 60000);
          return () => clearInterval(timer);
        }, [currentMember?.id, memberToken]);

        const painelTourChave = `samu_painel_tutorial_${currentMember?.discord_id || ""}`;
        useEffect(() => {
          if (!currentMember || !memberToken || assistedTicket || currentView !== "landing") return;
          if (!currentMember.birth_day || !currentMember.birth_month) return;
          if (painelTour || painelTourChecado.current === memberToken) return;
          painelTourChecado.current = memberToken;
          try { if (localStorage.getItem(painelTourChave) === "1") return; } catch {}
          let cancelado = false;
          let terminou = false;
          fetch("https://api.144.22.247.17.sslip.io/portal/painel/tutorial", { headers: { Authorization: "Bearer " + memberToken } })
            .then((r) => (r.ok ? r.json() : null))
            .then((data) => { if (!cancelado && data?.mostrar) setPainelTour({ nivel: data.nivel || "coord", step: -1 }); })
            .catch(() => {})
            .finally(() => { terminou = true; });
          // Saiu da tela antes da resposta: confere de novo ao voltar.
          return () => { cancelado = true; if (!terminou) painelTourChecado.current = ""; };
        }, [currentMember?.id, currentMember?.birth_day, memberToken, assistedTicket, currentView]);
        const concluirPainelTour = () => {
          setPainelTour(null);
          try { localStorage.setItem(painelTourChave, "1"); } catch {}
          fetch("https://api.144.22.247.17.sslip.io/portal/painel/tutorial", {
            method: "POST", headers: { Authorization: "Bearer " + memberToken, "Content-Type": "application/json" }, body: "{}",
          }).catch(() => {});
        };
        const painelTourNode = painelTour && currentMember ? (
          <PainelTour nome={currentMember.nome || "membro"} nivel={painelTour.nivel} step={painelTour.step}
            setStep={(valor) => setPainelTour((t) => (t ? { ...t, step: typeof valor === "function" ? valor(t.step) : valor } : t))}
            onViewChange={setCurrentView} onFinish={concluirPainelTour} />
        ) : null;

        if (!authReady || assistedTicket)
          return <PortalLoadingScreen />;

        if (!currentMember) {
          return (
            <PortalAuthScreen
              onAuthenticated={authenticated}
              maintenance={maintenanceActive}
            />
          );
        }

        if (
          currentMember &&
          currentView !== "admin" &&
          (!currentMember.birth_day || !currentMember.birth_month)
        ) {
          return (
            <BirthdayPrompt
              member={currentMember}
              token={memberToken}
              onSaved={setCurrentMember}
            />
          );
        }

        if (currentView === "landing") {
          return (
            <React.Fragment>
              <LandingPage
                onViewChange={setCurrentView}
                currentMember={currentMember}
                memberToken={memberToken}
                portalOnline={portalOnline}
                portalOnlineUsers={portalOnlineUsers}
                onLogout={logoutPortal}
              />
              {painelTourNode}
            </React.Fragment>
          );
        }

        return (
          <div className="relative min-h-screen bg-[#fafafa] flex flex-col font-sans">
            <PortalHeader onViewChange={setCurrentView} />
            <main className="flex-grow container mx-auto px-4 py-8">
              {currentView === "requerimentos" && (
                <Requerimentos memberToken={memberToken} />
              )}
              {currentView === "corregedoria" && (
                <Corregedoria
                  currentMember={currentMember}
                  memberToken={memberToken}
                />
              )}
              {currentView === "projetos" && (
                <ProjetoRegras
                  currentMember={currentMember}
                  memberToken={memberToken}
                />
              )}
              {currentView === "buy-role" && (
                <RoleForm
                  currentMember={currentMember}
                  memberToken={memberToken}
                />
              )}
              {currentView === "request-salary" && (
                <SalaryForm
                  currentMember={currentMember}
                  memberToken={memberToken}
                  onViewChange={setCurrentView}
                />
              )}
              {currentView === "banco" && (
                <ContaSamu
                  currentMember={currentMember}
                  memberToken={memberToken}
                  onViewChange={setCurrentView}
                />
              )}
              {currentView === "courses" && (
                <CoursesHub
                  currentMember={currentMember}
                  memberToken={memberToken}
                />
              )}
              {currentView === "admin" && (
                <AdminPanel onMaintenanceChange={carregarManutencao} memberToken={memberToken} onClose={() => setCurrentView("landing")} />
              )}
            </main>
            {painelTourNode}
            <footer className="mt-12 border-t border-slate-200/70">
              <div className="max-w-6xl mx-auto px-5 py-6 text-center text-xs text-slate-400 leading-relaxed">
                © 2026 SAMU 192 — Portal institucional interno. Todos os
                direitos reservados. Este site e todo o seu conteúdo (incluindo
                textos, imagens, design, estrutura, layout, identidade visual e
                código-fonte) são protegidos pela Lei nº 9.610/1998 (Lei de
                Direitos Autorais) e demais legislações aplicáveis.
              </div>
            </footer>
          </div>
        );
      };


      // Página pública de pagamento (botão "Pagar" das mensagens de cobrança).
      // Abre em #pagar=<token>; não precisa de login nem de estar no SAMU.

      // Aviso "Baixe nosso portal" (só no celular, some se já estiver instalado).
      const AVISO_APP_FECHADO = "samu_app_aviso_fechado";
      const AvisoInstalarApp = () => {
        const ua = navigator.userAgent || "";
        const ios = /iPhone|iPad|iPod/i.test(ua) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
        const celular = ios || /Android|Mobi/i.test(ua);
        const instalado = window.matchMedia?.("(display-mode: standalone)").matches || window.navigator.standalone === true || localStorage.getItem("samu_app_instalado") === "1";
        const fechadoEm = Number(localStorage.getItem(AVISO_APP_FECHADO) || 0);
        const [visivel, setVisivel] = useState(celular && !instalado && Date.now() - fechadoEm > 7 * 86400000);
        const [passos, setPassos] = useState(false);
        const [, forcar] = useState(0);
        useEffect(() => {
          const atualizar = () => forcar((n) => n + 1);
          const instalou = () => setVisivel(false);
          window.addEventListener("samu-instalavel", atualizar);
          window.addEventListener("samu-instalado", instalou);
          return () => { window.removeEventListener("samu-instalavel", atualizar); window.removeEventListener("samu-instalado", instalou); };
        }, []);
        if (!visivel) return null;
        const baixar = async () => {
          const convite = window.__samuInstalar;
          if (convite) {
            convite.prompt();
            const escolha = await convite.userChoice.catch(() => null);
            window.__samuInstalar = null;
            if (escolha?.outcome === "accepted") setVisivel(false);
            return;
          }
          setPassos(true); // iPhone ou navegador sem instalação automática
        };
        const fechar = () => { localStorage.setItem(AVISO_APP_FECHADO, String(Date.now())); setVisivel(false); };
        return (
          <React.Fragment>
            <div className="md:hidden mt-8 flex items-center gap-3 rounded-2xl bg-white/80 backdrop-blur border border-white px-3.5 py-3 text-left shadow-sm">
              <img src="/icon-192.png" alt="" className="w-11 h-11 rounded-xl shrink-0" />
              <div className="min-w-0 flex-1">
                <p className="text-[13px] font-semibold text-slate-900 leading-tight">Baixe nosso portal no seu celular</p>
                <p className="text-[11px] text-slate-500 leading-snug mt-0.5">e acesse com mais facilidade.</p>
              </div>
              <button type="button" onClick={baixar} className="shrink-0 h-9 px-4 rounded-full bg-[#6B0F1A] text-white text-xs font-semibold active:scale-95 transition">Baixar</button>
              <button type="button" onClick={fechar} aria-label="Fechar aviso" className="shrink-0 -mr-1 w-6 h-6 rounded-full text-slate-300 hover:text-slate-500 text-sm leading-none">×</button>
            </div>
            {passos && (
              <div className="md:hidden fixed inset-0 z-[120] flex items-end bg-slate-950/40" onClick={() => setPassos(false)}>
                <div role="dialog" aria-label="Como instalar" className="w-full rounded-t-3xl bg-white px-6 pt-5 pb-8 text-left" onClick={(e) => e.stopPropagation()}>
                  <div className="mx-auto mb-5 h-1 w-10 rounded-full bg-slate-200"></div>
                  <div className="flex items-center gap-3">
                    <img src="/icon-192.png" alt="" className="w-12 h-12 rounded-xl" />
                    <div><p className="font-semibold text-slate-900">Instalar SAMUBMI</p><p className="text-xs text-slate-500">Leva poucos segundos.</p></div>
                  </div>
                  <ol className="mt-5 space-y-3 text-sm text-slate-700">
                    {ios ? (
                      <React.Fragment>
                        <li className="flex gap-3"><span className="w-6 h-6 shrink-0 rounded-full bg-slate-100 text-xs font-bold flex items-center justify-center">1</span><span>Toque em <strong>Compartilhar</strong> <span aria-hidden="true">⬆︎</span> na barra do Safari.</span></li>
                        <li className="flex gap-3"><span className="w-6 h-6 shrink-0 rounded-full bg-slate-100 text-xs font-bold flex items-center justify-center">2</span><span>Escolha <strong>Adicionar à Tela de Início</strong>.</span></li>
                        <li className="flex gap-3"><span className="w-6 h-6 shrink-0 rounded-full bg-slate-100 text-xs font-bold flex items-center justify-center">3</span><span>Toque em <strong>Adicionar</strong>. Pronto!</span></li>
                      </React.Fragment>
                    ) : (
                      <React.Fragment>
                        <li className="flex gap-3"><span className="w-6 h-6 shrink-0 rounded-full bg-slate-100 text-xs font-bold flex items-center justify-center">1</span><span>Abra o menu <strong>⋮</strong> do navegador.</span></li>
                        <li className="flex gap-3"><span className="w-6 h-6 shrink-0 rounded-full bg-slate-100 text-xs font-bold flex items-center justify-center">2</span><span>Toque em <strong>Instalar app</strong> ou <strong>Adicionar à tela inicial</strong>.</span></li>
                      </React.Fragment>
                    )}
                  </ol>
                  <button type="button" onClick={() => setPassos(false)} className="mt-6 w-full h-12 rounded-xl bg-slate-900 text-white font-semibold">Entendi</button>
                </div>
              </div>
            )}
          </React.Fragment>
        );
      };

      const PaginaPagamento = ({ token }) => {
        const [dados, setDados] = useState(null);
        const [erro, setErro] = useState("");
        const [imagem, setImagem] = useState("");
        const [enviando, setEnviando] = useState(false);
        const [msg, setMsg] = useState("");
        const [pago, setPago] = useState(null);
        const carregar = useCallback(() => {
          fetch(`${BANK_API}/cobranca/pagar/${encodeURIComponent(token)}`)
            .then(async (r) => { const d = await r.json().catch(() => ({})); if (!r.ok) throw new Error(d.erro || "Link inválido."); return d; })
            .then((d) => { setDados(d); setErro(""); })
            .catch((e) => setErro(e.message));
        }, [token]);
        useEffect(() => { carregar(); const t = setInterval(carregar, 60000); return () => clearInterval(t); }, [carregar]);
        const escolher = async (file) => {
          setMsg("");
          if (!file) return;
          if (!/^image\/(png|jpe?g|webp)$/i.test(file.type)) { setMsg("Envie uma imagem PNG, JPG ou WEBP."); return; }
          try { setImagem(await reduzirImagem(file)); } catch (e) { setMsg(e.message); }
        };
        const pagar = async () => {
          if (!imagem || enviando) return;
          setEnviando(true); setMsg("");
          try {
            const r = await fetch(`${BANK_API}/cobranca/pagar/${encodeURIComponent(token)}`, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ imagem }) });
            const d = await r.json().catch(() => ({}));
            if (!r.ok) throw new Error(d.erro || "Não foi possível registrar o pagamento.");
            setPago(d.pagamento); setImagem(""); if (d.resumo) setDados(d.resumo);
          } catch (e) { setMsg(e.message); }
          finally { setEnviando(false); }
        };
        const data = (iso) => new Date(iso).toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo" });
        const pg = dados?.pagamento;
        const emp = dados?.emprestimo;
        const rotulo = { em_dia: "Pagar adiantado", vence_hoje: "Vence hoje", atrasada: "Em atraso", bloqueado: "Acesso bloqueado" };
        const tom = { em_dia: "bg-sky-50 text-sky-700", vence_hoje: "bg-amber-50 text-amber-800", atrasada: "bg-orange-50 text-orange-700", bloqueado: "bg-rose-50 text-rose-700" };
        return (
          <div className="min-h-screen bg-[#f6f7f9] text-slate-900 flex flex-col items-center px-4 py-10">
            <div className="flex items-center gap-2 text-sm font-semibold text-slate-700"><img src="https://i.imgur.com/sD1OnjL.png" alt="" className="w-6 h-6 object-contain" />SAMUBANK</div>
            <main className="mt-6 w-full max-w-md">
              {erro ? (
                <div className="rounded-3xl bg-white border border-slate-200/80 p-8 text-center">
                  <p className="text-3xl">🔗</p>
                  <p className="mt-3 font-semibold">Link indisponível</p>
                  <p className="mt-1 text-sm text-slate-500">{erro}</p>
                </div>
              ) : !dados ? (
                <div className="rounded-3xl bg-white border border-slate-200/80 p-10 text-center text-sm text-slate-400">Carregando…</div>
              ) : (
                <div className="rounded-3xl bg-white border border-slate-200/80 overflow-hidden">
                  <div className="flex items-center gap-3 px-6 pt-6">
                    {dados.membro.avatar ? <img src={dados.membro.avatar} alt="" className="w-11 h-11 rounded-full object-cover" /> : <span className="w-11 h-11 rounded-full bg-slate-100"></span>}
                    <div className="min-w-0">
                      <p className="font-semibold truncate">{dados.membro.nome || dados.membro.usuario}</p>
                      <p className="text-xs text-slate-500 truncate">Discord vinculado{dados.membro.usuario ? ` · @${dados.membro.usuario}` : ""}</p>
                    </div>
                  </div>

                  {pago ? (
                    <div className="px-6 py-10 text-center">
                      <span className="mx-auto w-14 h-14 rounded-full bg-emerald-50 text-emerald-600 flex items-center justify-center text-2xl">✓</span>
                      <p className="mt-4 text-lg font-semibold">Pagamento efetuado</p>
                      <p className="mt-1 text-sm text-slate-500">Parcela {pago.parcela}/{pago.parcelas} · {fmtBRL(pago.valor)}</p>
                      <p className="mt-4 text-xs text-slate-400">Cobrança bem-sucedida. A próxima começa só depois do próximo fechamento.</p>
                    </div>
                  ) : !emp || !pg ? (
                    <div className="px-6 py-10 text-center">
                      <p className="text-lg font-semibold">Nada em aberto</p>
                      <p className="mt-1 text-sm text-slate-500">Você não tem parcelas para pagar.</p>
                    </div>
                  ) : (
                    <div className="px-6 pb-6">
                      {dados.pago_no_ciclo && pg.situacao === "em_dia" && (
                        <p className="mt-5 rounded-xl bg-emerald-50 px-3 py-2 text-xs font-medium text-emerald-800">✓ Pagamento deste ciclo efetuado · cobrança bem-sucedida</p>
                      )}
                      <div className="mt-6 flex items-center justify-between">
                        <p className="text-xs text-slate-500">Parcela {pg.parcela}/{pg.parcelas} · {pg.situacao === "em_dia" ? `vence ${data(pg.vencimento)}` : `venceu ${data(pg.vencimento)}`}</p>
                        <span className={`rounded-full px-2.5 py-0.5 text-[11px] font-semibold ${tom[pg.situacao]}`}>{rotulo[pg.situacao]}</span>
                      </div>
                      <p className="mt-1 text-4xl font-bold tracking-tight tabular-nums">{fmtBRL(pg.total)}</p>
                      {pg.juros > 0 && <p className="mt-1 text-xs text-slate-500">{fmtBRL(pg.bruto)} + {pg.juros_pct}% de juros{pg.situacao === "bloqueado" ? " · 5% ao dia bloqueado, atualiza sozinho" : ` · 3% ao dia (${pg.dias_atraso || 1} dia${(pg.dias_atraso || 1) > 1 ? "s" : ""})`}</p>}
                      {pg.situacao === "vence_hoje" && <p className="mt-1 text-xs text-slate-500">Após hoje, 3% de juros por dia de atraso.</p>}
                      <div className="mt-4 h-1.5 rounded-full bg-slate-100 overflow-hidden"><div className="h-full bg-emerald-500 rounded-full" style={{ width: `${(emp.pagas / Math.max(1, emp.parcelas)) * 100}%` }}></div></div>
                      <p className="mt-1.5 text-[11px] text-slate-400">{emp.pagas} de {emp.parcelas} parcelas pagas · restam {fmtBRL(emp.restante)}</p>

                      <label className="mt-6 block cursor-pointer rounded-2xl border border-dashed border-slate-300 hover:border-emerald-400 transition p-4 text-center">
                        <input type="file" accept="image/png,image/jpeg,image/webp" className="hidden" onChange={(e) => escolher(e.target.files?.[0])} />
                        {imagem ? <img src={imagem} alt="Comprovante" className="mx-auto max-h-48 rounded-xl object-contain" />
                          : <span className="block py-5 text-sm text-slate-500">Anexar foto do comprovante<span className="block text-xs text-slate-400 mt-0.5">pague {fmtBRL(pg.total)} no jogo e envie o print</span></span>}
                      </label>
                      {msg && <p role="alert" className="mt-3 rounded-xl bg-rose-50 px-3 py-2 text-sm text-rose-700">{msg}</p>}
                      <button type="button" disabled={!imagem || enviando} onClick={pagar} className="mt-4 w-full h-12 rounded-xl bg-slate-900 text-white font-semibold disabled:opacity-30 transition">{enviando ? "Enviando…" : "Pagar"}</button>
                      {pg.situacao !== "bloqueado" && <p className="mt-4 text-center text-[11px] text-slate-400">Prefere pelo salário? Complete suas 4 horas de patrulha e solicite o saque no portal: a parcela é descontada sozinha.</p>}
                    </div>
                  )}
                </div>
              )}
            </main>
            <p className="mt-6 text-[11px] text-slate-400">SAMUBANK · valores fictícios de jogo</p>
          </div>
        );
      };
      const PortalRaiz = () => {
        const m = window.location.hash.match(/^#pagar=([A-Za-z0-9_\-.]+)$/);
        return m ? <PaginaPagamento token={m[1]} /> : <App />;
      };
      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<PortalRaiz />);
    </script>
  </body>
</html>
