                  <div className="grid sm:grid-cols-2 gap-3">
                    <label className="block text-sm font-semibold text-slate-700">Título<input value={m.titulo} onChange={(e) => editar("titulo", e.target.value)} className={campo + " mt-1 font-normal"} /></label>
                    <label className="block text-sm font-semibold text-slate-700">Rótulo (etiqueta pequena)<input value={m.rotulo} onChange={(e) => editar("rotulo", e.target.value)} className={campo + " mt-1 font-normal"} /></label>
                  </div>
                  {area("intro", "Introdução", "", 3)}
                  {area("pontos", "Pontos essenciais", "Um por linha. Aparecem com ✓.")}
                  <div className="grid sm:grid-cols-2 gap-3">
                    {area("passos", "Etapas", "Uma por linha (até 8). Aparecem em blocos numerados.", 3)}
                    {area("numerada", "Regras numeradas", "Uma por linha. Aparecem como 01, 02…", 3)}
                  </div>
                  {area("grupos", "Grupos de cargos", "Um grupo por linha: Nome: cargo, cargo, cargo", 3)}
                  <div className="grid sm:grid-cols-2 gap-3">
                    {area("exemplo", "Destaque azul", "", 2)}
                    {area("aviso", "Aviso (amarelo)", "", 2)}
                  </div>
                  <label className="flex items-center gap-2 text-sm text-slate-700"><input type="checkbox" checked={m.tabela} onChange={(e) => editar("tabela", e.target.checked)} /> Mostrar a tabela de salários neste módulo</label>
                </div>
              </div>
            ) : (
              <div className="space-y-2">
                <p className="text-xs text-slate-500">De 1 a 20 perguntas. Todas são obrigatórias para o candidato. As respostas de editais já enviados não mudam.</p>
                {perguntas.map((p, i) => (
                  <div key={i} className="flex gap-2 items-start">
                    <span className="w-7 pt-2 text-sm font-bold text-slate-400 tabular-nums">{i + 1}.</span>
                    <textarea rows={2} maxLength={200} value={p} onChange={(e) => setPerguntas(perguntas.map((x, j) => (j === i ? e.target.value : x)))} className={campo} />
                    <div className="flex flex-col gap-1">
                      <button type="button" onClick={() => setPerguntas(mover(perguntas, i, -1))} className="px-2 rounded border text-xs">↑</button>
                      <button type="button" onClick={() => setPerguntas(mover(perguntas, i, 1))} className="px-2 rounded border text-xs">↓</button>
                    </div>
                    <button type="button" onClick={() => setPerguntas(perguntas.filter((_, j) => j !== i))} className="px-2 py-1 text-xs font-bold text-red-700">Remover</button>
                  </div>
                ))}
                <button type="button" disabled={perguntas.length >= 20} onClick={() => setPerguntas([...perguntas, ""])} className="px-4 py-2 rounded-lg border text-sm font-bold text-emerald-700 disabled:opacity-40">+ Adicionar pergunta</button>
              </div>
            )}
          </div>
        );
      };

      // --------------------- Painel Adm: risco, cobrança e acesso total ---------------------
      const COBRANCA_RISCO = {
        baixo: ["Sem risco", "bg-emerald-100 text-emerald-800"],
        medio: ["Risco médio", "bg-amber-100 text-amber-800"],
        alto: ["Alta chance de inadimplência", "bg-rose-100 text-rose-800"],
        desconhecido: ["Risco indisponível", "bg-slate-100 text-slate-600"],
      };
      const RiscoBadge = ({ risco, motivo = false }) => {
        if (!risco) return null;
        const [label, cor] = COBRANCA_RISCO[risco.nivel] || COBRANCA_RISCO.desconhecido;
        return (
          <span className="inline-flex flex-col items-end">
            <span title={risco.motivo} className={`rounded-full px-3 py-1 text-xs font-bold ${cor}`}>{label}</span>
            {motivo && risco.motivo && <span className="mt-1 text-[11px] text-slate-400 text-right">{risco.motivo}</span>}
          </span>
        );
      };
      const COBRANCA_CAMPOS = [
        ["titulo", "Título da mensagem", 1],
        ["aviso", "Texto do aviso (antes do prazo final)", 8],
        ["bloqueado", "Texto depois do bloqueio", 5],
        ["como_pagar_membro", "Como pagar — membro ativo (no Discord, com tag de cargo)", 4],
        ["como_pagar", "Como pagar — fora do SAMU, sem cargo, desligado ou exonerado", 3],
        ["rodape", "Rodapé", 1],
        ["titulo_vespera", "Título do aviso de véspera (um dia antes do vencimento)", 1],
        ["vespera", "Texto do aviso de véspera", 7],
      ];

      // Catálogo de todas as mensagens da cobrança, por fase. "campos" = textos
      // editáveis (salvos em Mensagens); "fixo" = texto do sistema (só leitura).
      const COBRANCA_CATALOGO = [
        { fase: "vespera", titulo: "1 · Véspera", cor: "bg-sky-500", itens: [
          { nome: "Aviso de véspera", quando: "Dia anterior ao vencimento, 11h", canal: "Privado do Discord", botoes: "💳 Pagar adiantado", campos: [["titulo_vespera", "Título", 1], ["vespera", "Texto", 4]], teste: ["vespera"] },
        ] },
        { fase: "vencimento", titulo: "2 · Vencimento", cor: "bg-amber-400", itens: [
          { nome: "Cobrança", quando: "Dia do vencimento 11h e 19h · dia seguinte 11h", canal: "Privado do Discord", botoes: "💳 Pagar", campos: [["titulo", "Título", 1], ["aviso", "Texto", 6]], teste: ["aviso", "membro"] },
        ] },
        { fase: "bloqueio", titulo: "3 · Bloqueio", cor: "bg-rose-600", itens: [
          { nome: "Acesso bloqueado", quando: "Depois do prazo final, se ainda em aberto", canal: "Privado do Discord", botoes: "💳 Pagar", campos: [["bloqueado", "Texto", 4]], teste: ["bloqueado"] },
          { nome: "Tela de bloqueio do portal", quando: "Ao entrar no portal bloqueado", canal: "Portal", botoes: "—", fixo: "Acesso bloqueado, valor em aberto e valor com juros (5% ao dia), atualizado sozinho.", teste: ["tela"] },
        ] },
        { fase: "pagamento", titulo: "4 · Pagamento", cor: "bg-emerald-500", itens: [
          { nome: "Pagamento efetuado", quando: "Ao anexar o comprovante (link Pagar ou Conta SAMU)", canal: "Privado + portal", botoes: "—", fixo: "✅ Pagamento efetuado. A próxima cobrança começa só depois do próximo fechamento." },
          { nome: "Registro para o Financeiro", quando: "Junto com o pagamento", canal: "Canal 1210692507529248858", botoes: "↩️ Desfazer (comprovante inválido)", fixo: "Membro, parcela, valor + juros e a foto do comprovante. A parcela já fica paga." },
        ] },
        { fase: "geral", titulo: "Geral", cor: "bg-slate-400", itens: [
          { nome: "Rodapé", quando: "Em todas as mensagens", canal: "Privado do Discord", botoes: "—", campos: [["rodape", "Rodapé", 1]] },
        ] },
      ];
      const dataCurta = (dia) => (dia ? dia.split("-").reverse().join("/") : "—");

      // --------------------- Painel Adm: dashboard ---------------------
      const LineChart = ({ labels, series, format = (v) => String(v), formatDica, height = 190, dicaLabels = null, destaque = -1 }) => {
        // Gráfico de barras com tooltip ao passar o cursor (barras agrupadas quando há mais de uma série).
        const [foco, setFoco] = useState(null);
        const W = 600, H = height, padL = 46, padR = 8, padT = 14, padB = 26;
        const valores = series.flatMap((serie) => serie.values.filter((v) => v !== null && v !== undefined));
        const bruto = Math.max(1, ...valores);
        const passoBase = Math.pow(10, Math.floor(Math.log10(bruto / 4)));
        const passo = Math.max(1, [1, 2, 2.5, 5, 10].map((f) => f * passoBase).find((f) => bruto / f <= 4) || passoBase * 10);
        const max = Math.ceil(bruto / passo) * passo;
        const grade = []; for (let g = 0; g <= max + 1e-9; g += passo) grade.push(g);
        const grupo = (W - padL - padR) / Math.max(1, labels.length);
        const largura = Math.min(40, (grupo * 0.62) / series.length);
        const y = (v) => padT + (H - padT - padB) * (1 - v / max);
        const corDe = (serie, i) => (Array.isArray(serie.colors) ? serie.colors[i] : serie.color);
        const dica = foco === null ? null : (() => {
          const linhas = series.map((serie) => [serie.name, serie.values[foco], corDe(serie, foco)]).filter(([, v]) => v !== null && v !== undefined);
          if (!linhas.length) return null;
          const fd = formatDica || format;
          const textos = linhas.map(([nome, v]) => (series.length > 1 ? `${nome}: ${fd(v)}` : fd(v)));
          const tituloDica = (dicaLabels && dicaLabels[foco]) || labels[foco];
          const largo = Math.max(tituloDica.length * 6.5, ...textos.map((t) => t.length * 6.8)) + 24;
          const alto = 22 + linhas.length * 16;
          const centro = padL + grupo * foco + grupo / 2;
          const x = Math.min(W - padR - largo, Math.max(padL, centro - largo / 2));
          const topoBarra = Math.min(...linhas.map(([, v]) => y(Math.max(0, v))));
          const yy = Math.max(2, topoBarra - alto - 6);
          return (
            <g pointerEvents="none">
              <rect x={x} y={yy} width={largo} height={alto} rx="6" fill="#0f172a" opacity="0.92" />
              <text x={x + 10} y={yy + 15} fontSize="10" fill="#cbd5e1">{tituloDica}</text>
              {linhas.map(([nome, v, cor], k) => (
                <g key={nome}>
                  <rect x={x + 10} y={yy + 23 + k * 16} width="8" height="8" rx="1.5" fill={cor} />
                  <text x={x + 22} y={yy + 31 + k * 16} fontSize="11" fontWeight="700" fill="#fff">{textos[k]}</text>
                </g>
              ))}
            </g>
          );
        })();
        return (
          <svg viewBox={`0 0 ${W} ${H}`} className="w-full h-auto" role="img" onMouseLeave={() => setFoco(null)}>
            {grade.map((g, k) => (
              <g key={k}>
                <line x1={padL} x2={W - padR} y1={y(g)} y2={y(g)} stroke={k === 0 ? "#cbd5e1" : "#e2e8f0"} strokeWidth="1" />
                <text x={padL - 6} y={y(g) + 4} textAnchor="end" fontSize="10" fill="#94a3b8">{format(g)}</text>
              </g>
            ))}
            {labels.map((label, i) => {
              const centro = padL + grupo * i + grupo / 2;
              const inicio = centro - (largura * series.length + 3 * (series.length - 1)) / 2;
              return (
                <g key={i} onMouseEnter={() => setFoco(i)} onClick={() => setFoco(i)} style={{ cursor: "pointer" }}>
                  <rect x={padL + grupo * i} y={padT} width={grupo} height={H - padT - padB} fill={foco === i ? "#f1f5f9" : "transparent"} />
                  {series.map((serie, k) => {
                    const v = serie.values[i];
                    if (v === null || v === undefined) return null;
                    const topo = y(Math.max(0, v));
                    return <rect key={serie.name} x={inicio + k * (largura + 3)} y={topo} width={largura} height={Math.max(0, H - padB - topo)} fill={corDe(serie, i)} rx="2" />;
                  })}
                  <text x={centro} y={H - 8} textAnchor="middle" fontSize="10" fontWeight={i === destaque ? 700 : 400} fill={foco === i || i === destaque ? "#0f172a" : "#94a3b8"}>{label}</text>
                </g>
              );
            })}
            {dica}
          </svg>
        );
      };

      // Cupons de campanha para venda de cargo (todos os administradores).
      const AdminCupons = ({ token }) => {
        const [dados, setDados] = useState(null);
        const [pct, setPct] = useState(10);
        const [codigo, setCodigo] = useState("");
        const [msg, setMsg] = useState("");
        const [ocupado, setOcupado] = useState(false);
        const load = async () => {
          try { setDados(await bankFetch("/admin/cupons", token)); } catch (err) { setMsg(err.message); }
        };
        useEffect(() => { load(); }, [token]);
        const max = dados?.max_pct || 30;
        const criar = async (e) => {
          e.preventDefault();
          setOcupado(true); setMsg("");
          try {
            const r = await bankFetch("/admin/cupons", token, { method: "POST", body: JSON.stringify({ pct: Number(pct), codigo: codigo.trim() }) });
            setMsg(`Cupom ${r.cupom.codigo} criado: ${r.cupom.pct}% de desconto até ${new Date(r.cupom.expira_em).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" })}.`);
            setCodigo("");
            await load();
          } catch (err) { setMsg(err.message); }
          finally { setOcupado(false); }
        };
        const encerrar = async (c) => {
          if (!confirm(`Encerrar o cupom ${c.codigo} agora?`)) return;
          try { await bankFetch(`/admin/cupons/${encodeURIComponent(c.codigo)}/encerrar`, token, { method: "POST" }); await load(); }
          catch (err) { setMsg(err.message); }
        };
        const copiar = (texto) => { try { navigator.clipboard.writeText(texto); setMsg(`Código ${texto} copiado.`); } catch {} };
        const quando = (iso) => new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
        const restante = (iso) => {
          const ms = Date.parse(iso) - Date.now();
          if (ms <= 0) return "expirado";
          const h = Math.floor(ms / 3600000), m = Math.floor((ms % 3600000) / 60000);
          return h ? `${h}h ${m}min restantes` : `${m}min restantes`;
        };
        const cupons = dados?.cupons || [];
        return (
          <div className="space-y-4">
            <div className="rounded-2xl border border-slate-200 bg-white p-5 md:p-6">
              <p className="text-sm text-slate-600 leading-relaxed">
                Crie cupons para as suas <strong>campanhas de venda de cargo</strong>. Cada cupom dá até <strong>{max}% de desconto</strong> e vale por <strong>24 horas</strong> a partir da criação.
                O membro digita o código no campo “Cupom” ao comprar o cargo no portal, e o desconto já sai no valor e na comissão do vendedor. Todos os administradores podem criar e encerrar cupons.
              </p>
              <form onSubmit={criar} className="mt-4 grid sm:grid-cols-[1fr_1fr_auto] gap-3 items-end">
                <label className="text-sm font-bold text-slate-700">Desconto (%)
                  <input type="number" min="1" max={max} value={pct} onChange={(e) => setPct(e.target.value)} className="mt-1 w-full rounded-xl border border-slate-200 p-2.5" required />
                </label>
                <label className="text-sm font-bold text-slate-700">Código (opcional)
                  <input type="text" value={codigo} maxLength={15} onChange={(e) => setCodigo(e.target.value.toUpperCase().replace(/[^A-Z0-9]/g, ""))} placeholder="Gerado automaticamente" className="mt-1 w-full rounded-xl border border-slate-200 p-2.5 font-mono uppercase" />
                </label>
                <button type="submit" disabled={ocupado} className="rounded-xl bg-slate-900 px-5 py-2.5 font-bold text-white hover:bg-slate-700 disabled:opacity-50">{ocupado ? "Criando…" : "Criar cupom"}</button>
              </form>
              {msg && <p role="status" className="mt-3 text-sm font-semibold text-slate-700">{msg}</p>}
            </div>
            <div className="rounded-2xl border border-slate-200 bg-white overflow-hidden">
              <p className="px-5 pt-4 pb-2 text-sm font-black">Cupons dos últimos 7 dias</p>
              {!dados ? <p className="px-5 pb-5 text-sm text-slate-500">Carregando…</p> : !cupons.length ? <p className="px-5 pb-5 text-sm text-slate-500">Nenhum cupom criado ainda.</p> : (
                <ul className="divide-y divide-slate-100">
                  {cupons.map((c) => (
                    <li key={c.codigo + c.criado_em} className="px-5 py-3 flex flex-wrap items-center justify-between gap-3">
                      <div className="min-w-0">
                        <p className="flex items-center gap-2">
                          <button type="button" onClick={() => copiar(c.codigo)} title="Copiar código" className="font-mono font-black text-slate-900 hover:text-red-700">{c.codigo}</button>
                          <span className="rounded-full bg-emerald-50 px-2 py-0.5 text-[11px] font-bold text-emerald-700 ring-1 ring-emerald-200">-{c.pct}%</span>
                          <span className={`rounded-full px-2 py-0.5 text-[11px] font-bold ring-1 ${c.ativo ? "bg-sky-50 text-sky-700 ring-sky-200" : "bg-slate-100 text-slate-500 ring-slate-200"}`}>{c.ativo ? restante(c.expira_em) : c.encerrado_em ? "encerrado" : "expirado"}</span>
                        </p>
                        <p className="text-xs text-slate-400 mt-0.5">Criado por {c.criado_por || "—"} em {quando(c.criado_em)} · válido até {quando(c.expira_em)} · {c.usos} uso(s)</p>
                      </div>
                      {c.ativo && <button type="button" onClick={() => encerrar(c)} className="rounded-lg border border-rose-200 px-3 py-1.5 text-xs font-bold text-rose-700 hover:bg-rose-50">Encerrar</button>}
                    </li>
                  ))}
                </ul>
              )}
            </div>
          </div>
        );
      };

      const AdminDashboard = ({ token }) => {
        const [dados, setDados] = useState(null);
        const [erro, setErro] = useState("");
        const load = async () => {
          setErro("");
          try { setDados(await bankFetch("/admin/dashboard", token)); }
          catch (err) { setErro(err.message); }
        };
        useEffect(() => { load(); }, [token]);
        if (!dados) return <p className="text-sm text-slate-500">{erro || "Carregando dashboard…"}</p>;
        const VERMELHO = "#e5534b", CLARO = "#f4b4ae";
        const dataCurta = (iso) => new Date(iso).toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit" });
        const n = dados.semanas.length;
        // Cada semana financeira: sábado 00h até sexta 23h59 (fecha no sábado seguinte 00h).
        const fimSemana = (iso) => new Date(Date.parse(iso) + 6 * 86400000).toISOString();
        const faixa = (iso) => `${dataCurta(iso)}–${dataCurta(fimSemana(iso))}`;
        const faixaLonga = (iso) => `sáb ${dataCurta(iso)} a sex ${dataCurta(fimSemana(iso))}`;
        const nomeSemana = (i) => (i === n - 1 ? "Semana atual" : i === n - 2 ? "Semana passada" : `${n - 1 - i} semanas atrás`);
        const semanasLabels = dados.semanas.map((iso) => faixa(iso));
        const dicasSemanas = dados.semanas.map((iso, i) => `${nomeSemana(i)} · ${faixaLonga(iso)}`);
        const atualIso = dados.semanas[n - 1], passadaIso = dados.semanas[n - 2];
        const coresSemanas = dados.semanas.map((_, i) => (i === n - 1 ? VERMELHO : CLARO));
        const moeda = (v) => (v >= 1000000 ? `R$ ${(v / 1000000).toLocaleString("pt-BR", { maximumFractionDigits: 1 })}M` : v >= 1000 ? `R$ ${Math.round(v / 1000)}k` : `R$ ${v}`);
        const metricas = [
          { key: "recrutamentos", titulo: "Recrutamentos", fmt: (v) => String(v) },
          { key: "cursos", titulo: "Cursos aplicados", fmt: (v) => String(v) },
          { key: "pagamentos_valor", titulo: "Pagamentos do SAMU", fmt: moeda, dica: fmtBRL, extra: (i) => `${dados.totais.pagamentos_qtd[i]} pagamento(s)` },
        ];
        const variacao = (atual, anterior) => {
          if (!anterior) return atual ? ["novo", "text-emerald-700"] : ["—", "text-slate-400"];
          const pct = ((atual - anterior) / anterior) * 100;
          return [`${pct >= 0 ? "▲" : "▼"} ${Math.abs(pct).toLocaleString("pt-BR", { maximumFractionDigits: 1 })}%`, pct >= 0 ? "text-emerald-700" : "text-rose-700"];
        };
        return (
          <div className="space-y-4">
            <div className="flex items-center justify-between gap-3">
              <div>
                <p className="text-sm font-semibold text-slate-900">Semana atual: {faixaLonga(atualIso)} <span className="font-normal text-slate-500">· fecha sáb {dataCurta(new Date(Date.parse(atualIso) + 7 * 86400000).toISOString())} às 00h</span></p>
                <p className="text-xs text-slate-500">Comparada com a semana passada ({faixaLonga(passadaIso)}) · passe o cursor nas barras para ver os valores · atualizado {new Date(dados.gerado_em).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}</p>
              </div>
              <button type="button" onClick={load} className="px-3 py-2 border border-slate-200 rounded-lg text-sm font-bold">Atualizar</button>
            </div>
            <div className="grid sm:grid-cols-3 gap-3">
              {metricas.map((m) => {
                const atual = dados.totais[m.key][n - 1], anterior = dados.totais[m.key][n - 2];
                const [txt, cor] = variacao(atual, anterior);
                return (
                  <div key={m.key} className="rounded-2xl border border-slate-200 bg-white p-4">
                    <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">{m.titulo}</p>
                    <p className="text-[11px] text-slate-400">semana atual · {faixa(atualIso)}</p>
                    <p className="mt-1 text-2xl font-black tabular-nums">{m.key === "pagamentos_valor" ? fmtBRL(atual) : atual}</p>
                    <p className="text-xs text-slate-500">semana passada ({faixa(passadaIso)}): {m.key === "pagamentos_valor" ? fmtBRL(anterior) : anterior} · <span className={`font-bold ${cor}`}>{txt}</span></p>
                    {m.extra && <p className="text-[11px] text-slate-400">{m.extra(n - 1)} na semana atual</p>}
                  </div>
                );
              })}
            </div>
            {metricas.map((m) => (
              <div key={m.key} className="rounded-2xl border border-slate-200 bg-white p-5">
                <div className="flex flex-wrap items-center justify-between gap-2">
                  <h3 className="font-black">{m.titulo} <span className="text-xs font-semibold text-slate-400">· comparativo das últimas {n} semanas</span></h3>
                  <div className="flex gap-3 text-xs text-slate-500">
                    <span className="inline-flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm" style={{ background: VERMELHO }}></span>Semana atual ({faixa(atualIso)})</span>
                    <span className="inline-flex items-center gap-1.5"><span className="w-2.5 h-2.5 rounded-sm" style={{ background: CLARO }}></span>Semanas anteriores</span>
                  </div>
                </div>
                <LineChart labels={semanasLabels} dicaLabels={dicasSemanas} destaque={n - 1} format={m.fmt} formatDica={m.dica} series={[{ name: m.titulo, colors: coresSemanas, values: dados.totais[m.key] }]} />
                <p className="mt-1 text-[11px] text-slate-400">Cada barra é uma semana financeira, de sábado a sexta (fecha no sábado seguinte às 00h).</p>
              </div>
            ))}
          </div>
        );
      };

      // Ranking geral de patrulha: horas de bate-ponto acumuladas, sem zerar por ciclo.
      const AdminRankingPatrulha = ({ token }) => {
        const [dados, setDados] = useState(null);
        const [erro, setErro] = useState("");
        const [busca, setBusca] = useState("");
        const [limite, setLimite] = useState(50);
        const load = async () => {
          try { setDados(await bankFetch("/admin/ranking-patrulha", token)); setErro(""); }
          catch (err) { setErro(err.message); }
        };
        useEffect(() => {
          load();
          const timer = setInterval(() => { if (document.visibilityState === "visible") load(); }, 60000);
          const aoVoltar = () => { if (document.visibilityState === "visible") load(); };
          document.addEventListener("visibilitychange", aoVoltar);
          return () => { clearInterval(timer); document.removeEventListener("visibilitychange", aoVoltar); };
        }, [token]);
        if (!dados) return <p className="text-sm text-slate-500">{erro || "Carregando ranking…"}</p>;
        const horas = (min) => {
          const h = Math.floor(min / 60), m = min % 60;
          return h ? `${h.toLocaleString("pt-BR")}h${String(m).padStart(2, "0")}` : `${m}min`;
        };
        const membros = dados.membros || [];
        const termo = busca.trim().toLocaleLowerCase("pt-BR");
        const posicao = new Map(membros.map((m, i) => [m.discord_id, i + 1]));
        const filtrados = termo ? membros.filter((m) => `${m.nome} ${m.cargo} ${m.discord_id}`.toLocaleLowerCase("pt-BR").includes(termo)) : membros;
        const lider = membros[0];
        const topo = lider?.total || 1;
        const dataCurta = (iso) => new Date(iso).toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "numeric" });
        const diaMes = (ms) => new Date(ms).toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit" });
        const antIni = dados.ciclo_anterior_inicio ? Date.parse(dados.ciclo_anterior_inicio) : NaN;
        const atuIni = dados.ciclo_inicio ? Date.parse(dados.ciclo_inicio) : NaN;
        const faixaAnterior = Number.isNaN(antIni) ? "" : `${diaMes(antIni)}–${diaMes(antIni + 6 * 86400000)}`;
        const faixaAtual = Number.isNaN(atuIni) ? "" : `${diaMes(atuIni)}–${diaMes(atuIni + 6 * 86400000)}`;
        const cards = [
          ["Horas acumuladas do SAMU", horas(dados.total_minutos), dados.desde ? `desde ${dataCurta(dados.desde)}` : "todo o histórico"],
          ["Membros no ranking", String(membros.length), "ativos no servidor e no portal"],
          ["Ciclo anterior", horas(dados.total_anterior || 0), faixaAnterior ? `soma do SAMU · ${faixaAnterior}` : "soma do SAMU"],
          ["Em patrulha agora", String(dados.em_patrulha), "contando ao vivo"],
          ["Líder", lider ? horas(lider.total) : "—", lider ? lider.nome : "ninguém pontuou ainda"],
        ];
        const medalha = ["bg-amber-400 text-white", "bg-slate-400 text-white", "bg-orange-700/80 text-white"];
        return (
          <div className="space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <p className="text-xs text-slate-500">
                Soma de todo o bate-ponto, sem zerar no ciclo · atualiza sozinho a cada minuto · última leitura {new Date(dados.gerado_em).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}
                {erro && <span className="ml-2 font-semibold text-rose-600">{erro}</span>}
              </p>
              <input value={busca} onChange={(e) => { setBusca(e.target.value); setLimite(50); }} placeholder="Buscar membro ou cargo"
                className="w-56 rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm outline-none focus:border-slate-400" />
            </div>
            <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-5">
              {cards.map(([titulo, valor, sub]) => (
                <div key={titulo} className="rounded-2xl border border-slate-200 bg-white p-4">
                  <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">{titulo}</p>
                  <p className="mt-1 text-2xl font-black tabular-nums">{valor}</p>
                  <p className="truncate text-xs text-slate-500" title={sub}>{sub}</p>
                </div>
              ))}
            </div>
            <div className="overflow-hidden rounded-2xl border border-slate-200 bg-white">
              <div className="overflow-x-auto">
                <table className="w-full min-w-[780px] text-sm">
                  <thead>
                    <tr className="border-b border-slate-100 text-[11px] uppercase tracking-wider text-slate-400">
                      <th className="w-14 px-4 py-3 text-left font-semibold">#</th>
                      <th className="px-2 py-3 text-left font-semibold">Membro</th>
                      <th className="px-3 py-3 text-left font-semibold">Horas acumuladas</th>
                      <th className="px-3 py-3 text-right font-semibold" title="Semana financeira anterior, de sábado a sexta">Ciclo anterior{faixaAnterior && <span className="block text-[10px] font-medium normal-case tracking-normal text-slate-400">{faixaAnterior}</span>}</th>
                      <th className="px-3 py-3 text-right font-semibold" title="Semana financeira atual, de sábado a sexta">Neste ciclo{faixaAtual && <span className="block text-[10px] font-medium normal-case tracking-normal text-slate-400">{faixaAtual}</span>}</th>
                      <th className="px-4 py-3 text-right font-semibold">Pontos</th>
                    </tr>
                  </thead>
                  <tbody>
                    {filtrados.slice(0, limite).map((m) => {
                      const pos = posicao.get(m.discord_id);
                      return (
                        <tr key={m.discord_id} className="border-b border-slate-50 last:border-0 hover:bg-slate-50/60">
                          <td className="px-4 py-2.5">
                            {pos <= 3
                              ? <span className={`inline-flex h-6 w-6 items-center justify-center rounded-full text-xs font-black ${medalha[pos - 1]}`}>{pos}</span>
                              : <span className="pl-1.5 font-bold tabular-nums text-slate-400">{pos}</span>}
                          </td>
                          <td className="px-2 py-2.5">
                            <div className="flex items-center gap-3">
                              <span className="relative shrink-0">
                                <img src={m.avatar || "https://cdn.discordapp.com/embed/avatars/0.png"} alt="" className="h-8 w-8 rounded-full object-cover" />
                                {m.em_patrulha && <span title="Em patrulha agora" className="absolute -bottom-0.5 -right-0.5 h-3 w-3 rounded-full border-2 border-white bg-emerald-500"></span>}
                              </span>
                              <div className="min-w-0">
                                <p className="truncate font-bold text-slate-900">{m.nome}</p>
                                <p className="text-xs text-slate-500">{m.cargo || "—"}</p>
                              </div>
                            </div>
                          </td>
                          <td className="px-3 py-2.5">
                            <div className="flex items-center gap-3">
                              <span className="w-20 font-black tabular-nums text-slate-900">{horas(m.total)}</span>
                              <div className="h-1.5 w-32 overflow-hidden rounded-full bg-slate-100"><div className="h-full rounded-full bg-slate-800" style={{ width: `${Math.max(2, (m.total / topo) * 100)}%` }}></div></div>
                            </div>
                          </td>
                          <td className="px-3 py-2.5 text-right tabular-nums text-slate-600">{m.anterior > 0 ? horas(m.anterior) : <span className="text-slate-300">—</span>}</td>
                          <td className="px-3 py-2.5 text-right tabular-nums text-slate-600">{m.ciclo > 0 ? horas(m.ciclo) : <span className="text-slate-300">—</span>}</td>
                          <td className="px-4 py-2.5 text-right tabular-nums text-slate-500">{m.sessoes.toLocaleString("pt-BR")}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              {!filtrados.length && <p className="p-6 text-center text-sm text-slate-500">{termo ? "Nenhum membro encontrado." : "Nenhuma hora de patrulha registrada."}</p>}
              {filtrados.length > limite && (
                <button type="button" onClick={() => setLimite((n) => n + 50)} className="w-full border-t border-slate-100 py-3 text-sm font-bold text-slate-600 hover:bg-slate-50">
                  Mostrar mais ({filtrados.length - limite} restantes)
                </button>
              )}
            </div>
          </div>
        );
      };

      // Saques por membro: total bruto sacado no SAMU, do maior para o menor.
      const SAQUES_PERIODOS = [["tudo", "Todo o histórico"], ["atual", "Ciclo atual"]];
      const AdminSaquesMembros = ({ token }) => {
        const [periodo, setPeriodo] = useState("tudo");
        const [dados, setDados] = useState(null);
        const [erro, setErro] = useState("");
        const [carregando, setCarregando] = useState(false);
        const [busca, setBusca] = useState("");
        const [aberto, setAberto] = useState(null);
        const [limite, setLimite] = useState(30);
        const load = async (alvo = periodo) => {
          setCarregando(true); setErro("");
          try { setDados(await bankFetch(`/admin/banco/saques-membros?periodo=${alvo}`, token)); }
          catch (err) { setErro(err.message); }
          finally { setCarregando(false); }
        };
        useEffect(() => { load(periodo); setAberto(null); setLimite(30); }, [token, periodo]);
        const dataHora = (iso) => new Date(iso).toLocaleString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "2-digit", hour: "2-digit", minute: "2-digit" });
        const dataCurta = (iso) => new Date(iso).toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit", year: "numeric" });
        const TIPOS = { salario: "Salário do cargo", setor: "Setores", ambos: "Cargo + Setores", outros: "Outros" };
        const membros = dados?.membros || [];
        const termo = busca.trim().toLocaleLowerCase("pt-BR");
        const filtrados = termo ? membros.filter((m) => `${m.nome} ${m.ingame_id} ${m.discord_id}`.toLocaleLowerCase("pt-BR").includes(termo)) : membros;
        const posicao = new Map(membros.map((m, i) => [m.ingame_id + m.nome, i + 1]));
        const maior = membros[0];
        const exportar = () => {
          const linhas = [["Posição", "Nome", "ID in-game", "Saques", "Total bruto", "Salário do cargo", "Setores", "Outros", "Não detalhado", "Taxas", "Multas/advertências/doações", "Parcelas de empréstimo", "Débito quitado", "Líquido pago", "Participação %"]];
          membros.forEach((m, i) => linhas.push([i + 1, m.nome, m.ingame_id, m.qtd, m.total_bruto, m.cargo, m.setores, m.outros, m.nao_detalhado, m.taxas, m.multas, m.parcelas, m.debito, m.total_liquido, (m.participacao * 100).toFixed(2)]));
          const csv = linhas.map((l) => l.map((c) => `"${String(c).replace(/"/g, '""')}"`).join(";")).join("\n");
          const url = URL.createObjectURL(new Blob(["﻿" + csv], { type: "text/csv;charset=utf-8" }));
          const a = document.createElement("a"); a.href = url; a.download = `saques-por-membro-${periodo}.csv`; a.click();
          setTimeout(() => URL.revokeObjectURL(url), 1000);
        };
        const Linha = ({ rotulo, valor, sinal = "", fraco = false }) => (
          <div className="flex items-center justify-between gap-3 py-1.5 text-sm">
            <span className={fraco ? "text-slate-400" : "text-slate-600"}>{rotulo}</span>
            <span className={`whitespace-nowrap tabular-nums font-semibold ${sinal === "-" ? "text-rose-600" : sinal === "+" ? "text-emerald-700" : "text-slate-900"}`}>{sinal}{fmtBRL(Math.abs(valor))}</span>
          </div>
        );
        const detalhe = (m) => (
          <div className="grid gap-4 border-t border-slate-100 bg-slate-50/70 px-4 py-5 md:px-6 lg:grid-cols-[18rem_1fr]">
            <div className="space-y-3">
              <div className="rounded-xl border border-slate-200 bg-white p-4">
                <p className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Composição do bruto</p>
                <div className="mt-1 divide-y divide-slate-100">
                  {m.cargo > 0 && <Linha rotulo="Salário do cargo" valor={m.cargo} />}
                  {m.setores > 0 && <Linha rotulo="Setores" valor={m.setores} />}
                  {m.outros > 0 && <Linha rotulo="Outros" valor={m.outros} />}
                  {m.nao_detalhado > 0 && <Linha rotulo="Sem detalhamento" valor={m.nao_detalhado} fraco />}
                  <div className="flex items-center justify-between pt-2 text-sm font-black"><span>Total bruto</span><span className="tabular-nums">{fmtBRL(m.total_bruto)}</span></div>
                </div>
                {m.emprestimo > 0 && <p className="mt-2 text-[11px] text-slate-500">Inclui {fmtBRL(m.emprestimo)} de empréstimo sacado (sem taxas).</p>}
              </div>
              <div className="rounded-xl border border-slate-200 bg-white p-4">
                <p className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">Do bruto ao líquido</p>
                <div className="mt-1 divide-y divide-slate-100">
                  <Linha rotulo="Taxas do saque" valor={m.taxas} sinal="-" />
                  {m.multas > 0 && <Linha rotulo="Multas, advertências e doações" valor={m.multas} sinal="-" />}
                  {m.parcelas > 0 && <Linha rotulo="Parcelas de empréstimo" valor={m.parcelas} sinal="-" />}
                  {m.debito > 0 && <Linha rotulo="Saldo negativo quitado" valor={m.debito} sinal="-" />}
                  {m.ajustes !== 0 && <Linha rotulo={m.ajustes > 0 ? "Doações recebidas" : "Outros acertos"} valor={m.ajustes} sinal={m.ajustes > 0 ? "+" : "-"} />}
                  <div className="flex items-center justify-between pt-2 text-sm font-black"><span>Líquido pago</span><span className="tabular-nums">{fmtBRL(m.total_liquido)}</span></div>
                </div>
                {m.comissao > 0 && <p className="mt-2 text-[11px] text-slate-500">Gasto do SAMU com o membro: {fmtBRL(m.total_liquido + m.comissao)} (líquido + comissão do Financeiro).</p>}
              </div>
            </div>
            <div className="overflow-hidden rounded-xl border border-slate-200 bg-white">
              <p className="border-b border-slate-100 px-4 py-3 text-[11px] font-semibold uppercase tracking-wider text-slate-400">Relação de pagamentos · {m.qtd} saque(s)</p>
              <div className="max-h-96 overflow-auto">
                <table className="w-full min-w-[620px] text-sm">
                  <thead className="sticky top-0 bg-white text-[11px] uppercase tracking-wider text-slate-400">
                    <tr className="border-b border-slate-100">
                      <th className="px-4 py-2 text-left font-semibold">Data</th>
                      <th className="px-3 py-2 text-left font-semibold">Pedido</th>
                      <th className="px-3 py-2 text-right font-semibold">Bruto</th>
                      <th className="px-3 py-2 text-right font-semibold">Descontos</th>
                      <th className="px-4 py-2 text-right font-semibold">Líquido</th>
                    </tr>
                  </thead>
                  <tbody>
                    {m.saques.map((p) => {
                      const partes = [p.cargo && `Cargo ${fmtBRL(p.cargo)}`, p.setores && `Setores ${fmtBRL(p.setores)}`, p.outros && `Outros${p.outros_nome ? ` (${p.outros_nome})` : ""} ${fmtBRL(p.outros)}`].filter(Boolean);
                      const descontos = p.taxas + p.multas + p.parcelas + p.debito;
                      const desc = [`Taxas ${fmtBRL(p.taxas)}`, p.multas && `Multas/adv./doações ${fmtBRL(p.multas)}`, p.parcelas && `Parcelas ${fmtBRL(p.parcelas)}`, p.debito && `Saldo negativo ${fmtBRL(p.debito)}`, p.ajustes > 0 && `Doações recebidas +${fmtBRL(p.ajustes)}`].filter(Boolean).join("\n");
                      return (
                        <tr key={p.id} className="border-b border-slate-50 last:border-0 align-top">
                          <td className="px-4 py-2.5 whitespace-nowrap text-slate-600 tabular-nums">{dataHora(p.em)}<span className="block text-[11px] text-slate-400">#{p.id}</span></td>
                          <td className="px-3 py-2.5">
                            <p className="font-semibold text-slate-800">{TIPOS[p.tipo] || "Saque"}{p.cargo_nome ? <span className="font-normal text-slate-500"> · {p.cargo_nome}</span> : null}</p>
                            <p className="text-[11px] text-slate-500">{partes.join(" + ") || "sem detalhamento"}</p>
                          </td>
                          <td className="px-3 py-2.5 text-right font-semibold tabular-nums">{fmtBRL(p.bruto)}</td>
                          <td className="px-3 py-2.5 text-right tabular-nums text-rose-600" title={desc}>{descontos ? `-${fmtBRL(descontos)}` : "—"}</td>
                          <td className="px-4 py-2.5 text-right font-semibold tabular-nums">{fmtBRL(p.liquido)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
            </div>
          </div>
        );
        const cards = dados ? [
          ["Total bruto sacado", fmtBRL(dados.total_bruto), `${dados.qtd_saques} saque(s) pago(s)`],
          ["Líquido pago", fmtBRL(dados.total_liquido), dados.total_comissao ? `+ ${fmtBRL(dados.total_comissao)} de comissão do Financeiro` : "valor entregue aos membros"],
          ["Membros que sacaram", String(membros.length), membros.length ? `média de ${fmtBRL(Math.round(dados.total_bruto / membros.length))} bruto` : "—"],
          ["Maior gasto", maior ? fmtBRL(maior.total_bruto) : "—", maior ? `${maior.nome} · ${(maior.participacao * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 })}% do total` : "nenhum saque no período"],
        ] : [];
        return (
          <div className="space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div className="inline-flex flex-wrap rounded-xl border border-slate-200 bg-white p-1">
                {SAQUES_PERIODOS.map(([key, rotulo]) => (
                  <button key={key} type="button" onClick={() => setPeriodo(key)} disabled={carregando}
                    className={`rounded-lg px-3 py-1.5 text-sm font-semibold transition ${periodo === key ? "bg-slate-900 text-white" : "text-slate-600 hover:bg-slate-50"}`}>{rotulo}</button>
                ))}
              </div>
              <div className="flex items-center gap-2">
                <input value={busca} onChange={(e) => setBusca(e.target.value)} placeholder="Buscar membro ou ID"
                  className="w-48 rounded-lg border border-slate-200 px-3 py-2 text-sm outline-none focus:border-slate-400" />
                <button type="button" onClick={exportar} disabled={!membros.length} className="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-bold disabled:opacity-40">Exportar CSV</button>
                <button type="button" onClick={() => load()} disabled={carregando} className="rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm font-bold disabled:opacity-40">{carregando ? "Carregando…" : "Atualizar"}</button>
              </div>
            </div>
            {erro && <p className="rounded-lg bg-rose-50 px-3 py-2 text-sm text-rose-700">{erro}</p>}
            {!dados ? <p className="text-sm text-slate-500">{erro ? "" : "Carregando saques…"}</p> : (
              <React.Fragment>
                <p className="text-xs text-slate-500">
                  Saques pagos {dados.desde && dados.ate ? `de ${dataCurta(dados.desde)} a ${dataCurta(new Date(Date.parse(dados.ate) - 1).toISOString())}` : dados.desde ? `desde ${dataCurta(dados.desde)}` : ""}{periodo === "atual" ? " (ciclo em andamento)" : ""} · total bruto = salário do cargo + setores + outros, antes de taxas e descontos · atualizado {new Date(dados.gerado_em).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}
                </p>
                <div className="grid gap-3 sm:grid-cols-2 xl:grid-cols-4">
                  {cards.map(([titulo, valor, sub]) => (
                    <div key={titulo} className="rounded-2xl border border-slate-200 bg-white p-4">
                      <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">{titulo}</p>
                      <p className="mt-1 text-2xl font-black tabular-nums">{valor}</p>
                      <p className="truncate text-xs text-slate-500" title={sub}>{sub}</p>
                    </div>
                  ))}
                </div>
                <div className="overflow-hidden rounded-2xl border border-slate-200 bg-white">
                  <div className="overflow-x-auto">
                    <table className="w-full min-w-[720px] text-sm">
                      <thead>
                        <tr className="border-b border-slate-100 text-[11px] uppercase tracking-wider text-slate-400">
                          <th className="w-12 px-4 py-3 text-left font-semibold">#</th>
                          <th className="px-2 py-3 text-left font-semibold">Membro</th>
                          <th className="px-3 py-3 text-center font-semibold">Saques</th>
                          <th className="px-3 py-3 text-left font-semibold">Participação</th>
                          <th className="px-3 py-3 text-right font-semibold">Total bruto</th>
                          <th className="px-3 py-3 text-right font-semibold">Líquido pago</th>
                          <th className="px-4 py-3"></th>
                        </tr>
                      </thead>
                      {filtrados.slice(0, limite).map((m) => {
                        const chave = m.ingame_id + m.nome;
                        const pos = posicao.get(chave);
                        const expandido = aberto === chave;
                        return (
                          <tbody key={chave} className="border-b border-slate-100 last:border-0">
                            <tr className={`hover:bg-slate-50/70 ${expandido ? "bg-slate-50/70" : ""}`}>
                              <td className={`px-4 py-3 font-black tabular-nums ${pos <= 3 ? "text-slate-900" : "text-slate-400"}`}>{pos}</td>
                              <td className="px-2 py-3">
                                <div className="flex items-center gap-3">
                                  <img src={m.avatar_url || "https://cdn.discordapp.com/embed/avatars/0.png"} alt="" className="h-8 w-8 rounded-full object-cover" />
                                  <div className="min-w-0">
                                    <p className="truncate font-bold text-slate-900">{m.nome}</p>
                                    <p className="text-xs text-slate-500">ID {m.ingame_id || "—"}</p>
                                  </div>
                                </div>
                              </td>
                              <td className="px-3 py-3 text-center tabular-nums text-slate-700">{m.qtd}</td>
                              <td className="px-3 py-3">
                                <div className="flex items-center gap-2">
                                  <div className="h-1.5 w-24 overflow-hidden rounded-full bg-slate-100"><div className="h-full rounded-full bg-slate-800" style={{ width: `${Math.max(2, m.participacao * 100)}%` }}></div></div>
                                  <span className="text-xs tabular-nums text-slate-500">{(m.participacao * 100).toLocaleString("pt-BR", { maximumFractionDigits: 1 })}%</span>
                                </div>
                              </td>
                              <td className="px-3 py-3 text-right font-black tabular-nums text-slate-900">{fmtBRL(m.total_bruto)}</td>
                              <td className="px-3 py-3 text-right tabular-nums text-slate-600">{fmtBRL(m.total_liquido)}</td>
                              <td className="px-4 py-3 text-right">
                                <button type="button" onClick={() => setAberto(expandido ? null : chave)}
                                  className="whitespace-nowrap rounded-lg border border-slate-200 px-3 py-1.5 text-xs font-bold text-slate-700 hover:bg-white">{expandido ? "Fechar" : "Mais informações"}</button>
                              </td>
                            </tr>
                            {expandido && <tr><td colSpan={7} className="p-0">{detalhe(m)}</td></tr>}
                          </tbody>
                        );
                      })}
                    </table>
                  </div>
                  {!filtrados.length && <p className="p-6 text-center text-sm text-slate-500">{termo ? "Nenhum membro encontrado." : "Nenhum saque pago neste período."}</p>}
                  {filtrados.length > limite && (
                    <button type="button" onClick={() => setLimite((n) => n + 30)} className="w-full border-t border-slate-100 py-3 text-sm font-bold text-slate-600 hover:bg-slate-50">
                      Mostrar mais ({filtrados.length - limite} restantes)
                    </button>
                  )}
                </div>
              </React.Fragment>
            )}
          </div>
        );
      };

      // Patrulhamento da Gestão: meta de 1h de bate-ponto por dia, todos os dias do ciclo.
      const AdminPatrulhaGestao = ({ token }) => {
        const [ciclo, setCiclo] = useState(0);
        const [dados, setDados] = useState(null);
        const [erro, setErro] = useState("");
        const [carregando, setCarregando] = useState(false);
        const load = async (alvo = ciclo, silencioso = false) => {
          if (!silencioso) setCarregando(true);
          try { setDados(await bankFetch(`/admin/patrulha-gestao?ciclo=${alvo}`, token)); setErro(""); }
          catch (err) { setErro(err.message); }
          finally { if (!silencioso) setCarregando(false); }
        };
        useEffect(() => { load(ciclo); }, [token, ciclo]);
        // Atualiza sozinho a cada minuto no ciclo atual, só com a aba visível.
        useEffect(() => {
          if (ciclo !== 0) return undefined;
          const timer = setInterval(() => { if (document.visibilityState === "visible") load(0, true); }, 60000);
          const aoVoltar = () => { if (document.visibilityState === "visible") load(0, true); };
          document.addEventListener("visibilitychange", aoVoltar);
          return () => { clearInterval(timer); document.removeEventListener("visibilitychange", aoVoltar); };
        }, [token, ciclo]);
        if (!dados) return <p className="text-sm text-slate-500">{erro || "Carregando patrulhamento…"}</p>;
        const tz = { timeZone: "America/Sao_Paulo" };
        const dataCurta = (iso) => new Date(iso).toLocaleDateString("pt-BR", { ...tz, day: "2-digit", month: "2-digit" });
        const diaSemana = (iso) => new Date(iso).toLocaleDateString("pt-BR", { ...tz, weekday: "short" }).replace(".", "");
        const hora = (iso) => new Date(iso).toLocaleTimeString("pt-BR", { ...tz, hour: "2-digit", minute: "2-digit" });
        const dur = (min) => (min >= 60 ? `${Math.floor(min / 60)}h${String(min % 60).padStart(2, "0")}` : `${min}min`);
        const meta = dados.meta_minutos;
        const membros = dados.membros || [];
        const hoje = dados.dia_atual;
        const decorridos = dados.dias_decorridos;
        // Meta do ciclo inteiro (3h), sem mínimo por dia.
        const bateu = (m) => m.total >= meta;
        const metaCiclo = membros.filter(bateu).length;
        // "No ritmo": horas feitas até agora ≥ proporção da meta pelos dias já decorridos.
        const ritmoEsperado = Math.round((meta * decorridos) / 7);
        const emDia = (m) => bateu(m) || m.total >= ritmoEsperado;
        const emPatrulha = membros.filter((m) => m.em_patrulha).length;
        const fimCiclo = new Date(Date.parse(dados.fim) - 1).toISOString();
        const cards = [
          ["Membros da gestão", String(membros.length), "Coordenador a Presidente"],
          ["Meta do ciclo cumprida", `${metaCiclo}/${membros.length}`, `${dur(meta)} por ciclo · sem mínimo diário`],
          hoje !== null
            ? ["Em patrulha agora", String(emPatrulha), `${membros.filter(emDia).length} no ritmo da meta`]
            : ["Horas da gestão", dur(membros.reduce((s, m) => s + m.total, 0)), "somadas no ciclo"],
        ];
        const TURNOS = {
          madrugada: ["🌌", "Madrugada", "00h–06h", "bg-indigo-50 text-indigo-700 ring-indigo-100"],
          manha: ["🌅", "Manhã", "06h–12h", "bg-amber-50 text-amber-700 ring-amber-100"],
          tarde: ["☀️", "Tarde", "12h–18h", "bg-orange-50 text-orange-700 ring-orange-100"],
          noite: ["🌙", "Noite", "18h–00h", "bg-slate-100 text-slate-700 ring-slate-200"],
        };
        const turnoCelula = (t) => {
          if (!t || !TURNOS[t.nome]) return <span className="text-xs text-slate-300" title="Sem pontos nos últimos 30 dias">—</span>;
          const [icone, nome, faixa, estilo] = TURNOS[t.nome];
          const dist = Object.keys(TURNOS).map((k) => `${TURNOS[k][1]} (${TURNOS[k][2]}): ${t.distribuicao?.[k] || 0} ponto(s)`).join("\n");
          return (
            <span title={`Costuma entrar de ${nome.toLowerCase()} (${faixa}) · ${t.pct}% dos pontos\nÚltimos 30 dias · ${t.sessoes} ponto(s)\n\n${dist}`}
              className={`inline-flex items-center gap-1 rounded-full px-2 py-0.5 text-xs font-semibold ring-1 ${estilo}`}>
              <span aria-hidden="true">{icone}</span>{nome}
            </span>
          );
        };
        // Frequência de horas no ciclo: horas feitas ÷ meta do ciclo (3h).
        const esperadoCiclo = meta;
        // Tira o 「SAMU」 do apelido para a coluna ocupar menos espaço.
        const nomeCurto = (nome) => String(nome || "").replace(/[「\[]\s*SAMU\s*[」\]]/gi, "").replace(/\s+/g, " ").trim() || nome;
        const freqCelula = (m) => {
          const pct = esperadoCiclo > 0 ? Math.round((m.total / esperadoCiclo) * 100) : 0;
          const cor = pct >= 100 ? ["bg-emerald-500", "text-emerald-700"] : pct >= 70 ? ["bg-amber-400", "text-amber-700"] : ["bg-rose-400", "text-rose-600"];
          return (
            <span title={`${dur(m.total)} de ${dur(esperadoCiclo)} da meta do ciclo${bateu(m) ? "\nMeta cumprida" : `\nFaltam ${dur(Math.max(0, meta - m.total))}`}`}
              className="inline-flex items-center gap-1.5">
              <span className="h-1.5 w-10 overflow-hidden rounded-full bg-slate-100">
                <span className={`block h-full rounded-full ${cor[0]}`} style={{ width: `${Math.min(100, pct)}%` }}></span>
              </span>
              <span className={`w-9 text-right text-xs font-black tabular-nums ${cor[1]}`}>{pct}%</span>
            </span>
          );
        };
        const celula = (m, d, i) => {
          if (hoje !== null && i > hoje) return <span className="text-slate-200">·</span>;
          const sessoes = d.sessoes.map((x) => `${hora(x.inicio)} – ${x.fim ? hora(x.fim) : "em andamento"}`).join("\n");
          const aberto = d.sessoes.some((x) => !x.fim);
          const estilo = d.minutos > 0 ? "bg-emerald-50 text-emerald-700 ring-emerald-100"
            : "text-slate-300 ring-transparent";
          return (
            <span title={sessoes ? `Ponto aberto:\n${sessoes}` : i === hoje ? "Ainda sem ponto hoje" : "Sem ponto neste dia (não há mínimo diário)"}
              className={`inline-flex min-w-[2.75rem] items-center justify-center gap-1 rounded-md px-1 py-1 text-xs font-semibold tabular-nums ring-1 ${estilo}`}>
              {aberto && <span className="h-1.5 w-1.5 rounded-full bg-emerald-500 animate-pulse"></span>}
              {d.minutos > 0 || d.sessoes.length ? dur(d.minutos) : "—"}
            </span>
          );
        };
        return (
          <div className="space-y-4">
            <div className="flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <button type="button" aria-label="Ciclo anterior" disabled={ciclo >= dados.ciclos - 1 || carregando} onClick={() => setCiclo((c) => c + 1)}
                  className="h-9 w-9 rounded-lg border border-slate-200 bg-white font-bold text-slate-600 hover:bg-slate-50 disabled:opacity-40">‹</button>
                <div className="min-w-[10.5rem] text-center">
                  <p className="text-sm font-black">Ciclo {dataCurta(dados.inicio)} – {dataCurta(fimCiclo)}</p>
                  <p className="text-[11px] font-semibold uppercase tracking-wider text-slate-400">{ciclo === 0 ? "Ciclo atual" : ciclo === 1 ? "Ciclo anterior" : `${ciclo} ciclos atrás`}</p>
                </div>
                <button type="button" aria-label="Próximo ciclo" disabled={ciclo === 0 || carregando} onClick={() => setCiclo((c) => Math.max(0, c - 1))}
                  className="h-9 w-9 rounded-lg border border-slate-200 bg-white font-bold text-slate-600 hover:bg-slate-50 disabled:opacity-40">›</button>
              </div>
              <p className="text-xs text-slate-500">
                {ciclo === 0 ? "Atualiza sozinho a cada minuto" : "Ciclo encerrado"} · última leitura {new Date(dados.gerado_em).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}
                {erro && <span className="ml-2 font-semibold text-rose-600">{erro}</span>}
              </p>
            </div>
            <div className="grid gap-3 sm:grid-cols-3">
              {cards.map(([titulo, valor, sub]) => (
                <div key={titulo} className="rounded-2xl border border-slate-200 bg-white p-4">
                  <p className="text-xs font-semibold uppercase tracking-wider text-slate-400">{titulo}</p>
                  <p className="mt-1 text-2xl font-black tabular-nums">{valor}</p>
                  <p className="text-xs text-slate-500">{sub}</p>

                                <p className="truncate font-bold text-slate-900" title={nomeCurto(m.nome)}>{nomeCurto(m.nome)}</p>

                              </div>
                            </div>

                          {m.dias.map((d, i) => (
                            <td key={i} className={`px-0.5 py-2.5 text-center ${i === hoje ? "bg-slate-50" : ""}`}>{celula(m, d, i)}</td>
                          ))}
                          <td className="px-1.5 py-2.5 text-center">
                            <span className={`text-sm font-black tabular-nums whitespace-nowrap ${tom}`} title={bateu(m) ? "Meta do ciclo cumprida" : `Faltam ${dur(Math.max(0, meta - m.total))}`}>{bateu(m) ? "✓ " : ""}{dur(Math.min(m.total, meta))}/{dur(meta)}</span>
                          </td>
                          <td className="px-1.5 py-2.5 text-center whitespace-nowrap">{turnoCelula(m.turno)}</td>
                          <td className="px-1.5 py-2.5 text-right font-semibold tabular-nums whitespace-nowrap text-slate-700">{dur(m.total)}</td>
                          <td className="pl-1.5 pr-4 py-2.5 text-right whitespace-nowrap">{freqCelula(m)}</td>
                        </tr>
                      );
                    })}
                  </tbody>
                </table>
              </div>
              {!membros.length && <p className="p-6 text-center text-sm text-slate-500">Nenhum membro com cargo de gestão encontrado.</p>}
            </div>
            <div className="flex flex-wrap items-center gap-4 text-xs text-slate-500">
              <span className="inline-flex items-center gap-1.5"><span className="h-2.5 w-2.5 rounded-sm bg-emerald-100 ring-1 ring-emerald-200"></span>Horas patrulhadas no dia</span>
              <span className="inline-flex items-center gap-1.5"><span className="font-bold text-slate-300">—</span>Sem ponto no dia</span>
              <span>Meta: {dur(meta)} somadas no ciclo, sem mínimo por dia.</span>
              <span className="inline-flex items-center gap-1.5"><span className="h-1.5 w-1.5 rounded-full bg-emerald-500"></span>Em patrulha agora</span>
              <span>Frequência = horas feitas ÷ meta do ciclo. Passe o cursor no dia, no turno ou na frequência para ver os detalhes.</span>
            </div>
          </div>
        );
      };

      const PRESENCA_INFO = { online: ["bg-green-500", "Online"], idle: ["bg-yellow-400", "Ausente"], dnd: ["bg-red-500", "Não perturbe"], offline: ["bg-gray-400", "Offline"] };
      const AvatarPresenca = ({ src, status, size = "w-8 h-8" }) => {
        const [cor, nome] = PRESENCA_INFO[status] || PRESENCA_INFO.offline;
        return (
          <span className="relative shrink-0 inline-block" title={`Discord: ${nome}`}>
            <img src={src || "https://cdn.discordapp.com/embed/avatars/0.png"} alt="" className={`${size} rounded-full object-cover ring-2 ring-slate-100`} />
            <span className={`absolute -bottom-0.5 -right-0.5 w-3 h-3 rounded-full border-2 border-white ${cor}`}></span>
          </span>
        );
      };

      // Resume os envios de uma parcela em 3 etapas: véspera, vencimento e após o vencimento.
      const COBRANCA_ETAPAS_FLUXO = [["vespera", "Véspera"], ["vencimento", "Vencimento"], ["pos_vencimento", "Após vencimento"]];
      const cobrancaResumoEtapas = (envios = []) => COBRANCA_ETAPAS_FLUXO.map(([fase, label]) => {
        const lista = envios.filter((e) => e.fase === fase);
        const ok = lista.filter((e) => e.status === "entregue");
        const falhou = lista.filter((e) => e.status === "falhou");
        const agendado = lista.filter((e) => e.status === "agendado").sort((a, b) => String(a.agendado).localeCompare(String(b.agendado)));
        if (ok.length) return { fase, label, estado: "ok", quando: ok[ok.length - 1].em, extra: `${ok.length}/${lista.length} entregue(s)` };
        if (falhou.length) return { fase, label, estado: "falhou", quando: falhou[falhou.length - 1].em, extra: "privado fechado" };
        if (agendado.length) return { fase, label, estado: "agendado", quando: agendado[0].agendado };
        return { fase, label, estado: lista.length ? "pulado" : "nenhum" };
      });
      const COBRANCA_ETAPA_ESTILO = {
        ok: ["✓", "bg-emerald-600 text-white border-emerald-600", "text-emerald-700"],
        falhou: ["✗", "bg-rose-600 text-white border-rose-600", "text-rose-700"],
        agendado: ["", "bg-white text-slate-400 border-slate-300", "text-slate-500"],
        pulado: ["–", "bg-slate-100 text-slate-400 border-slate-200", "text-slate-400"],
        nenhum: ["", "bg-white text-slate-300 border-slate-200", "text-slate-400"],
      };
      const CobrancaStepper = ({ envios }) => {
        const etapas = cobrancaResumoEtapas(envios);
        const quando = (iso) => iso ? new Date(iso).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" }) : "";
        return (
          <ol className="flex items-start w-full">
            {etapas.map((e, i) => {
              const [icone, bolha, texto] = COBRANCA_ETAPA_ESTILO[e.estado];
              const sub = e.estado === "ok" ? `enviado ${quando(e.quando)}` : e.estado === "falhou" ? `não entregue · ${quando(e.quando)}`
                : e.estado === "agendado" ? `agendado ${quando(e.quando)}` : e.estado === "pulado" ? "não enviado" : "—";
              return (
                <li key={e.fase} className="flex-1 min-w-0 flex flex-col items-center text-center relative">
                  {i > 0 && <span aria-hidden="true" className={`absolute top-3 right-1/2 w-full h-0.5 ${etapas[i - 1].estado === "ok" || etapas[i - 1].estado === "falhou" ? "bg-slate-300" : "bg-slate-200"}`}></span>}
                  <span className={`relative z-10 w-6 h-6 rounded-full border-2 flex items-center justify-center text-[11px] font-black ${bolha}`}>{icone || (e.estado === "agendado" ? <span className="w-1.5 h-1.5 rounded-full bg-slate-300"></span> : "")}</span>
                  <span className="mt-1.5 text-[11px] font-bold text-slate-700">{e.label}</span>
                  <span className={`text-[10px] leading-tight px-1 ${texto}`}>{sub}</span>
                </li>
              );
            })}
          </ol>
        );
      };

      // somenteLeitura: administradores sem super permissão só visualizam (sem botões de ação).
      // Limite de gasto por ciclo da conta corporativa (somente o painel do owner altera).

      // Tela inicial do painel: limite semanal do SAMU (só título e valor).
      const AdminSamuResumo = ({ token }) => {
        const [d, setD] = useState(null);
        const [erro, setErro] = useState("");
        useEffect(() => {
          let vivo = true;
          const carregar = () => bankFetch("/admin/banco/samu-resumo", token).then((r) => vivo && (setD(r), setErro(""))).catch((e) => vivo && setErro(e.message));
          carregar();
          const t = setInterval(carregar, 60000);
          return () => { vivo = false; clearInterval(t); };
        }, [token]);
        const pct = d ? Math.min(100, (d.usado / Math.max(1, d.limite)) * 100) : 0;
        const cards = [
          { rotulo: "Limite semanal SAMU", valor: d?.limite, cls: "adm-kpi" },
          { rotulo: "Usado", valor: d?.usado, cls: "adm-kpi" },
          { rotulo: "Restante", valor: d?.restante, cls: `adm-kpi ${d && d.restante < 0 ? "adm-kpi--rose" : "adm-kpi--emerald"}` },
        ];
        return (
          <section aria-label="Limite semanal do SAMU" className="space-y-3">
            <div className="grid sm:grid-cols-3 gap-3">
              {cards.map((c) => (
                <div key={c.rotulo} className={c.cls}>
                  <p className="adm-kpi__label">{c.rotulo}</p>
                  <p className="adm-kpi__value">{d ? fmtBRL(c.valor) : erro ? "—" : "…"}</p>
                </div>
              ))}
            </div>
            <div className="adm-meter" role="progressbar" aria-valuenow={Math.round(pct)} aria-valuemin={0} aria-valuemax={100} aria-label="Uso do limite">
              <span style={{ width: `${pct}%` }} className={pct >= 90 ? "is-rose" : pct >= 70 ? "is-amber" : "is-ok"}></span>
            </div>
          </section>
        );
      };

      const AdminLimiteCorporativo = ({ token }) => {
        const [dados, setDados] = useState(null);
        const [valor, setValor] = useState("");
        const [msg, setMsg] = useState("");
        const [salvando, setSalvando] = useState(false);
        const [liberando, setLiberando] = useState("");
        const load = async () => {
          try {
            const r = await bankFetch("/admin/banco/corporativa-limite", token);
            setDados(r);
            setValor(String(r.limite));
          } catch (err) { setMsg(err.message); }
        };
        useEffect(() => { load(); }, [token]);
        const salvar = async (e) => {
          e.preventDefault();
          const limite = Number(String(valor).replace(/\D/g, ""));
          if (!limite) { setMsg("Informe um limite maior que zero."); return; }
          if (!confirm(`Alterar o limite semanal de gastos do SAMU para ${fmtBRL(limite)} por ciclo?`)) return;
          setSalvando(true);
          try {
            await bankFetch("/admin/banco/corporativa-limite", token, { method: "PUT", body: JSON.stringify({ limite }) });
            setMsg(`Limite salvo: ${fmtBRL(limite)} por ciclo.`);
            await load();
          } catch (err) { setMsg(err.message); }
          finally { setSalvando(false); }
        };
        const liberar = async (r) => {
          if (!confirm(`Desbloquear ${fmtBRL(r.pendente)} de ${r.nome || r.discord_id} agora?\n\nO valor fica disponível em Setores para saque imediato e o membro fica isento do limite pelo resto deste ciclo.`)) return;
          setLiberando(r.chave);
          try {
            const res = await bankFetch("/admin/banco/samu-limite/liberar", token, { method: "POST", body: JSON.stringify({ chave: r.chave }) });
            setMsg(`${fmtBRL(res.valor)} desbloqueados para ${r.nome || r.discord_id}.`);
            await load();
          } catch (err) { setMsg(err.message); }
          finally { setLiberando(""); }
        };
        const pct = dados ? Math.min(100, Math.round((dados.gasto / Math.max(1, dados.limite)) * 100)) : 0;
        const retidos = dados?.retidos || [];
        return (
          <div className="space-y-4">
            <div className="grid sm:grid-cols-3 gap-3">
              <div className="rounded-2xl bg-slate-900 px-5 py-4 text-white">
                <p className="text-xs text-slate-300">Limite de gastos do SAMU por ciclo</p>
                <p className="text-2xl font-black tabular-nums mt-1">{dados ? fmtBRL(dados.limite) : "Carregando…"}</p>
              </div>
              <div className="rounded-2xl bg-amber-50 px-5 py-4">
                <p className="text-xs text-amber-700">Gasto do SAMU neste ciclo</p>
                <p className="text-2xl font-black tabular-nums text-amber-900 mt-1">{dados ? fmtBRL(dados.gasto) : "Carregando…"}</p>
                {dados && <p className="mt-1 text-[11px] text-amber-800">pagos aos membros + comissão do Financeiro {fmtBRL(dados.gasto_pago)} · envios da corporativa {fmtBRL(dados.gasto_corporativa_conta === false ? 0 : dados.gasto_corporativa)}</p>}
              </div>
              <div className={`rounded-2xl px-5 py-4 ${dados && dados.disponivel < 0 ? "bg-rose-50" : "bg-emerald-50"}`}>
                <p className={`text-xs ${dados && dados.disponivel < 0 ? "text-rose-700" : "text-emerald-700"}`}>Ainda disponível</p>
                <p className={`text-2xl font-black tabular-nums mt-1 ${dados && dados.disponivel < 0 ? "text-rose-800" : "text-emerald-900"}`}>{dados ? fmtBRL(dados.disponivel) : "Carregando…"}</p>
              </div>
            </div>
            {dados && (
              <div className="rounded-2xl border border-slate-200 bg-white p-5">
                <div className="flex items-center justify-between text-xs text-slate-500">
                  <span>Ciclo de {new Date(dados.ciclo_inicio).toLocaleDateString("pt-BR")} até {new Date(dados.ciclo_fim).toLocaleDateString("pt-BR")} (renova no fechamento de sábado)</span>
                  <span className="font-bold text-slate-900">{pct}%</span>
                </div>
                <div className="mt-2 h-2.5 rounded-full bg-slate-100 overflow-hidden">
                  <div className={`h-full rounded-full ${pct >= 90 ? "bg-red-500" : pct >= 70 ? "bg-amber-500" : "bg-emerald-500"}`} style={{ width: `${pct}%` }}></div>
                </div>
                <p className="mt-3 text-xs text-slate-500 leading-relaxed">Gasto do ciclo (sábado 00h → sábado 00h) = <b>valor pago aos membros</b> pelo Financeiro neste ciclo + <b>comissão do Financeiro</b> + <b>envios da conta corporativa</b> para alguém. A taxa de saque (3%) e o super salário (7%) não contam como gasto, e a verba de {fmtBRL(10000000)} da corporativa não conta: só o que ela envia. Saques pendentes só entram quando forem pagos — por isso um saque pendente pode passar e o limite ficar negativo. Ainda disponível = limite − gasto. Se um saque novo passar do disponível, o SAMU paga o que cabe e o restante fica retido para o próximo ciclo com {fmtBRL(dados.bonus_valor)} de recompensa (uma por membro por ciclo).</p>
                {(dados.corporativa_envios || []).length > 0 && (
                  <details className="mt-3 rounded-xl border border-slate-200">
                    <summary className="cursor-pointer px-4 py-2.5 text-xs font-semibold text-slate-700">Envios da conta corporativa neste ciclo ({dados.corporativa_envios.length}) · {fmtBRL(dados.gasto_corporativa)}</summary>
                    <ul className="divide-y divide-slate-100 text-xs max-h-64 overflow-y-auto">
                      {dados.corporativa_envios.map((e, i) => (
                        <li key={i} className="px-4 py-2 flex justify-between gap-3"><span className="min-w-0 truncate">{bankDateTime(e.em)} · para <b>{e.para_nome || e.para_id}</b>{e.descricao ? ` · ${e.descricao}` : ""}</span><span className="tabular-nums font-semibold">{fmtBRL(e.valor)}</span></li>
                      ))}
                    </ul>
                  </details>
                )}
              </div>
            )}
            <div className="rounded-2xl border border-slate-200 bg-white overflow-hidden">
              <div className="flex flex-wrap items-center justify-between gap-2 px-5 py-4 border-b border-slate-100">
                <div>
                  <h3 className="font-black">Saques retidos neste ciclo</h3>
                  <p className="text-xs text-slate-500">Membros que pediram acima do limite. Desbloquear libera o valor agora em Setores e isenta o membro do limite até o fim do ciclo.</p>
                </div>
                {dados && <span className="rounded-full bg-sky-50 px-3 py-1 text-xs font-bold text-sky-800">Retido: {fmtBRL(dados.retido_total)}</span>}
              </div>
              {!retidos.length ? <p className="p-6 text-center text-sm text-slate-500">{dados ? "Nenhum saque retido neste ciclo." : "Carregando…"}</p> : (
                <div className="overflow-x-auto">
                  <table className="w-full text-sm">
                    <thead><tr className="border-b border-slate-100 text-[11px] uppercase tracking-wider text-slate-400">
                      <th className="px-4 py-3 text-left font-semibold">Membro</th>
                      <th className="px-3 py-3 text-left font-semibold">Quando</th>
                      <th className="px-3 py-3 text-right font-semibold">Retido</th>
                      <th className="px-3 py-3 text-right font-semibold">Recompensa</th>
                      <th className="px-3 py-3 text-right font-semibold">Pendente</th>
                      <th className="px-4 py-3 text-right font-semibold"></th>
                    </tr></thead>
                    <tbody>
                      {retidos.map((r) => (
                        <tr key={r.chave} className="border-b border-slate-50 last:border-0">
                          <td className="px-4 py-2.5">
                            <div className="flex items-center gap-2.5">
                              <img src={r.avatar_url || "https://cdn.discordapp.com/embed/avatars/0.png"} alt="" className="h-8 w-8 rounded-full object-cover" />
                              <div className="min-w-0">
                                <p className="truncate font-bold text-slate-900">{r.nome || r.discord_id}</p>
                                <p className="truncate text-xs text-slate-500">{r.ingame_id ? `ID ${r.ingame_id}` : r.discord_id}{r.pagamento_id ? ` · pagamento #${r.pagamento_id}` : " · retido inteiro"}{r.isento ? " · isento" : ""}</p>
                              </div>
                            </div>
                          </td>
                          <td className="px-3 py-2.5 whitespace-nowrap text-slate-600">{bankDateTime(r.em)}</td>
                          <td className="px-3 py-2.5 text-right tabular-nums font-semibold">{fmtBRL(r.retido)}</td>
                          <td className="px-3 py-2.5 text-right tabular-nums text-emerald-700">{r.bonus ? `+ ${fmtBRL(r.bonus)}` : "—"}</td>
                          <td className="px-3 py-2.5 text-right tabular-nums font-black">{r.pendente > 0 ? fmtBRL(r.pendente) : <span className="text-emerald-700">liberado</span>}</td>
                          <td className="px-4 py-2.5 text-right">
                            {r.pendente > 0 && <button type="button" disabled={Boolean(liberando)} onClick={() => liberar(r)} className="h-8 px-3 rounded-lg bg-slate-900 text-white text-xs font-bold hover:bg-slate-700 disabled:opacity-50">{liberando === r.chave ? "Liberando…" : "🔓 Desbloquear"}</button>}
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
            </div>
            <form onSubmit={salvar} className="rounded-2xl border border-slate-200 bg-white p-5 md:p-6 space-y-3">
              <div>
                <h3 className="font-black">Alterar limite</h3>
                <p className="text-sm text-slate-500">Limite de gastos do SAMU inteiro por ciclo (não é um limite da conta corporativa). Vale só para os custos do SAMU (saques de salário, setores e outros): o saque acima do limite é pago até o limite e o restante fica retido. Transferências entre contas não passam pelo limite. Padrão: {fmtBRL(dados?.padrao || 50000000)}.</p>
              </div>
              <div className="flex flex-col sm:flex-row gap-3">
                <input inputMode="numeric" value={valor ? Number(String(valor).replace(/\D/g, "") || 0).toLocaleString("pt-BR") : ""}
                  onChange={(e) => setValor(e.target.value.replace(/\D/g, "").slice(0, 12))}
                  className="flex-1 px-4 py-2.5 border rounded-xl bg-slate-50 font-mono" placeholder="50.000.000" aria-label="Novo limite em reais" />
                <button type="submit" disabled={salvando || !dados} className="px-5 py-2.5 bg-slate-900 text-white rounded-xl font-black disabled:opacity-50">{salvando ? "Salvando…" : "Salvar limite"}</button>
              </div>
              {msg && <p role="status" className="text-sm font-bold text-slate-700">{msg}</p>}
            </form>
          </div>
        );
      };

      const AdminCobranca = ({ token, somenteLeitura = false }) => {
        const [dados, setDados] = useState(null);
        const [msg, setMsg] = useState("");
        const [editor, setEditor] = useState(null);
        const [ocupado, setOcupado] = useState(false);
        const [filtro, setFiltro] = useState("todos");
        const call = (path, options) => bankFetch(path, token, options);
        const load = async () => {
          try { setDados(await call("/admin/banco/cobranca")); }
          catch (err) { setMsg(err.message); }
        };
        useEffect(() => { load(); }, [token]);
        const acao = async (item, tipo, pergunta) => {
          if (pergunta && !confirm(pergunta)) return;
          setMsg("Aguarde…");
          try {
            const r = await call(`/admin/banco/cobranca/${item.discord_id}/${tipo}`, { method: "POST" });
            setMsg(r.mensagem || "Pronto.");
            await load();
          } catch (err) { setMsg(err.message); }
        };
        const abrirEditor = async () => {
          setMsg("");
          try { setEditor(await call("/admin/banco/cobranca/config")); }
          catch (err) { setMsg(err.message); }
        };
        const salvarEditor = async () => {
          setOcupado(true);
          try {
            const r = await call("/admin/banco/cobranca/config", { method: "PUT", body: JSON.stringify({ config: editor.config }) });
            setEditor({ ...editor, config: r.config, salvo_em: r.salvo_em });
            setMsg(`Mensagens salvas às ${new Date(r.salvo_em || Date.now()).toLocaleTimeString("pt-BR", { hour: "2-digit", minute: "2-digit" })}.`);
          } catch (err) { setMsg(err.message); }
          finally { setOcupado(false); }
        };

      const AdminAcessoTotal = ({ token, portalMembers = [] }) => {
        const [lista, setLista] = useState(null);
        const [busca, setBusca] = useState("");
        const [msg, setMsg] = useState("");
        const call = (path, options) => bankFetch(path, token, options);
        const load = async () => {
          try { setLista((await call("/admin/acesso-total")).lista || []); }
          catch (err) { setMsg(err.message); }

        useEffect(() => { load(); }, [token]);
        const termo = busca.trim().toLocaleLowerCase("pt-BR");
        const ids = new Set((lista || []).map((item) => String(item.discord_id)));
        const sugestoes = termo.length < 2 ? [] : portalMembers.filter((m) => m.status === "ativo" && !ids.has(String(m.discord_id)) &&

          if (!confirm(`Liberar acesso total para ${m.nome}? Ele passa a ver e fazer tudo como o proprietário (só não consegue mexer em você).`)) return;

            await call("/admin/acesso-total", { method: "POST", body: JSON.stringify({ discord_id: m.discord_id }) });

            setMsg(`Acesso total liberado para ${m.nome}.`);
