                  <h2 id="tour-boas-vindas" className="mt-2 text-xl sm:text-2xl font-bold leading-tight break-words">Bem-vindo à sua conta SAMUBANK, {nome}!</h2>
                </div>
                <div className="p-6">
                  <p className="text-sm text-slate-600">Vamos mostrar rapidinho as funções da sua conta. São {BANK_TOUR_STEPS.length} passos e leva menos de um minuto.</p>
                  <div className="mt-6 flex items-center justify-end gap-3">
                    <button type="button" autoFocus onClick={() => setStep(0)} className="h-11 sm:h-10 px-5 rounded-xl bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700">Começar tour →</button>
                  </div>
                </div>
              </div>
            </div>
          );
        }

        return (
          <div className={`fixed inset-0 z-[90] ${ultimo ? "pointer-events-none" : ""}`} role="dialog" aria-modal="true" aria-labelledby="tour-titulo">
            {/* bloqueia cliques na tela; no último passo libera a rolagem para ler a explicação */}
            <div className={`absolute inset-0 ${ultimo ? "pointer-events-none" : ""}`} style={hl ? {} : { background: "rgba(2,6,23,.7)" }}></div>
            {hl && (
              <div aria-hidden="true" className="absolute rounded-2xl ring-2 ring-emerald-400 pointer-events-none transition-all duration-300 ease-out"
                style={{ top: hl.top, left: hl.left, width: hl.width, height: hl.height, boxShadow: "0 0 0 9999px rgba(2,6,23,.7), 0 0 0 6px rgba(52,211,153,.25)" }}></div>
            )}
            <div className="absolute pointer-events-auto rounded-2xl bg-white shadow-2xl p-4 sm:p-5 transition-all duration-300 ease-out overflow-y-auto overscroll-contain" style={{ width: largura, maxHeight: celular ? "46vh" : "60vh", ...balao }}>
              <div className="flex items-center justify-between gap-3">
                <p className="text-[11px] font-semibold uppercase tracking-[0.16em] text-emerald-700">Passo {step + 1} de {BANK_TOUR_STEPS.length}</p>
              </div>
              <h3 id="tour-titulo" className="mt-1.5 text-base sm:text-lg font-bold text-slate-900">{atual.title}</h3>
              <p className="mt-1 text-[13px] sm:text-sm leading-relaxed text-slate-600">{atual.text}</p>
              {ultimo && celular && <p className="mt-2 text-xs text-emerald-700">Role a tela para ler a explicação completa.</p>}
              <div className="mt-4 flex items-center justify-between gap-3">
                <div className="flex gap-1.5" aria-hidden="true">
                  {BANK_TOUR_STEPS.map((_, i) => <span key={i} className={`h-1.5 rounded-full transition-all ${i === step ? "w-5 bg-emerald-600" : i < step ? "w-1.5 bg-emerald-300" : "w-1.5 bg-slate-200"}`}></span>)}
                </div>
                <div className="flex gap-2">
                  <button type="button" onClick={() => setStep(step - 1)} className="h-10 sm:h-9 px-3 rounded-xl border border-slate-200 text-sm font-semibold text-slate-600 hover:text-slate-900">Voltar</button>
                  {ultimo ? (
                    <button type="button" autoFocus onClick={onFinish} className="h-10 sm:h-9 px-4 rounded-xl bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700">Concluir</button>
                  ) : (
                    <button type="button" autoFocus onClick={() => setStep(step + 1)} className="h-10 sm:h-9 px-4 rounded-xl bg-slate-900 text-white text-sm font-semibold hover:bg-slate-700">Próximo →</button>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      };

      const ContaSamu = ({ currentMember, memberToken, onViewChange }) => {
        const [data, setData] = useState(null);
        const [error, setError] = useState("");
        const [refreshing, setRefreshing] = useState(false);
        const [loadingMore, setLoadingMore] = useState(false);
        const [filter, setFilter] = useState("todos");
        const [modal, setModal] = useState("");
        const [selected, setSelected] = useState(null);
        const [liberando, setLiberando] = useState(null);
        const [movTip, movTipNode] = useBankMovTip();
        const [tourAberto, setTourAberto] = useState(false);
        const tourChave = `samu_banco_tutorial_${currentMember?.discord_id || ""}`;
        const tourJaDecidido = useRef(false);
        useEffect(() => {
          if (!data || tourJaDecidido.current || "tutorial_visto" in data === false) return;
          tourJaDecidido.current = true;
          let local = false;
          try { local = localStorage.getItem(tourChave) === "1"; } catch {}
          if (!data.tutorial_visto && !local) setTourAberto(true);
        }, [data]);
        const concluirTour = () => {
          setTourAberto(false);
          try { localStorage.setItem(tourChave, "1"); } catch {}
          bankFetch("/portal/banco/tutorial", memberToken, { method: "POST", body: "{}" }).catch(() => {});
        };
        const [hidden, setHidden] = useState(() => {
          try { return localStorage.getItem("samu_banco_oculto") === "1"; } catch { return false; }
        });
        const [showOrigem, setShowOrigem] = useState(false);
        const [origemPos, setOrigemPos] = useState(null);
        const origemRef = useRef(null);
        const origemTimer = useRef(null);
        const abrirOrigem = () => {
          clearTimeout(origemTimer.current);
          const el = origemRef.current;
          if (!el) return;
          const r = el.getBoundingClientRect();
          const vw = window.innerWidth, vh = window.innerHeight;
          const largura = Math.min(320, vw - 24);
          const left = Math.max(12, Math.min(r.left, vw - largura - 12));
          const espacoAbaixo = vh - r.bottom - 12;
          const espacoAcima = r.top - 12;
          const abaixo = espacoAbaixo >= 320 || espacoAbaixo >= espacoAcima;
          setOrigemPos(abaixo
            ? { left, width: largura, top: r.bottom + 8, maxHeight: espacoAbaixo - 8 }
            : { left, width: largura, bottom: vh - r.top + 8, maxHeight: espacoAcima - 8 });
          setShowOrigem(true);
        };
        const fecharOrigem = (imediato) => {
          clearTimeout(origemTimer.current);
          if (imediato === true) { setShowOrigem(false); return; }
          origemTimer.current = setTimeout(() => setShowOrigem(false), 150);
        };
        useEffect(() => {
          if (!showOrigem) return;
          const fechar = () => setShowOrigem(false);
          window.addEventListener("scroll", fechar, true);
          window.addEventListener("resize", fechar);
          return () => { window.removeEventListener("scroll", fechar, true); window.removeEventListener("resize", fechar); };
        }, [showOrigem]);
        useEffect(() => () => clearTimeout(origemTimer.current), []);
        const toggleHidden = () => {
          setHidden((value) => {
            try { localStorage.setItem("samu_banco_oculto", value ? "0" : "1"); } catch {}
            return !value;
          });
        };
        const paginaRef = useRef(1);
        const load = async () => {
          setRefreshing(true);
          try {
            const result = await bankFetch(`/portal/banco?pagina=${paginaRef.current}`, memberToken);
            setData(result);
            setError("");
          } catch (err) {
            setError(err.message);
          } finally {
            setRefreshing(false);
          }
        };
        useEffect(() => { load(); }, [memberToken]);
        // Atualiza sozinho: a cada 15s consulta só o último lançamento (1 linha)
        // e recarrega a conta quando algo novo cai. Pausa com a aba escondida.
        const versaoRef = useRef(null);
        const loadRef = useRef(load);
        loadRef.current = load;
        useEffect(() => {
          let cancel = false;
          let ultimaCarga = Date.now();
          const checar = async () => {
            if (document.visibilityState !== "visible") return;
            try {
              const res = await fetch(`${BANK_API}/portal/banco/versao`, { headers: { Authorization: "Bearer " + memberToken } });
              const { versao } = await res.json();
              if (cancel || versao == null) return;
              const mudou = versaoRef.current !== null && versao !== versaoRef.current;
              versaoRef.current = versao;
              if (mudou || Date.now() - ultimaCarga > 2 * 60 * 1000) {
                ultimaCarga = Date.now();
                await loadRef.current();
              }
            } catch {}
          };
          checar();
          const timer = setInterval(checar, 15000);
          const aoVoltar = () => { if (document.visibilityState === "visible") checar(); };
          document.addEventListener("visibilitychange", aoVoltar);
          return () => { cancel = true; clearInterval(timer); document.removeEventListener("visibilitychange", aoVoltar); };
        }, [memberToken]);
        // Extrato em páginas (25 lançamentos por página).
        const irParaPagina = async (pagina) => {
          if (loadingMore || pagina < 1) return;
          setLoadingMore(true);
          try {
            const page = await bankFetch(`/portal/banco?pagina=${pagina}&so_extrato=1`, memberToken);
            paginaRef.current = page.pagina;
            setData((current) => ({ ...current, ...page }));
            setFilter("todos");
            document.getElementById("conta-extrato")?.scrollIntoView({ behavior: "smooth" });
          } catch (err) { setError(err.message); }
          finally { setLoadingMore(false); }
        };
        const money = (v) => (hidden ? "R$ •••••" : fmtBRL(v));

        if (!data && !error)
          return (
            <div className="max-w-6xl mx-auto space-y-4">
              <div className="h-56 rounded-3xl bg-slate-200/70 animate-pulse"></div>
              <div className="grid grid-cols-3 gap-3">{[0, 1, 2].map((i) => <div key={i} className="h-20 rounded-2xl bg-slate-200/60 animate-pulse"></div>)}</div>
            </div>
          );
        if (!data)
          return (
            <div className="max-w-xl mx-auto">
              <div className={ui.card + " p-8 text-center"}>
                <p className="text-sm font-medium text-red-700">{error}</p>
                <button type="button" onClick={load} className="mt-5 h-10 px-5 rounded-xl bg-slate-900 text-white text-sm font-semibold">Tentar novamente</button>
              </div>
            </div>
          );

        const salario = data.salario_cargo || {};
        const debitoSalario = Number(data.debito_salario || 0);
        const salarioCargoAtual = salario.pendente ? Number(salario.valor || 0) : 0;
        const salarioRestante = salarioCargoAtual - debitoSalario;
        const liberadoTotal = Number(data.disponivel_saque || 0) + salarioRestante;
        const loan = data.emprestimo;
        const ciclo = data.ciclo || { entradas: 0, saidas: 0, por_tipo: {} };
        // Ciclo financeiro: sábado 00h a sábado 00h. O atual começou 7 dias antes do próximo fechamento.
        const DIA_MS = 86400000;
        const fechamentoMs = Date.parse(data.fechamento) || NaN;
        const cicloAtualMs = fechamentoMs - 7 * DIA_MS;
        const cicloAnteriorMs = cicloAtualMs - 7 * DIA_MS;
        const cicloDe = (iso) => {
          const t = Date.parse(iso);
          if (Number.isNaN(cicloAtualMs) || Number.isNaN(t)) return "antigo";
          return t >= cicloAtualMs ? "atual" : t >= cicloAnteriorMs ? "anterior" : "antigo";
        };
        const diaMes = (ms) => new Date(ms).toLocaleDateString("pt-BR", { timeZone: "America/Sao_Paulo", day: "2-digit", month: "2-digit" });
        const CICLO_INFO = {
          atual: { titulo: "Ciclo atual", faixa: Number.isNaN(cicloAtualMs) ? "" : `${diaMes(cicloAtualMs)} a ${diaMes(fechamentoMs - 1)}`, nota: "em andamento · fecha no sábado 00h", band: "bg-emerald-50 text-emerald-800 border-emerald-200", dot: "bg-emerald-500", pill: "bg-emerald-100 text-emerald-800" },
          anterior: { titulo: "Ciclo anterior", faixa: Number.isNaN(cicloAtualMs) ? "" : `${diaMes(cicloAnteriorMs)} a ${diaMes(cicloAtualMs - 1)}`, nota: "já fechado", band: "bg-sky-50 text-sky-800 border-sky-200", dot: "bg-sky-500", pill: "bg-sky-100 text-sky-800" },
          antigo: { titulo: "Ciclos mais antigos", faixa: Number.isNaN(cicloAnteriorMs) ? "" : `até ${diaMes(cicloAnteriorMs - 1)}`, nota: "", band: "bg-slate-100 text-slate-600 border-slate-200", dot: "bg-slate-400", pill: "" },
        };
        const bloqueiosLista = data.bloqueios || [];
        const filters = [
          ["todos", "Tudo"], ["ciclo_atual", "Ciclo atual"], ["ciclo_anterior", "Ciclo anterior"], ["entradas", "Entradas"], ["saidas", "Saídas"],
        ];
        const movimentos = (data.movimentos || []).filter((m) => {
          if (filter === "todos") return true;
          if (filter === "ciclo_atual") return cicloDe(m.created_at) === "atual";
          if (filter === "ciclo_anterior") return cicloDe(m.created_at) === "anterior";
          if (filter === "entradas") return Number(m.valor) > 0;
          if (filter === "saidas") return Number(m.valor) < 0;
          return BANK_TIPO_INFO[bankTipoDe(m)]?.group === filter;
        });
        const grupos = [];
        for (const m of movimentos) {
          const label = bankDateLabel(m.created_at);
          const ciclo = cicloDe(m.created_at);
          const last = grupos[grupos.length - 1];
          if (last && last.label === label && last.ciclo === ciclo) last.items.push(m);
          else grupos.push({ label, ciclo, items: [m], novoCiclo: !last || last.ciclo !== ciclo });
        }
        const meta = data.meta_paga;
        const metaIsento = Boolean(data.meta_isento);
        const podeSacar = meta || metaIsento;
        const actions = [
          { key: "enviar", label: "Enviar", hint: "Transferir", icon: <path d="M7 17 17 7M8 7h9v9" />, onClick: () => setModal("enviar"), disabled: !podeSacar },
          { key: "sacar", label: "Sacar", hint: "Solicitar salário", icon: <React.Fragment><rect x="2" y="6" width="20" height="12" rx="2" /><circle cx="12" cy="12" r="2.5" /></React.Fragment>, onClick: () => onViewChange("request-salary"), disabled: !podeSacar },
          { key: "emprestimo", label: "Empréstimo", hint: data.emprestimo_limite ? `até ${fmtBRL(data.emprestimo_limite)}` : "sem cargo", icon: <React.Fragment><path d="M3 21h18M5 21V10l7-5 7 5v11" /><path d="M9 21v-6h6v6" /></React.Fragment>, onClick: () => setModal("emprestimo"), disabled: !data.emprestimo_limite },
          { key: "extrato", label: "Extrato", hint: "Movimentações", icon: <React.Fragment><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" /><path d="M14 2v6h6M8 13h8M8 17h5" /></React.Fragment>, onClick: () => document.getElementById("conta-extrato")?.scrollIntoView({ behavior: "smooth" }) },
        ];

        return (
          <div className="max-w-6xl mx-auto space-y-5">
            {tourAberto && <BankTour nome={currentMember?.nome || "membro"} onFinish={concluirTour} />}
            <div className="flex flex-wrap items-end justify-between gap-3">
              <div>
                <p className="text-xs font-semibold uppercase tracking-[0.18em] text-emerald-700">Banco do SAMU</p>
                <h1 className="text-2xl md:text-[28px] font-bold tracking-tight text-slate-900">Conta SAMU</h1>
              </div>
              <button type="button" onClick={load} disabled={refreshing} className="h-10 px-4 rounded-xl border border-slate-200 bg-white text-sm font-semibold text-slate-600 hover:text-slate-900 disabled:opacity-50 inline-flex items-center gap-2">
                <svg viewBox="0 0 24 24" className={`w-4 h-4 ${refreshing ? "animate-spin" : ""}`} fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8" /><path d="M21 3v5h-5" /></svg>
                Atualizar
              </button>
            </div>

            {error && <p role="alert" className="rounded-xl bg-red-50 px-4 py-3 text-sm font-medium text-red-700">{error}</p>}

            <section className="grid lg:grid-cols-[1fr_360px] gap-5">
              <div className="space-y-4">
                <div className="relative overflow-hidden rounded-3xl sm:rounded-[28px] p-5 sm:p-6 md:p-8 text-white shadow-xl shadow-emerald-950/20" style={{ background: "radial-gradient(circle at 85% 10%, rgba(16,185,129,.35), transparent 45%), linear-gradient(135deg, #04261a 0%, #062f22 45%, #0b1220 100%)" }}>
                  <div aria-hidden="true" className="absolute -right-16 -bottom-24 w-72 h-72 rounded-full border border-white/10"></div>
                  <div aria-hidden="true" className="absolute -right-4 -bottom-10 w-44 h-44 rounded-full border border-white/10"></div>
                  <div className="relative flex items-start justify-between gap-4">
                    <div className="flex items-center gap-3">
                      <span className="w-10 h-10 rounded-2xl bg-white/10 border border-white/15 flex items-center justify-center text-lg" aria-hidden="true">🏦</span>
                      <div>
                        <p className="text-xs font-semibold tracking-[0.2em] text-emerald-300">CONTA SAMU</p>
                        <p className="text-[11px] text-emerald-100/60">Saldo fictício · fechamento aos sábados</p>
                      </div>
                    </div>
                    <span data-tour="meta" className={`shrink-0 rounded-full px-3 py-1 text-[11px] font-bold tracking-wide ${podeSacar ? "bg-emerald-400/15 text-emerald-200 border border-emerald-300/30" : "bg-red-500/15 text-red-200 border border-red-300/30"}`}>
                      {meta ? "● META PAGA" : metaIsento ? "● ISENTO DE META" : "● META PENDENTE"}
                    </span>
                  </div>
                  <div className="relative mt-8">
                    <div className="flex items-center gap-2 text-sm text-emerald-100/70">
                      Saldo disponível
                      <button type="button" onClick={toggleHidden} className="w-7 h-7 rounded-lg hover:bg-white/10 inline-flex items-center justify-center" aria-label={hidden ? "Mostrar saldo" : "Ocultar saldo"}>
                        {hidden ? <EyeOff size={15} /> : <svg viewBox="0 0 24 24" className="w-[15px] h-[15px]" fill="none" stroke="currentColor" strokeWidth="2"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z" /><circle cx="12" cy="12" r="3" /></svg>}
                      </button>
                    </div>
                    {(() => {
                      const nz = (v) => Number(v || 0);
                      const setoresV = nz(data.setores_disponivel);
                      const outrosV = nz(data.outros_disponivel);
                      const emprestimoV = nz(data.emprestimo_disponivel);
                      const salarioV = salario.pendente ? nz(salario.valor) : 0;
                      const liberadoV = nz(data.liberado);
                      const debitoV = liberadoV < 0 ? liberadoV : 0;
                      const totalV = nz(data.saldo_disponivel);
                      const linhas = [
                        { label: "Setores", desc: "Cursos, recrutamentos, tarefas e comissões", valor: setoresV },
                        { label: "Outros", desc: emprestimoV > 0 ? `Envios, sorteios, bônus · inclui empréstimo de ${hidden ? "•••" : fmtBRL(emprestimoV)}` : "Envios recebidos, sorteios, bônus e empréstimos", valor: outrosV },
                      ];
                      if (salarioV) linhas.push({ label: "Salário do cargo", desc: salario.nome ? `${salario.nome} · a receber` : "A receber neste ciclo", valor: salarioV });
                      if (debitoV) linhas.push({ label: "Saldo negativo", desc: "Débitos que ultrapassaram o saldo da conta", valor: debitoV, negativo: true });
                      const soma = linhas.reduce((acc, l) => acc + l.valor, 0);
                      const ajuste = Math.round((totalV - soma) * 100) / 100;
                      if (Math.abs(ajuste) >= 0.01) linhas.push({ label: "Ajustes", desc: "Descontos e reservas já aplicados", valor: ajuste, negativo: ajuste < 0 });
                      const notas = [];
                      if (nz(data.em_apuracao) > 0) notas.push(`${hidden ? "•••" : fmtBRL(data.em_apuracao)} em apuração não entram no total (liberam em ${bankShortDate(data.fechamento)})`);
                      if (nz(data.saque_reservado) > 0) notas.push(`${hidden ? "•••" : fmtBRL(data.saque_reservado)} reservados para saque já foram descontados`);
                      if (nz(data.multas_pendentes) > 0) notas.push(`Multas pendentes de ${hidden ? "•••" : fmtBRL(data.multas_pendentes)} serão descontadas no saque`);
                      if (nz(data.parcela_pendente) > 0) notas.push(`Parcela de empréstimo de ${hidden ? "•••" : fmtBRL(data.parcela_pendente)} será descontada no saque`);
                      return (
                        <div
                          ref={origemRef}
                          className="relative inline-block max-w-full"
                          onMouseEnter={abrirOrigem}
                          onMouseLeave={fecharOrigem}
                          onFocus={abrirOrigem}
                          onBlur={() => fecharOrigem(true)}
                          onClick={() => (showOrigem ? fecharOrigem(true) : abrirOrigem())}
                          tabIndex={0}
                          role="button"
                          aria-expanded={showOrigem}
                          aria-label="Ver de onde vem o saldo disponível"
                        >
                          <p className={`mt-1 text-[34px] leading-tight sm:text-4xl md:text-5xl font-bold tracking-tight tabular-nums break-all cursor-help decoration-dotted decoration-emerald-200/40 underline-offset-8 hover:underline ${totalV < 0 ? "text-red-300" : ""}`}>{money(totalV)}</p>
                          {showOrigem && origemPos && ReactDOM.createPortal(
                            <div style={{ position: "fixed", ...origemPos }} className="z-[9999] overflow-y-auto rounded-2xl border border-white/15 bg-[#0b2a22]/95 backdrop-blur-md shadow-2xl p-4 text-left cursor-default text-white" onMouseEnter={() => clearTimeout(origemTimer.current)} onMouseLeave={fecharOrigem} onClick={(e) => e.stopPropagation()}>
                              <p className="text-[11px] uppercase tracking-wider text-emerald-100/60 mb-3">De onde vem este valor</p>
                              <div className="space-y-2.5">
                                {linhas.map((l) => (
                                  <div key={l.label} className="flex items-start justify-between gap-3">
                                    <div className="min-w-0">
                                      <p className="text-sm font-medium text-white">{l.label}</p>
                                      <p className="text-[11px] leading-snug text-emerald-100/50">{l.desc}</p>
                                    </div>
                                    <p className={`shrink-0 text-sm font-semibold tabular-nums ${l.negativo || l.valor < 0 ? "text-red-300" : "text-white"}`}>{money(l.valor)}</p>
                                  </div>
                                ))}
                              </div>
                              <div className="mt-3 pt-3 border-t border-white/10 flex items-center justify-between">
                                <p className="text-sm font-semibold text-emerald-100">Total disponível</p>
                                <p className={`text-base font-bold tabular-nums ${totalV < 0 ? "text-red-300" : "text-emerald-200"}`}>{money(totalV)}</p>
                              </div>
                              {notas.length > 0 && (
                                <ul className="mt-3 space-y-1 text-[11px] leading-snug text-emerald-100/50 list-disc pl-4">
                                  {notas.map((n) => <li key={n}>{n}</li>)}
                                </ul>
                              )}
                            </div>,
                            document.body
                          )}
                        </div>
                      );
                    })()}

              {filter !== "bloqueados" && Number(data.total_paginas) > 1 && (() => {
                const atual = Number(data.pagina || 1);
                const total = Number(data.total_paginas);
                const numeros = Array.from({ length: total }, (_, i) => i + 1).filter((n) => n === 1 || n === total || Math.abs(n - atual) <= 1);
                return (
                  <nav className="px-4 sm:px-6 py-4 border-t border-slate-100 flex flex-wrap items-center justify-between gap-3" aria-label="Páginas do extrato">

                      {numeros.map((n, i) => (

                      ))}
                      <button type="button" disabled={atual === total || loadingMore} onClick={() => irParaPagina(atual + 1)} className="h-9 px-3 rounded-lg border border-slate-200 text-xs font-semibold text-slate-600 hover:bg-slate-50 disabled:opacity-40">Próxima ›</button>

            {modal === "enviar" && <BankTransferModal data={data} memberToken={memberToken} currentMember={currentMember} onClose={() => setModal("")} onDone={load} />}
            {modal === "emprestimo" && <BankLoanModal data={data} memberToken={memberToken} currentMember={currentMember} onClose={() => setModal("")} onDone={load} />}
            {modal === "pagar-parcela" && loan?.pagamento && <BankPayParcelModal loan={loan} memberToken={memberToken} onClose={() => setModal("")} onDone={load} />}

      const BankReleaseModal = ({ bloqueio, memberToken, onClose, onDone }) => {

      const BankTransferModal = ({ data, memberToken, currentMember, onClose, onDone }) => {
        const [step, setStep] = useState("destino");

        const [searching, setSearching] = useState(false);

        const disponivel = Number(data.saldo_disponivel || 0);
        useEffect(() => {

          const controller = new AbortController();

          const timer = setTimeout(async () => {
            try {
              const res = await fetch(`${BANK_API}/portal/banco/destinatarios?q=${encodeURIComponent(busca.trim())}`, { headers: { Authorization: "Bearer " + memberToken }, signal: controller.signal });

              setResults(Array.isArray(list) ? list : []);

            finally { setSearching(false); }

          return () => { clearTimeout(timer); controller.abort(); };
        }, [busca, step]);
        const enviar = async () => {
          if (sending) return;
          setSending(true);
          setMsg("");
          try {
            const result = await bankFetch("/portal/banco/transferir", memberToken, {

        const baixar = () => comprovante && gerarComprovanteBanco({

            {step === "valor" && dest && (
              <div className="space-y-5">
                <div className="flex items-center gap-3 rounded-xl bg-slate-50 px-3 py-2.5">
                  <img src={avatar(dest)} alt="" className="w-10 h-10 rounded-full object-cover" />
                  <span className="min-w-0 flex-1"><span className="block text-sm font-semibold truncate">{dest.nome}</span><span className="block text-xs text-slate-500">ID {dest.ingame_id}</span></span>
                  <button type="button" onClick={() => setStep("destino")} className="text-xs font-semibold text-slate-500 hover:text-slate-900">Trocar</button>
                </div>
                <div>
                  <label className={ui.label} htmlFor="banco-valor">Valor</label>
                  <div className="flex items-center rounded-2xl border-2 border-slate-200 focus-within:border-emerald-500 px-4">
                    <span className="text-lg font-semibold text-slate-400">R$</span>
                    <input id="banco-valor" autoFocus inputMode="numeric" value={valorNum ? valorNum.toLocaleString("pt-BR") : ""} onChange={(e) => setValor(e.target.value)} className="w-full bg-transparent px-2 py-3 text-2xl font-bold tabular-nums outline-none" placeholder="0" />
                  </div>
                  <div className="mt-2 flex flex-wrap gap-1.5">
                    {[50000, 100000, 500000, 1000000].map((v) => (
                      <button key={v} type="button" onClick={() => setValor(String(valorNum + v))} className="rounded-lg border border-slate-200 px-2.5 py-1 text-xs font-semibold text-slate-600 hover:bg-slate-50">+{fmtBRL(v)}</button>
                    ))}
                    {disponivel > 0 && <button type="button" onClick={() => setValor(String(disponivel))} className="rounded-lg border border-emerald-200 bg-emerald-50 px-2.5 py-1 text-xs font-semibold text-emerald-700">Tudo</button>}

              </div>

            {step === "revisar" && dest && (
              <div>
                <p className="text-center text-sm text-slate-500">Você está enviando</p>

                {msg && <p role="alert" className="mt-3 rounded-xl bg-red-50 px-4 py-3 text-sm font-medium text-red-700">{msg}</p>}
                <div className="mt-5 grid grid-cols-2 gap-2">

                  <button type="button" onClick={enviar} disabled={sending} className="h-12 rounded-xl bg-emerald-600 text-white text-sm font-semibold hover:bg-emerald-700 disabled:opacity-50">{sending ? "Enviando…" : "Confirmar envio"}</button>

      // Pagar parcela do empréstimo: foto do comprovante vai para o Financeiro confirmar.
      const reduzirImagem = (file, max = 1600) => new Promise((resolve, reject) => {
        const leitor = new FileReader();
        leitor.onerror = () => reject(new Error("Não foi possível ler a imagem."));
        leitor.onload = () => {
          const img = new Image();
          img.onerror = () => reject(new Error("Arquivo de imagem inválido."));
          img.onload = () => {
            const escala = Math.min(1, max / Math.max(img.width, img.height));
            const c = document.createElement("canvas");
            c.width = Math.round(img.width * escala); c.height = Math.round(img.height * escala);
            const ctx = c.getContext("2d"); ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, c.width, c.height);
            ctx.drawImage(img, 0, 0, c.width, c.height);
            resolve(c.toDataURL("image/jpeg", 0.85));
          };
          img.src = leitor.result;
        };
        leitor.readAsDataURL(file);
      });
      const BankPayParcelModal = ({ loan, memberToken, onClose, onDone }) => {
        const pg = loan.pagamento;
        const [imagem, setImagem] = useState("");
        const [sending, setSending] = useState(false);
        const [msg, setMsg] = useState("");
        const [ok, setOk] = useState(null);
        const escolher = async (file) => {
          setMsg("");
          if (!file) return;
          if (!/^image\/(png|jpe?g|webp)$/i.test(file.type)) { setMsg("Envie uma imagem PNG, JPG ou WEBP."); return; }

      // --------------------- Painel Adm: editor do edital ---------------------
      const EditalAdminEditor = ({ token }) => {
        const API = "https://api.144.22.247.17.sslip.io";
        const linhas = (t) => String(t || "").split("\n").map((x) => x.trim()).filter(Boolean);
        const paraForm = (m) => ({
          titulo: m.titulo || "", rotulo: m.rotulo || "", intro: m.intro || "",
          pontos: (m.pontos || []).join("\n"), passos: (m.passos || []).join("\n"), numerada: (m.numerada || []).join("\n"),
          grupos: (m.grupos || []).map(([n, c]) => `${n}: ${(c || []).join(", ")}`).join("\n"),
          exemplo: m.exemplo || "", aviso: m.aviso || "", tabela: Boolean(m.tabela),

        const doForm = (f) => ({
          titulo: f.titulo, rotulo: f.rotulo, intro: f.intro, pontos: linhas(f.pontos), passos: linhas(f.passos), numerada: linhas(f.numerada),
          grupos: linhas(f.grupos).map((l) => { const [n, ...r] = l.split(":"); return [n.trim(), r.join(":").split(",").map((x) => x.trim()).filter(Boolean)]; }),

        const [mods, setMods] = useState(null);
        const [perguntas, setPerguntas] = useState([]);
        const [sel, setSel] = useState(0);
        const [aba, setAba] = useState("modulos");
        const [info, setInfo] = useState(null);
        const [msg, setMsg] = useState("");
        const [salvando, setSalvando] = useState(false);
        const chamar = async (method, body) => {
          const res = await fetch(API + "/admin/edital/config", { method, headers: { "Content-Type": "application/json", Authorization: "Bearer " + token }, body: body ? JSON.stringify(body) : undefined });
          const data = await res.json().catch(() => ({}));
          if (!res.ok) throw new Error(data.erro || "Falha ao acessar o edital.");
          return data.config || data;
        };
        const aplicar = (cfg) => {
          setMods((cfg.modulos && cfg.modulos.length ? cfg.modulos : EDITAL_MODULOS).map(paraForm));
          setPerguntas((cfg.perguntas || []).map((p) => p.texto));
          setInfo(cfg.atualizado || null);
          setSel(0);
        };
        useEffect(() => { chamar("GET").then(aplicar).catch((err) => setMsg(err.message)); }, [token]);
        const salvar = async (restaurar = false) => {
          if (restaurar && !confirm("Voltar a apostila para o conteúdo padrão? As perguntas atuais são mantidas.")) return;
          setSalvando(true); setMsg("");
          try {
            aplicar(await chamar("PUT", { restaurar, modulos: restaurar ? undefined : mods.map(doForm), perguntas: perguntas.map((p) => p.trim()).filter(Boolean) }));
            setMsg(restaurar ? "Apostila restaurada para o padrão." : "Edital salvo. Os próximos candidatos já veem a nova versão.");
          } catch (err) { setMsg(err.message); }
          finally { setSalvando(false); }
        };
        const mover = (lista, i, d) => { const c = [...lista]; const j = i + d; if (j < 0 || j >= c.length) return c; [c[i], c[j]] = [c[j], c[i]]; return c; };
        const campo = "w-full rounded-lg border border-slate-200 bg-white px-3 py-2 text-sm";
        if (!mods) return <p className="text-sm text-slate-500">{msg || "Carregando edital…"}</p>;
        const m = mods[sel] || mods[0];
        const editar = (k, v) => setMods(mods.map((x, i) => (i === sel ? { ...x, [k]: v } : x)));
        const area = (k, rotulo, dica, rows = 4) => (
          <label className="block text-sm font-semibold text-slate-700">{rotulo}
            <textarea rows={rows} value={m[k]} onChange={(e) => editar(k, e.target.value)} className={campo + " mt-1 font-normal"} />

        return (
          <div className="space-y-4">

              <div className="flex gap-1 p-1 rounded-xl bg-slate-100">
                {[["modulos", `Apostila (${mods.length})`], ["perguntas", `Questionário (${perguntas.length})`]].map(([k, l]) => (
                  <button key={k} type="button" onClick={() => setAba(k)} className={`px-4 py-2 rounded-lg text-sm font-bold ${aba === k ? "bg-white shadow-sm text-slate-900" : "text-slate-500"}`}>{l}</button>

              </div>
              <div className="flex gap-2">
                <button type="button" onClick={() => salvar(true)} disabled={salvando} className="px-4 py-2 rounded-lg border text-sm font-bold">Restaurar padrão</button>
                <button type="button" onClick={() => salvar(false)} disabled={salvando} className="px-4 py-2 rounded-lg bg-emerald-600 text-white text-sm font-bold disabled:opacity-50">{salvando ? "Salvando…" : "Salvar edital"}</button>
              </div>

            {info && <p className="text-xs text-slate-400">Última alteração por {info.por} em {new Date(info.em).toLocaleString("pt-BR")}.</p>}
            {msg && <p role="status" className="rounded-lg bg-blue-50 px-3 py-2 text-sm font-semibold text-blue-800">{msg}</p>}
            {aba === "modulos" ? (
              <div className="grid lg:grid-cols-[240px_1fr] gap-4">
                <div className="rounded-xl border border-slate-200 overflow-hidden">
                  <div className="max-h-[520px] overflow-y-auto divide-y">
                    {mods.map((x, i) => (
                      <button key={i} type="button" onClick={() => setSel(i)} className={`w-full text-left px-3 py-2.5 text-sm flex gap-2 ${i === sel ? "bg-red-50 text-red-800 font-semibold" : "hover:bg-slate-50"}`}>
                        <span className="w-5 shrink-0 text-slate-400 tabular-nums">{i + 1}</span><span className="truncate">{x.titulo || "Sem título"}</span>
                      </button>

                  </div>
                  <button type="button" onClick={() => { setMods([...mods, paraForm({ titulo: "Novo módulo", rotulo: "", intro: "" })]); setSel(mods.length); }} className="w-full border-t px-3 py-2.5 text-sm font-bold text-emerald-700 hover:bg-emerald-50">+ Adicionar módulo</button>

                  <div className="flex flex-wrap gap-2">

                    <button type="button" onClick={() => { setMods(mover(mods, sel, 1)); setSel(Math.min(mods.length - 1, sel + 1)); }} className="px-3 py-1.5 rounded-lg border text-xs font-bold">↓ Descer</button>
                    <button type="button" disabled={mods.length < 2} onClick={() => { if (confirm(`Remover o módulo "${m.titulo}"?`)) { setMods(mods.filter((_, i) => i !== sel)); setSel(0); } }} className="px-3 py-1.5 rounded-lg border border-red-200 text-xs font-bold text-red-700 disabled:opacity-40">Remover módulo</button>
