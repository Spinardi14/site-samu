    <script>
      // Banimento do portal: identifica este navegador em cada chamada à API e
      // mostra a tela de bloqueio quando a API recusa o acesso.
      (function () {
        var API = "https://api.144.22.247.17.sslip.io", KEY_ID = "samu_dispositivo", KEY_BAN = "samu_bloqueado";
        var valido = function (v) { return /^[a-zA-Z0-9-]{16,64}$/.test(v || ""); };
        var cookie = function (n) { var m = document.cookie.match(new RegExp("(?:^|; )" + n + "=([^;]*)")); return m ? decodeURIComponent(m[1]) : ""; };
        var id = "";
        try { id = localStorage.getItem(KEY_ID) || ""; } catch (e) {}
        if (!valido(id)) id = cookie(KEY_ID);
        if (!valido(id)) id = window.crypto && crypto.randomUUID ? crypto.randomUUID()
          : Date.now().toString(36) + "-" + Math.random().toString(36).slice(2) + Math.random().toString(36).slice(2);
        try { localStorage.setItem(KEY_ID, id); } catch (e) {}
        document.cookie = KEY_ID + "=" + id + "; max-age=315360000; path=/; SameSite=Lax";
        var MENSAGENS = {
          financeiro: ["💳", "Acesso bloqueado", "Seu acesso está bloqueado por pendências financeiras."],
          padrao: ["⛔", "Acesso bloqueado", "Seu acesso ao Portal SAMU foi bloqueado pela administração."]
        };
        var KEY_PAGAR = "samu_pagar_token";
        var naPaginaPagar = function () { return /^#pagar=/.test(window.location.hash); };
        var brl = function (v) { return "R$ " + Math.round(Number(v) || 0).toLocaleString("pt-BR"); };
        // Bloqueio financeiro: valor em aberto, valor com juros (5% ao dia) e botão Pagar.
        function valoresFinanceiro(teste) {
          var caixa = document.getElementById("samu-bloqueio-valores");
          if (!caixa) return;
          var token = "";
          try { token = localStorage.getItem(KEY_PAGAR) || ""; } catch (e) {}
          var desenhar = function (bruto, total, pct, link) {
            caixa.innerHTML =
              '<div style="margin-top:22px;display:grid;grid-template-columns:1fr 1fr;gap:10px;text-align:left">' +
                '<div style="padding:14px 16px;border-radius:14px;background:rgba(255,255,255,.06)"><div style="font-size:11px;color:#94a3b8">Em aberto</div><div style="font-size:20px;font-weight:800;margin-top:4px">' + brl(bruto) + '</div></div>' +
                '<div style="padding:14px 16px;border-radius:14px;background:rgba(244,63,94,.12)"><div style="font-size:11px;color:#fda4af">Com juros hoje' + (pct ? ' · ' + pct + '%' : '') + '</div><div style="font-size:20px;font-weight:800;margin-top:4px;color:#fecdd3">' + brl(total) + '</div></div>' +
              '</div>' +
              '<p style="margin-top:8px;font-size:11px;color:#64748b">Juros de 5% ao dia · atualiza sozinho</p>' +
              (link ? '<a href="' + link + '" id="samu-bloqueio-pagar" style="display:block;margin-top:16px;padding:12px;border-radius:12px;background:#fff;color:#0b0f19;font-weight:800;text-decoration:none">Pagar</a>' : '');
            var btn = document.getElementById("samu-bloqueio-pagar");
            if (btn) btn.onclick = function (ev) { ev.preventDefault(); window.location.hash = "pagar=" + token; window.location.reload(); };
          };
          if (teste) return desenhar(1725000, 1914750, 11, "");
          if (!token) return;
          (original || window.fetch).call(window, API + "/cobranca/pagar/" + encodeURIComponent(token)).then(function (r) { return r.ok ? r.json() : null; }).then(function (d) {
            var pg = d && d.pagamento;
            if (pg && pg.situacao !== "em_dia") desenhar(pg.bruto, pg.total, pg.juros_pct, "#pagar=" + token);
          }).catch(function () {});
        }
        setInterval(function () { if (document.getElementById("samu-bloqueio-valores")) valoresFinanceiro(false); }, 60000);
        function mostrar(tipo, teste) {
          if (document.getElementById("samu-bloqueio")) return;
          if (!teste && naPaginaPagar()) return;
          if (!document.body) return document.addEventListener("DOMContentLoaded", function () { mostrar(tipo, teste); });
          var m = MENSAGENS[tipo] || MENSAGENS.padrao;
          var el = document.createElement("div");
          el.id = "samu-bloqueio";
          el.setAttribute("style", "position:fixed;inset:0;z-index:2147483647;background:#0b0f19;color:#fff;display:flex;align-items:center;justify-content:center;padding:24px;font-family:system-ui,sans-serif;text-align:center");
          el.innerHTML = '<div style="max-width:440px;width:100%"><div style="font-size:52px">' + m[0] + '</div><h1 style="font-size:26px;font-weight:900;margin:12px 0">' + m[1] + '</h1><p style="color:#cbd5e1;line-height:1.5">' + m[2] + '</p>' +
            (tipo === "financeiro" ? '<div id="samu-bloqueio-valores"></div>' : '') +
            (teste ? '<p style="margin-top:22px;font-size:12px;color:#fbbf24">Modo de teste: esta é só uma prévia da tela de bloqueio.</p><button type="button" id="samu-bloqueio-fechar" style="margin-top:12px;padding:10px 18px;border-radius:12px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.08);color:#fff;font-weight:700;cursor:pointer">Fechar prévia</button>' : '') +
            '</div>';
          document.body.appendChild(el);
          document.documentElement.style.overflow = "hidden";
          if (teste) document.getElementById("samu-bloqueio-fechar").onclick = liberar;
          if (tipo === "financeiro") valoresFinanceiro(teste);
        }
        window.samuTesteBloqueio = function (tipo) { mostrar(tipo || "padrao", true); };
        function liberar() {
          var el = document.getElementById("samu-bloqueio");
          if (el) el.remove();
          document.documentElement.style.overflow = "";
        }
        try { var banSalvo = localStorage.getItem(KEY_BAN); if (banSalvo) mostrar(banSalvo); } catch (e) {}
        var original = window.fetch;
        window.fetch = function (input, init) {
          var url = typeof input === "string" ? input : input instanceof URL ? input.href : (input && input.url) || "";
          if (url.indexOf(API) !== 0) return original.apply(this, arguments);
          init = init || {};
          var headers = new Headers(init.headers || (input instanceof Request ? input.headers : undefined));
          headers.set("X-Portal-Dispositivo", id);
          var p = original.call(this, input, Object.assign({}, init, { headers: headers }));
          p.then(function (res) {
            var tipoBan = res.headers.get("X-Portal-Banido");
            var pagarToken = res.headers.get("X-Portal-Pagar");
            if (pagarToken) { try { localStorage.setItem(KEY_PAGAR, pagarToken); } catch (e) {} }
            if (tipoBan) {
              try { localStorage.setItem(KEY_BAN, tipoBan); } catch (e) {}
              mostrar(tipoBan);
            } else if (res.ok) {
              try { if (localStorage.getItem(KEY_BAN)) { localStorage.removeItem(KEY_BAN); liberar(); } } catch (e) {}
            }
          }).catch(function () {});
          return p;
        };
      })();
    </script>
    <script>
      // Limpeza de cache remota: a API envia a versao do portal em cada resposta.
      // Se um admin subir a versao, este navegador baixa o site de novo e recarrega.
      (function () {
        var API = "https://api.144.22.247.17.sslip.io", KEY = "samu_portal_versao", busy = false;
        var original = window.fetch;
        window.fetch = function (input) {
          var p = original.apply(this, arguments);
          var url = typeof input === "string" ? input : (input && input.url) || "";
          if (url.indexOf(API) === 0) p.then(function (res) {
            var v = res.headers.get("X-Portal-Versao");
            if (!v || busy) return;
            var seen;
            // So guarda a versao quando ela sobe: uma resposta antiga (cache) nunca
            // rebaixa o valor salvo, senao o site entra em loop de recarregamento.
            try {
              seen = localStorage.getItem(KEY);
              if (seen && Number(v) <= Number(seen)) return;
              localStorage.setItem(KEY, v);
              if (localStorage.getItem(KEY) !== v) return;
              if (!seen) return;
              // Trava extra: no maximo um recarregamento por versao nesta aba.
              if (sessionStorage.getItem(KEY + "_reload") === v) return;
              sessionStorage.setItem(KEY + "_reload", v);
            } catch (e) { return; }
            busy = true;
            var jobs = [original(location.href.split("#")[0], { cache: "reload" })];
            if (window.caches) jobs.push(caches.keys().then(function (k) {
              return Promise.all(k.map(function (n) { return caches.delete(n); }));
            }));
            Promise.all(jobs.map(function (j) { return j.catch(function () {}); }))
              .then(function () { location.reload(); });
          }).catch(function () {});
          return p;
        };
      })();
    </script>

      const ImageBlurrer = ({ file, onSave, onCancel }) => {
        const canvasRef = useRef(null);
        const [imageObj, setImageObj] = useState(null);
        const [canvasState, setCanvasState] = useState(null);
        const [isDrawing, setIsDrawing] = useState(false);
        const [startPos, setStartPos] = useState({ x: 0, y: 0 });
        const lastPos = useRef({ x: 0, y: 0 });

        useEffect(() => {
          const img = new Image();
          img.src = URL.createObjectURL(file);
          img.onload = () => {
            setImageObj(img);
          };
          return () => URL.revokeObjectURL(img.src);
        }, [file]);

        useEffect(() => {
          if (imageObj && canvasRef.current) {
            const canvas = canvasRef.current;
            const ctx = canvas.getContext("2d");
            canvas.width = imageObj.width;
            canvas.height = imageObj.height;
            ctx.drawImage(imageObj, 0, 0);
            setCanvasState(ctx.getImageData(0, 0, canvas.width, canvas.height));
          }
        }, [imageObj]);

        const getPos = (e) => {
          const canvas = canvasRef.current;
          if (!canvas) return { x: 0, y: 0 };
          const rect = canvas.getBoundingClientRect();
          const scaleX = canvas.width / rect.width;
          const scaleY = canvas.height / rect.height;
          let clientX, clientY;

          if (e.changedTouches && e.changedTouches.length > 0) {
            clientX = e.changedTouches[0].clientX;
            clientY = e.changedTouches[0].clientY;
          } else if (e.touches && e.touches.length > 0) {
            clientX = e.touches[0].clientX;
            clientY = e.touches[0].clientY;
          } else {
            clientX = e.clientX;
            clientY = e.clientY;
          }

          return {
            x: (clientX - rect.left) * scaleX,
            y: (clientY - rect.top) * scaleY,
          };
        };

        const startDrawing = (e) => {
          if (e.cancelable) e.preventDefault();
          setIsDrawing(true);
          const pos = getPos(e);
          setStartPos(pos);
          lastPos.current = pos;
        };

        const draw = (e) => {
          if (e.cancelable) e.preventDefault();
          if (!isDrawing || !canvasRef.current || !canvasState) return;

          const ctx = canvasRef.current.getContext("2d");
          const currentPos = getPos(e);
          lastPos.current = currentPos;

          const width = currentPos.x - startPos.x;
          const height = currentPos.y - startPos.y;

          ctx.putImageData(canvasState, 0, 0);

          ctx.fillStyle = "rgba(255, 0, 0, 0.3)";
          ctx.strokeStyle = "red";
          ctx.lineWidth = Math.max(4, canvasRef.current.width * 0.005);

          ctx.fillRect(startPos.x, startPos.y, width, height);
          ctx.strokeRect(startPos.x, startPos.y, width, height);
        };

        const stopDrawing = (e) => {
          if (e.cancelable) e.preventDefault();
          if (!isDrawing || !canvasRef.current || !canvasState) return;
          setIsDrawing(false);

          const ctx = canvasRef.current.getContext("2d");
          let endPos = getPos(e);

          if (
            (e.type === "touchend" || e.type === "touchcancel") &&
            (!e.changedTouches || e.changedTouches.length === 0)
          ) {
            endPos = lastPos.current;
          } else if (
            e.type === "touchend" &&
            e.changedTouches &&
            e.changedTouches.length > 0
          ) {
            endPos = getPos(e);
          }

          const width = endPos.x - startPos.x;
          const height = endPos.y - startPos.y;

          if (Math.abs(width) < 1 && Math.abs(height) < 1) {
            ctx.putImageData(canvasState, 0, 0);
            return;
          }

          ctx.putImageData(canvasState, 0, 0);

          const absW = Math.abs(width);
          const absH = Math.abs(height);

          if (absW < 1 || absH < 1) return;

          const tempCanvas = document.createElement("canvas");
          const sampleSize = 20;
          tempCanvas.width = Math.max(1, Math.floor(absW / sampleSize));
          tempCanvas.height = Math.max(1, Math.floor(absH / sampleSize));

          const tCtx = tempCanvas.getContext("2d");
          tCtx.imageSmoothingEnabled = false;

          tCtx.drawImage(
            canvasRef.current,
            startPos.x,
            startPos.y,
            width,
            height,
            0,
            0,
            tempCanvas.width,
            tempCanvas.height,
          );

          ctx.save();
          ctx.beginPath();
          ctx.rect(startPos.x, startPos.y, width, height);
          ctx.clip();
          ctx.imageSmoothingEnabled = false;
          ctx.drawImage(
            tempCanvas,
            0,
            0,
            tempCanvas.width,
            tempCanvas.height,
            startPos.x,
            startPos.y,
            width,
            height,
          );
          ctx.restore();

          setCanvasState(
            ctx.getImageData(
              0,
              0,
              canvasRef.current.width,
              canvasRef.current.height,
            ),
          );
        };

              <div className="relative border-2 border-dashed border-gray-300 bg-gray-100 rounded overflow-hidden cursor-crosshair touch-none w-full flex justify-center">

                  ref={canvasRef}
                  style={{
                    maxWidth: "100%",
                    maxHeight: "60vh",
                    objectFit: "contain",
                  }}
                  onMouseDown={startDrawing}
                  onMouseMove={draw}
                  onMouseUp={stopDrawing}
                  onMouseLeave={stopDrawing}
                  onTouchStart={startDrawing}
                  onTouchMove={draw}
                  onTouchEnd={stopDrawing}
                />

              <div className="flex gap-4 mt-6 w-full justify-end">

                </button>

      const NotificationCenter = ({ token }) => {
        const [open, setOpen] = useState(false);
        const [notifications, setNotifications] = useState([]);
        const [pending, setPending] = useState(0);

        const loadNotifications = async () => {
          if (!token) return [];
          try {
            const res = await fetch(
              "https://api.144.22.247.17.sslip.io/portal/notificacoes",
              { headers: { Authorization: "Bearer " + token } },
            );
            const data = await res.json();
            const items = Array.isArray(data) ? data : [];
            if (res.ok) setNotifications(items);
            return items;
          } catch {
            return [];
          }
        };

        const loadPendingStatus = async () => {
          if (!token) return;
          try {
            const res = await fetch(
              "https://api.144.22.247.17.sslip.io/portal/notificacoes?resumo=1",
              { headers: { Authorization: "Bearer " + token } },
            );
            const data = await res.json();
            if (res.ok) setPending(Number(data.pendentes || 0));
          } catch {}
        };

        useEffect(() => {
          loadPendingStatus();
          const timer = setInterval(loadPendingStatus, 60000);
          return () => clearInterval(timer);
        }, [token]);

        const openNotifications = async () => {
          const nextOpen = !open;
          setOpen(nextOpen);
          if (!nextOpen) return;
          const currentNotifications = await loadNotifications();
          const unread = currentNotifications.filter((item) => !item.read_at);
          if (unread.length) {
            await fetch(
              "https://api.144.22.247.17.sslip.io/portal/notificacoes/lidas",
              {
                method: "PATCH",
                headers: { Authorization: "Bearer " + token },
              },
            );
            setNotifications((items) =>
              items.map((item) =>
                item.read_at ? item : { ...item, read_at: new Date().toISOString() },
              ),
            );
            setPending(0);
          }
        };

        return (
          <div className="relative">
            <button
              type="button"
              onClick={openNotifications}
              className={`relative inline-flex items-center justify-center w-10 h-10 rounded-xl transition ${pending > 0 ? "bg-red-600 text-white shadow-lg shadow-red-600/30 hover:bg-red-700" : "text-slate-500 hover:text-slate-900 hover:bg-slate-100"}`}
              aria-label={pending > 0 ? `${pending} mensagem(ns) não lida(s)` : "Mensagens"}
              title={pending > 0 ? `${pending} mensagem(ns) não lida(s)` : "Mensagens"}
            >
              {pending > 0 && <span className="absolute inset-0 rounded-xl bg-red-500 opacity-60 animate-ping" aria-hidden="true"></span>}
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={pending > 0 ? 2.2 : 1.8} strokeLinecap="round" strokeLinejoin="round" className={`relative w-5 h-5 ${pending > 0 ? "bell-ring" : ""}`} aria-hidden="true">
                <path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9" />
                <path d="M10.3 21a1.94 1.94 0 0 0 3.4 0" />
              </svg>
              {pending > 0 && (
                <span className="absolute -top-1.5 -right-1.5 min-w-[20px] h-5 px-1 rounded-full bg-amber-400 text-slate-900 text-[11px] font-black leading-5 text-center ring-2 ring-white">
                  {pending > 9 ? "9+" : pending}
                </span>
              )}
            </button>
            {open && (
              <div className="absolute right-0 top-full mt-2 z-[70] w-[340px] max-w-[85vw] bg-white border border-slate-200 rounded-2xl shadow-xl overflow-hidden">
                <div className="px-5 py-4 border-b border-slate-100">
                  <h3 className="font-semibold text-slate-900">Mensagens administrativas</h3>
                </div>
                <div className="max-h-96 overflow-y-auto p-3 space-y-3">
                  {notifications.length === 0 ? (
                    <p className="p-5 text-center text-sm text-slate-500">Nenhuma mensagem.</p>
                  ) : (
                    notifications.map((item) => (
                      <article key={item.id} className="p-4 rounded-xl bg-slate-50">
                        <p className="text-sm text-slate-800 whitespace-pre-wrap break-words">{renderDecreto(item.mensagem)}</p>
                        <div className="mt-3 pt-3 border-t border-slate-200 text-xs text-slate-500">
                          <strong className="text-slate-700">{item.enviado_por}</strong>
                          <span> · {new Date(item.created_at).toLocaleString("pt-BR")}</span>
                        </div>
                      </article>
                    ))
                  )}
                </div>
              </div>
            )}
          </div>
        );
      };

            setPublicacoes(nextPublicacoes);
            setMembros(nextMembros);
            setUltimoMembros(nextMembros);
            setFlyers(nextFlyers);
            setPortalReady(true);

        useEffect(() => {

        useEffect(() => {
          if (!memberToken) return;
          if (
            String(landingBirthdayCache.memberId) === String(currentMember.id) &&
            Date.now() < landingBirthdayCache.expiresAt

            setBirthdays(landingBirthdayCache.data);

                memberId: currentMember.id,
                data: items,
                expiresAt: Date.now() + 60 * 1000,

          "Recrutador Destaque": "👑",

      // Decretos vem do Discord em markdown: **texto** vira negrito de verdade
      // e "# Titulo" vira titulo, sem exibir os simbolos.
      const renderDecreto = (texto) =>
        String(texto || "").split("\n").map((linha, i) => {
          const titulo = /^#{1,3}\s+/.test(linha);
          const partes = linha.replace(/^#{1,3}\s+/, "").split(/\*\*/);
          // Um ** sem par nao abre negrito: o ultimo trecho fica normal.
          const semPar = partes.length % 2 === 0;
          const conteudo = partes.map((parte, j) => {
            const limpo = parte.replace(/__(.+?)__/g, "$1");
            return j % 2 === 1 && !(semPar && j === partes.length - 1)
              ? <strong key={j} className="font-semibold text-slate-900">{limpo}</strong>
              : <React.Fragment key={j}>{limpo}</React.Fragment>;
          });
          return (
            <React.Fragment key={i}>
              {i > 0 && "\n"}
              {titulo ? <strong className="font-bold text-slate-900">{conteudo}</strong> : conteudo}
            </React.Fragment>
          );
        });
      const ui = {
        card: "bg-white rounded-2xl border border-slate-200/80",

      const PageTitle = ({ eyebrow, title, subtitle, children }) => (

            {subtitle && <p className="text-sm text-slate-500 mt-1">{subtitle}</p>}

      const MemberChip = ({ member }) => (
        <div className="flex items-center gap-3">

        </div>
      );

      const Requerimentos = ({ memberToken }) => {
        const API_URL = "https://api.144.22.247.17.sslip.io";
        const [status, setStatus] = useState(null);
        const [tipo, setTipo] = useState("");
        const [busca, setBusca] = useState("");
        const [usuarios, setUsuarios] = useState([]);
        const [usuario, setUsuario] = useState(null);
        const [motivo, setMotivo] = useState("");
        const [novoCargoId, setNovoCargoId] = useState("");
        const [prova, setProva] = useState("");
        const [dias, setDias] = useState(1);
        const [exoneracao, setExoneracao] = useState(false);
        const [loading, setLoading] = useState(false);
        const [message, setMessage] = useState("");
        const [messageType, setMessageType] = useState("error");

        useEffect(() => {
          let cancelled = false;
          fetch(`${API_URL}/portal/requerimentos/status`, {
            headers: { Authorization: "Bearer " + memberToken },
          })
            .then(async (response) => {
              const data = await response.json();
              if (!response.ok) throw new Error(data.erro || "Falha ao consultar permissões.");
              if (!cancelled) setStatus(data);
            })
            .catch((err) => { if (!cancelled) setMessage(err.message); });
          return () => { cancelled = true; };
        }, [memberToken]);

        useEffect(() => {
          if (!(tipo === "advertencia" ? status?.pode_advertir : tipo === "desligamento" ? status?.pode_desligar : status?.pode_requerer) || busca.trim().length < 2) {
            setUsuarios([]);
            return;
          }
          const controller = new AbortController();
          const timer = setTimeout(async () => {
            try {
              const termo = busca.trim();
              const response = await fetch(
                `${API_URL}/portal/requerimentos/usuarios?q=${encodeURIComponent(termo)}`,
                { headers: { Authorization: "Bearer " + memberToken }, signal: controller.signal },
              );
              const data = await response.json();
              if (response.ok) {
                const encontrados = Array.isArray(data) ? data : [];
                setUsuarios(encontrados);
                if (/^\d{17,20}$/.test(termo)) {
                  setUsuario(encontrados.find((item) => item.id === termo) || null);
                  setNovoCargoId("");
                }
              }
            } catch (err) { if (err.name !== "AbortError") setUsuarios([]); }
          }, 350);
          return () => { clearTimeout(timer); controller.abort(); };
        }, [busca, status?.pode_requerer, status?.pode_advertir, status?.pode_desligar, tipo, memberToken]);

        const mudarTipo = (novoTipo) => {
          setTipo(novoTipo);
          setUsuario(null);
          setBusca("");
          setUsuarios([]);
          setMotivo("");
          setNovoCargoId("");
          setProva("");
          setDias(1);
          setExoneracao(false);
          setMessage("");
          setMessageType("error");
        };

        const cargos = status?.cargos || [];
        const cargoAtualIndex = cargos.findIndex((cargo) => cargo.id === usuario?.cargo_atual?.id);
        const limiteHierarquia = Number.isInteger(status?.limite_hierarquia) ? status.limite_hierarquia : null;
        const cargosDisponiveis = cargos.filter((cargo, index) =>
          cargoAtualIndex >= 0 &&
          (tipo === "promover" ? index < cargoAtualIndex : index > cargoAtualIndex) &&
          (status?.is_owner || (limiteHierarquia !== null && cargoAtualIndex > limiteHierarquia && index > limiteHierarquia)),
        );

        const enviar = async (event) => {
          event.preventDefault();
          if (loading || !usuario || !motivo.trim() || ((tipo === "promover" || tipo === "rebaixar" || tipo === "advertencia") && !novoCargoId) || ((tipo === "advertencia" || tipo === "desligamento") && !prova.trim())) return;
          setLoading(true);
          setMessage("");
          try {
            const endpoint = tipo === "advertencia" ? "/portal/advertencias" : tipo === "desligamento" ? "/portal/desligamentos" : `/portal/requerimentos/${tipo}`;
            const response = await fetch(`${API_URL}${endpoint}`, {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
                Authorization: "Bearer " + memberToken,
              },
              body: JSON.stringify({
                discord_id: usuario.id,
                motivo: motivo.trim(),
                novo_cargo_id: novoCargoId,
                cargo_id: novoCargoId,
                dias: Number(dias),
                prova: prova.trim(),
                provas: prova.trim(),
                acompanha_exoneramento: exoneracao,
              }),
            });
            const data = await response.json();
            if (!response.ok) throw new Error(data.erro || "Não foi possível concluir o requerimento.");
            setMessageType(tipo === "promover" || tipo === "advertencia" ? "success" : "neutral");
            setMessage(tipo === "advertencia" ? `Advertência aplicada. Término: ${new Date(data.termina_em).toLocaleString("pt-BR")}.${data.aviso ? " " + data.aviso : ""}` : tipo === "desligamento" ? data.mensagem : `${tipo === "promover" ? "Promoção" : "Rebaixamento"} realizado: ${data.cargo_anterior.nome} → ${data.novo_cargo.nome}.${data.aviso ? " " + data.aviso : ""}`);
            setUsuario(null);
            setBusca("");
            setNovoCargoId("");
            setMotivo("");
            setProva("");
          } catch (err) {
            setMessageType("error");
            setMessage(err.message || "Falha ao processar o requerimento.");
          } finally {
            setLoading(false);
          }
        };

        const reqTipos = [
          { id: "promover", label: "Promover", dot: "bg-emerald-500" },
          { id: "rebaixar", label: "Rebaixar", dot: "bg-red-500" },
          { id: "advertencia", label: "Advertência", dot: "bg-amber-500" },
          { id: "desligamento", label: "Desligamento", dot: "bg-slate-500" },
        ];
        return (
          <div className="max-w-2xl mx-auto">
            <PageTitle title="Requerimentos" subtitle="Promoções, rebaixamentos, advertências e desligamentos." />
            <div className={ui.card + " p-6 md:p-7"}>
              <p className={ui.label}>Tipo de requerimento</p>
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-1 p-1 rounded-xl bg-slate-100">
                {reqTipos.map((item) => (
                  <button key={item.id} type="button" onClick={() => mudarTipo(item.id)} className={`h-10 rounded-lg text-sm font-semibold inline-flex items-center justify-center gap-2 transition ${tipo === item.id ? "bg-white text-slate-900 shadow-sm" : "text-slate-500 hover:text-slate-800"}`}>
                    <span className={`w-1.5 h-1.5 rounded-full ${item.dot}`}></span>
                    {item.label}
                  </button>
                ))}
              </div>
              {!tipo && <p className="mt-6 text-sm text-slate-400 text-center">Selecione um tipo acima para começar.</p>}
              {message && <p role="alert" className={`mt-5 rounded-xl px-4 py-3 text-sm font-medium ${messageType === "success" ? "bg-emerald-50 text-emerald-800" : messageType === "neutral" ? "bg-slate-100 text-slate-800" : "bg-red-50 text-red-700"}`}>{message}</p>}
              {tipo && status && !(tipo === "advertencia" ? status.pode_advertir : tipo === "desligamento" ? status.pode_desligar : status.pode_requerer) && <p className="mt-5 rounded-xl bg-red-50 px-4 py-3 text-sm font-medium text-red-700">Você não tem o cargo necessário para esta opção.</p>}
              {tipo && (tipo === "advertencia" ? status?.pode_advertir : tipo === "desligamento" ? status?.pode_desligar : status?.pode_requerer) && (
                <form onSubmit={enviar} className="mt-6 pt-6 border-t border-slate-100 space-y-5">
                  <div>
                    <label htmlFor="req-user" className={ui.label}>Usuário ou ID in-game</label>
                    <input id="req-user" value={busca} onChange={(event) => { setBusca(event.target.value); setUsuario(null); setNovoCargoId(""); }} placeholder="Nome no portal, ID in-game, @ do Discord ou ID de desenvolvedor" autoComplete="off" className={ui.field} />
                    <p className={ui.hint}>A busca localiza pelo perfil do portal, pelo apelido no Discord ou pelo ID de desenvolvedor.</p>
                    {usuario && <p className="mt-2 inline-flex items-center gap-2 rounded-lg bg-emerald-50 px-3 py-1.5 text-sm font-medium text-emerald-800">✓ {usuario.nome}{usuario.idgame ? ` · ID ${usuario.idgame}` : ""}</p>}
                    {usuarios.length > 0 && !usuario && (
                      <div className="mt-2 max-h-52 overflow-y-auto rounded-xl border border-slate-200 p-1">
                        {usuarios.map((item) => <button key={item.id} type="button" onClick={() => { setUsuario(item); setBusca(item.nome); setUsuarios([]); }} className="flex w-full items-center gap-3 text-left rounded-lg px-3 py-2 text-sm hover:bg-slate-50"><img src={item.avatar_url || AVATAR_FALLBACK} alt="" className="w-8 h-8 rounded-full object-cover" /> <span className="min-w-0"><span className="block truncate">{item.nome}{item.idgame ? <span className="text-slate-400"> · ID {item.idgame}</span> : ""}</span><span className="block text-xs text-slate-400 truncate">{item.cargo_atual?.nome || "Sem cargo identificado"}{item.usuario ? ` · @${item.usuario}` : ""}</span></span></button>)}
                      </div>
                    )}
                  </div>
                  <div className="grid sm:grid-cols-2 gap-4">
                    <div>
                      <label className={ui.label}>Cargo atual</label>
                      <div className="h-11 flex items-center rounded-xl bg-slate-50 border border-slate-100 px-4 text-sm text-slate-600">{usuario ? (usuario.cargo_atual?.nome || "Não identificado") : "Selecione um usuário"}</div>
                    </div>
                    {(tipo === "promover" || tipo === "rebaixar") && <div>
                      <label htmlFor="req-role" className={ui.label}>{tipo === "promover" ? "Novo cargo" : "Cargo rebaixado"}</label>
                      <select id="req-role" value={novoCargoId} onChange={(event) => setNovoCargoId(event.target.value)} required disabled={!usuario?.cargo_atual} className={ui.field}>
                        <option value="">Selecione um cargo</option>
                        {cargosDisponiveis.map((cargo) => <option key={cargo.id} value={cargo.id}>{cargo.nome}</option>)}
                      </select>
                    </div>}
                    {tipo === "advertencia" && <div><label className={ui.label}>Advertência</label><select value={novoCargoId} onChange={(event) => setNovoCargoId(event.target.value)} required className={ui.field}><option value="">Selecione</option><option value="1207346485856047176">Advertência 1</option><option value="1207346486724263960">Advertência 2</option></select></div>}
                    {tipo === "desligamento" && <div><label className={ui.label}>Acompanha exoneramento?</label><select value={String(exoneracao)} onChange={(event) => setExoneracao(event.target.value === "true")} className={ui.field}><option value="false">Não</option><option value="true">Sim</option></select></div>}
                  </div>
                  {(tipo === "promover" || tipo === "rebaixar") && usuario?.cargo_atual && cargosDisponiveis.length === 0 && <p className="-mt-2 text-sm font-medium text-red-600">Não há cargos disponíveis para esta movimentação com as suas permissões atuais.</p>}
                  {tipo === "advertencia" && <div><label className={ui.label}>Duração (dias)</label><select value={dias} onChange={(event) => setDias(Number(event.target.value))} className={ui.field}>{Array.from({ length: 10 }, (_, index) => <option key={index + 1} value={index + 1}>{index + 1}</option>)}</select></div>}
                  <div>
                    <label htmlFor="req-reason" className={ui.label}>Motivo</label>
                    <textarea id="req-reason" value={motivo} onChange={(event) => setMotivo(event.target.value)} maxLength={1000} required rows={4} className={ui.area} />
                  </div>
                  {(tipo === "advertencia" || tipo === "desligamento") && <div><label className={ui.label}>{tipo === "advertencia" ? "Prova" : "Provas"} (links)</label><textarea value={prova} onChange={(event) => setProva(event.target.value)} maxLength={1500} required rows={3} className={ui.area} /></div>}
                  <button type="submit" disabled={loading || !usuario || !motivo.trim() || (tipo !== "desligamento" && !novoCargoId) || ((tipo === "advertencia" || tipo === "desligamento") && !prova.trim())} className={`w-full h-12 rounded-xl text-white font-semibold transition disabled:opacity-40 ${tipo === "promover" ? "bg-emerald-600 hover:bg-emerald-700" : tipo === "advertencia" ? "bg-amber-600 hover:bg-amber-700" : tipo === "desligamento" ? "bg-slate-900 hover:bg-slate-700" : "bg-red-600 hover:bg-red-700"}`}>{loading ? "Processando..." : tipo === "promover" ? "Realizar promoção" : tipo === "rebaixar" ? "Realizar rebaixamento" : tipo === "advertencia" ? "Aplicar advertência" : "Solicitar desligamento"}</button>
                </form>
              )}
            </div>
          </div>
        );
      };

      const Corregedoria = ({ currentMember, memberToken }) => {
        const API_URL = "https://api.144.22.247.17.sslip.io";
        const NAVY = "#0b1f4b";
        const MAX_PDF = 8 * 1024 * 1024;
        const MAX_IMG = 5 * 1024 * 1024;
        const MAX_IMGS = 6;
        const MAX_TOTAL = 24 * 1024 * 1024;
        const [busca, setBusca] = useState("");
        const [usuarios, setUsuarios] = useState([]);
        const [buscando, setBuscando] = useState(false);
        const [acusado, setAcusado] = useState(null);
        const [pdf, setPdf] = useState(null);
        const [provas, setProvas] = useState([]);
        const [ciente, setCiente] = useState(false);
        const [loading, setLoading] = useState(false);
        const [erro, setErro] = useState("");
        const [resultado, setResultado] = useState(null);
        const pdfRef = useRef(null);
        const provasRef = useRef(null);

        useEffect(() => {
          const termo = busca.trim();
          if (acusado || termo.length < 2) { setUsuarios([]); setBuscando(false); return; }
          const controller = new AbortController();
          setBuscando(true);
          const timer = setTimeout(async () => {
            try {
              const response = await fetch(
                `${API_URL}/portal/corregedoria/usuarios?q=${encodeURIComponent(termo)}`,
                { headers: { Authorization: "Bearer " + memberToken }, signal: controller.signal },
              );
              const data = await response.json().catch(() => []);
              setUsuarios(response.ok && Array.isArray(data) ? data : []);
              setBuscando(false);
            } catch (err) {
              if (err.name !== "AbortError") { setUsuarios([]); setBuscando(false); }
            }
          }, 350);
          return () => { clearTimeout(timer); controller.abort(); };
        }, [busca, acusado, memberToken]);

        const tamanho = (bytes) => bytes >= 1048576 ? `${(bytes / 1048576).toFixed(2)} MB` : `${Math.max(1, Math.round(bytes / 1024))} KB`;

        const escolherPdf = (event) => {
          const file = event.target.files?.[0] || null;
          setErro("");
          if (!file) return setPdf(null);
          const isPdf = file.type === "application/pdf" || /\.pdf$/i.test(file.name);
          if (!isPdf || file.size > MAX_PDF) {
            event.target.value = "";
            setPdf(null);
            setErro(!isPdf ? "A acusação deve ser enviada em PDF." : "O PDF da acusação deve ter no máximo 8 MB.");
            return;
          }
          setPdf(file);
        };

        const adicionarProvas = (event) => {
          const novos = Array.from(event.target.files || []);
          event.target.value = "";
          setErro("");
          if (!novos.length) return;
          const validos = [];
          for (const file of novos) {
            const ok = /^image\/(png|jpeg)$/.test(file.type) || /\.(png|jpe?g)$/i.test(file.name);
            if (!ok) { setErro("As provas devem ser imagens JPG ou PNG."); continue; }
            if (file.size > MAX_IMG) { setErro(`"${file.name}" ultrapassa 5 MB.`); continue; }
            validos.push(file);
          }
          setProvas((atuais) => {
            const lista = [...atuais, ...validos];
            if (lista.length > MAX_IMGS) setErro(`São aceitas no máximo ${MAX_IMGS} imagens de prova.`);
            return lista.slice(0, MAX_IMGS);
          });
        };

        const lerBase64 = (file) => new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.onload = () => resolve(String(reader.result).split(",")[1] || "");
          reader.onerror = () => reject(new Error(`Não foi possível ler o arquivo "${file.name}".`));
          reader.readAsDataURL(file);
        });

        // Reserva: se a API nao conseguir gerar o PDF, o comprovante e montado aqui.
        const comprovanteLocal = (dados) => {
          const { jsPDF } = window.jspdf;
          const doc = new jsPDF();
          doc.setFillColor(11, 31, 75); doc.rect(0, 0, 210, 46, "F");
          doc.setFillColor(201, 162, 75); doc.rect(0, 46, 210, 1.4, "F");
          doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(17);
          doc.text("CORREGEDORIA GERAL DO SAMU", 105, 21, { align: "center" });
          doc.setFontSize(10); doc.setTextColor(201, 162, 75);
          doc.text("COMPROVANTE DE ABERTURA PROCESSUAL", 105, 31, { align: "center" });
          doc.setTextColor(11, 31, 75); doc.setFontSize(22);
          doc.text(String(dados.processo || "").toUpperCase(), 20, 66);
          const limpo = (valor) => String(valor ?? "-").replace(/[^\x20-\x7e\u00a0-\u00ff]/g, "").trim() || "-";
          const linhas = [
            ["Protocolo", dados.protocolo], ["Abertura", dados.data_hora],
            ["Parte autora", `${dados.autor?.nome || currentMember?.nome} - ${dados.autor?.cargo || ""}`],
            ["ID in-game (autor)", dados.autor?.idgame || currentMember?.ingame_id],
            ["Parte acusada", `${dados.acusado_dados?.nome || dados.acusado} - ${dados.acusado_dados?.cargo || ""}`],
            ["ID in-game (acusado)", dados.acusado_dados?.idgame],
            ["Corregedor responsável", dados.corregedor || "A designar"],
          ];
          let y = 82;
          for (const [rotulo, valor] of linhas) {
            doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(100, 116, 139); doc.text(rotulo, 20, y);
            doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(15, 23, 42); doc.text(limpo(valor), 75, y);
            y += 11;
          }
          doc.setFont("helvetica", "normal"); doc.setFontSize(9); doc.setTextColor(100, 116, 139);
          doc.text(doc.splitTextToSize("Este documento comprova a abertura do processo perante a Corregedoria Geral do SAMU. Cada andamento possui prazo de 12 horas. Guarde este comprovante: o protocolo identifica a sua solicitação.", 170), 20, y + 8);
          doc.save(dados.comprovante_nome || `comprovante-${dados.processo}.pdf`);
          // Anexa o mesmo comprovante ao canal do processo (uma unica vez).
          if (dados.comprovante_pendente && dados.canal_id && !dados._comprovanteEnviado) {
            dados._comprovanteEnviado = true;
            fetch(`${API_URL}/portal/corregedoria/processos/${dados.canal_id}/comprovante`, {
              method: "POST",
              headers: { "Content-Type": "application/pdf", Authorization: "Bearer " + memberToken },
              body: doc.output("blob"),
            }).catch(() => {});
          }
        };

        const baixarComprovante = (dados) => {
          try {
            if (!dados.comprovante_base64) return comprovanteLocal(dados);
            const bytes = Uint8Array.from(atob(dados.comprovante_base64), (c) => c.charCodeAt(0));
            const url = URL.createObjectURL(new Blob([bytes], { type: "application/pdf" }));
            const link = document.createElement("a");
            link.href = url;
            link.download = dados.comprovante_nome || `comprovante-${dados.processo}.pdf`;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 30000);
          } catch (err) {
            setErro("O processo foi aberto, mas o comprovante não pôde ser baixado. Use o botão para tentar novamente.");
          }
        };

        const totalBytes = (pdf?.size || 0) + provas.reduce((soma, file) => soma + file.size, 0);
        const pronto = Boolean(acusado && pdf && provas.length && ciente && totalBytes <= MAX_TOTAL);

        const enviar = async (event) => {
          event.preventDefault();
          if (loading || !pronto) return;
          setLoading(true);
          setErro("");
          try {
            const corpo = {
              acusado_discord_id: acusado.id,
              pdf: { nome: pdf.name, base64: await lerBase64(pdf) },
              provas: await Promise.all(provas.map(async (file) => ({ nome: file.name, base64: await lerBase64(file) }))),
            };
            const response = await fetch(`${API_URL}/portal/corregedoria/processos`, {
              method: "POST",
              headers: {
                "Content-Type": "application/vnd.samu.processo+json",
                Authorization: "Bearer " + memberToken,
              },
              body: JSON.stringify(corpo),
            });
            const data = await response.json().catch(() => ({}));
            if (!response.ok || !data.sucesso) throw new Error(data.erro || "Não foi possível abrir o processo.");
            setResultado(data);
            baixarComprovante(data);
            window.scrollTo({ top: 0, behavior: "smooth" });
          } catch (err) {
            setErro(err.message || "Falha ao abrir o processo.");
          } finally {
            setLoading(false);
          }
        };

        const novoProcesso = () => {
          setResultado(null); setAcusado(null); setBusca(""); setPdf(null); setProvas([]); setCiente(false); setErro("");
        };

        const cabecalho = (
          <div className="rounded-t-2xl px-6 md:px-8 py-7 text-white" style={{ background: `linear-gradient(120deg, ${NAVY} 0%, #10296a 60%, ${NAVY} 100%)` }}>
            <div className="flex items-center gap-4">
              <span className="w-14 h-14 shrink-0 rounded-2xl border border-amber-300/50 bg-white/5 flex items-center justify-center text-[28px]" aria-hidden="true">⚖️</span>
              <div className="min-w-0">
                <p className="text-[11px] font-semibold tracking-[0.18em] uppercase text-amber-300/90">Poder Judiciário</p>
                <h1 className="text-xl md:text-2xl font-bold tracking-tight">Corregedoria Geral do SAMU</h1>
                <p className="text-sm text-blue-100/80 mt-0.5">Abertura de processo administrativo</p>
              </div>
            </div>
          </div>
        );

        if (resultado) {
          return (
            <div className="max-w-2xl mx-auto">
              <div className={ui.card + " overflow-hidden"}>
                {cabecalho}
                <div className="p-6 md:p-8">
                  <p className="inline-flex items-center gap-2 rounded-full bg-emerald-50 px-3 py-1 text-xs font-semibold text-emerald-800">✓ Processo aberto e encaminhado à Corregedoria</p>
                  <p className="mt-5 text-xs font-medium uppercase tracking-wider text-slate-400">Processo administrativo nº</p>
                  <p className="text-3xl font-bold tracking-tight uppercase" style={{ color: NAVY }}>{resultado.processo}</p>
                  <dl className="mt-6 grid sm:grid-cols-2 gap-x-6 gap-y-4 text-sm">
                    <div><dt className="text-slate-400">Protocolo</dt><dd className="font-semibold text-slate-900 tabular-nums">{resultado.protocolo}</dd></div>
                    <div><dt className="text-slate-400">Abertura</dt><dd className="font-semibold text-slate-900">{resultado.data_hora}</dd></div>
                    <div><dt className="text-slate-400">Parte acusada</dt><dd className="font-semibold text-slate-900">{resultado.acusado}</dd></div>
                    <div><dt className="text-slate-400">Corregedor responsável</dt><dd className="font-semibold text-slate-900">{resultado.corregedor || "A designar"}</dd></div>
                  </dl>
                  <p className="mt-6 rounded-xl bg-slate-50 border border-slate-100 px-4 py-3 text-sm text-slate-600">
                    O comprovante em PDF foi baixado e também anexado ao canal do processo. Cada andamento tem prazo de 12 horas.
                    {!resultado.autor_no_servidor && <React.Fragment> Para acompanhar, entre no Discord da Corregedoria: <a href={resultado.convite} target="_blank" rel="noreferrer" className="font-semibold underline" style={{ color: NAVY }}>{resultado.convite}</a>.</React.Fragment>}
                  </p>
                  {erro && <p role="alert" className="mt-4 rounded-xl bg-red-50 px-4 py-3 text-sm font-medium text-red-700">{erro}</p>}
                  <div className="mt-6 grid sm:grid-cols-2 gap-3">
                    <button type="button" onClick={() => baixarComprovante(resultado)} className="h-12 rounded-xl text-white text-sm font-semibold transition hover:opacity-90" style={{ backgroundColor: NAVY }}>Baixar comprovante (PDF)</button>
                    {resultado.autor_no_servidor
                      ? <a href={resultado.canal_url} target="_blank" rel="noreferrer" className="h-12 rounded-xl border border-slate-200 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition inline-flex items-center justify-center">Abrir canal do processo</a>
                      : <a href={resultado.convite} target="_blank" rel="noreferrer" className="h-12 rounded-xl border border-slate-200 text-sm font-semibold text-slate-700 hover:bg-slate-50 transition inline-flex items-center justify-center">Entrar no Discord da Corregedoria</a>}
                  </div>
                  <button type="button" onClick={novoProcesso} className="mt-4 w-full text-center text-sm font-medium text-slate-400 hover:text-slate-700">Abrir outro processo</button>
                </div>
              </div>
            </div>
          );
        }

        const fileInput = "block w-full text-sm text-slate-600 file:mr-4 file:h-10 file:px-4 file:rounded-xl file:border-0 file:text-white file:text-sm file:font-semibold file:cursor-pointer file:bg-[#0b1f4b] hover:file:bg-[#10296a]";
        return (
          <div className="max-w-2xl mx-auto">
            <div className={ui.card + " overflow-hidden"}>
              {cabecalho}
              <div className="px-6 md:px-8 py-5 border-b border-slate-100 bg-slate-50/70 text-sm text-slate-600 leading-relaxed">
                A Corregedoria apura fatos envolvendo membros da gestão, além de exoneramentos e pedidos de impeachment.
                A abertura é gratuita, mas todas as informações devem ser verdadeiras e comprováveis.
              </div>
              <form onSubmit={enviar} className="p-6 md:p-8 space-y-6">
                <div>
                  <p className={ui.label}>1. Parte autora</p>
                  <div className="flex items-center gap-3 rounded-xl border border-slate-200 bg-slate-50 px-4 py-3">
                    <img src={currentMember?.avatar_url || "https://cdn.discordapp.com/embed/avatars/0.png"} alt="" className="w-10 h-10 rounded-full object-cover" />
                    <div className="min-w-0 flex-1">
                      <p className="text-sm font-semibold text-slate-900 truncate">{currentMember?.nome}</p>
                      <p className="text-xs text-slate-500 truncate">{currentMember?.cargo_discord?.nome || "Membro do SAMU"} · ID {currentMember?.ingame_id}</p>
                    </div>
                    <span className="text-[11px] font-medium text-slate-400">vinculado à sua conta</span>
                  </div>
                </div>

                <div>
                  <label htmlFor="cor-acusado" className={ui.label}>2. Parte acusada</label>
                  {acusado ? (
                    <div className="flex items-center gap-3 rounded-xl border px-4 py-3" style={{ borderColor: NAVY, backgroundColor: "#f5f7fc" }}>
                      <img src={acusado.avatar_url || "https://cdn.discordapp.com/embed/avatars/0.png"} alt="" className="w-10 h-10 rounded-full object-cover" />
                      <div className="min-w-0 flex-1">
                        <p className="text-sm font-semibold text-slate-900 truncate">{acusado.nome}{acusado.idgame ? ` · ID ${acusado.idgame}` : ""}</p>
                        <p className="text-xs text-slate-500 truncate">{acusado.cargo_atual?.nome || "Sem cargo identificado"}</p>
                      </div>
                      <button type="button" onClick={() => { setAcusado(null); setBusca(""); }} className="text-xs font-semibold text-slate-500 hover:text-red-600">Trocar</button>
                    </div>
                  ) : (
                    <React.Fragment>
                      <input id="cor-acusado" value={busca} onChange={(event) => setBusca(event.target.value)} placeholder="Nome, ID in-game ou ID de desenvolvedor do Discord" autoComplete="off" className={ui.field} />
                      {busca.trim().length >= 2 && (
                        <div className="mt-2 max-h-60 overflow-y-auto rounded-xl border border-slate-200 p-1">
                          {buscando && usuarios.length === 0 && <p className="px-3 py-3 text-sm text-slate-400">Pesquisando…</p>}
                          {!buscando && usuarios.length === 0 && <p className="px-3 py-3 text-sm text-slate-400">Nenhum membro encontrado.</p>}
                          {usuarios.map((item) => (
                            <button key={item.id} type="button" onClick={() => { setAcusado(item); setUsuarios([]); }} className="flex w-full items-center gap-3 text-left rounded-lg px-3 py-2 hover:bg-slate-50">
                              <img src={item.avatar_url || "https://cdn.discordapp.com/embed/avatars/0.png"} alt="" className="w-8 h-8 rounded-full object-cover" />
                              <span className="min-w-0">
                                <span className="block text-sm text-slate-900 truncate">{item.nome}{item.idgame ? <span className="text-slate-400"> · ID {item.idgame}</span> : ""}</span>
                                <span className="block text-xs text-slate-400 truncate">{item.cargo_atual?.nome || "Sem cargo identificado"}</span>
                              </span>
                            </button>
                          ))}
                        </div>
                      )}
                    </React.Fragment>

      const ProjetoRegras = ({ currentMember, memberToken }) => {

        const enviar = async (event) => {

              {permissao && !permissao.autorizado && (

              )}
              {permissao?.autorizado && (
                <form onSubmit={enviar} className="space-y-5">
                  <div>
                    <p className={ui.label}>Autor do projeto</p>

                      <div className="min-w-0">
                        <p className="text-sm font-semibold text-slate-900 truncate">{currentMember?.nome}</p>
                        <p className="text-xs text-slate-500 truncate">{currentMember?.cargo_discord?.nome || "Membro do SAMU"}</p>
                      </div>

                  <div>
                    <label htmlFor="proj-nome" className={ui.label}>Nome do Projeto</label>

                  <div>
                    <label htmlFor="proj-objetivo" className={ui.label}>Objetivo do Projeto</label>

                    <p className={ui.hint}>{arquivo ? `${arquivo.name} · ${(arquivo.size / 1024 / 1024).toFixed(2)} MB` : "Somente PDF, até 8 MB."}</p>

              {message && <p role="alert" className={`mt-5 rounded-xl px-4 py-3 text-sm font-medium ${messageType === "success" ? "bg-emerald-50 text-emerald-800" : "bg-red-50 text-red-700"}`}>{message}</p>}

      };

      // ================= Comprovante moderno (compra de cargo e salário) =================
      const pdfTxt = (t) => String(t ?? "")
        .replace(/[—–]/g, "-").replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/…/g, "...").replace(/[•●]/g, "-")
        .replace(/[^\x20-\x7E\xA0-\xFF]/g, "").replace(/\s+/g, " ").trim();
      let pdfLogoPromise = null;
      const loadPdfLogo = () => pdfLogoPromise || (pdfLogoPromise = new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "anonymous";
        img.onload = () => {
          try {
            const canvas = document.createElement("canvas");
            canvas.width = img.naturalWidth; canvas.height = img.naturalHeight;
            canvas.getContext("2d").drawImage(img, 0, 0);
            resolve(canvas.toDataURL("image/png"));
          } catch { resolve(null); }
        };
        img.onerror = () => resolve(null);
        img.src = PDF_LOGO_URL;
      }));
      const protocoloPdf = (prefixo) => {
        const d = new Date();
        const data = `${String(d.getFullYear()).slice(2)}${String(d.getMonth() + 1).padStart(2, "0")}${String(d.getDate()).padStart(2, "0")}`;
        const rand = Array.from(crypto.getRandomValues(new Uint8Array(3)), (b) => b.toString(16).padStart(2, "0")).join("").toUpperCase();
        return `${prefixo}-${data}-${rand}`;
      };
      const extensoPdf = (valor) => {
        const ext = numeroPorExtenso(Math.max(0, Math.round(Number(valor) || 0)));
        return ext ? ext.charAt(0).toUpperCase() + ext.slice(1) : "";
      };

      // Gera o PDF, baixa para o membro e devolve o arquivo (para envio ao Discord).
      const gerarComprovanteModerno = async ({ tema, escuro, titulo, status, protocolo, data, valorLabel, valor, extenso, secoes = [], passos = [], arquivo }) => {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ unit: "mm", format: "a4" });
        const W = 210, H = 297, M = 16;
        const tint = tema.map((c) => Math.round(c + (255 - c) * 0.9));
        const logo = await loadPdfLogo();
        const emitido = new Date(data || Date.now()).toLocaleString("pt-BR", { day: "2-digit", month: "2-digit", year: "numeric", hour: "2-digit", minute: "2-digit" });
        const autenticacao = Array.from(crypto.getRandomValues(new Uint8Array(8)), (b) => b.toString(16).padStart(2, "0")).join("").toUpperCase().match(/.{4}/g).join("-");

        // Cabeçalho
        doc.setFillColor(...escuro); doc.rect(0, 0, W, 46, "F");
        doc.setFillColor(...tema); doc.rect(0, 46, W, 1.6, "F");
        doc.setFillColor(255, 255, 255); doc.circle(M + 11, 23, 11, "F");
        let logoOk = false;
        if (logo) { try { doc.addImage(logo, "PNG", M + 2.5, 14.5, 17, 17); logoOk = true; } catch {} }
        if (!logoOk) {
          doc.setFillColor(...tema); doc.rect(M + 9.3, 16.5, 3.4, 13, "F"); doc.rect(M + 4.5, 21.3, 13, 3.4, "F");
        }
        doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(16);
        doc.text("SAMU 192", M + 28, 19);
        doc.setFont("helvetica", "normal"); doc.setFontSize(8.5); doc.setTextColor(210, 214, 222);
        doc.text("Setor Financeiro  ·  Portal do SAMU", M + 28, 25);
        doc.setFont("helvetica", "bold"); doc.setFontSize(11); doc.setTextColor(255, 255, 255);
        doc.text(pdfTxt(titulo).toUpperCase(), M + 28, 35);
        doc.setFont("helvetica", "normal"); doc.setFontSize(7.5); doc.setTextColor(190, 196, 208);
        doc.text("PROTOCOLO", W - M, 16, { align: "right" });
        doc.text("EMITIDO EM", W - M, 30, { align: "right" });
        doc.setFont("helvetica", "bold"); doc.setFontSize(10.5); doc.setTextColor(255, 255, 255);
        doc.text(pdfTxt(protocolo), W - M, 22, { align: "right" });
        doc.setFont("helvetica", "normal"); doc.setFontSize(9.5);
        doc.text(pdfTxt(emitido), W - M, 36, { align: "right" });

        let y = 55;
        // Status
        doc.setFont("helvetica", "bold"); doc.setFontSize(7.5);
        const statusTxt = pdfTxt(status).toUpperCase();
        const pillW = doc.getTextWidth(statusTxt) + 12;
        doc.setFillColor(...tint); doc.roundedRect(M, y, pillW, 7.5, 3.7, 3.7, "F");
        doc.setFillColor(...tema); doc.circle(M + 4.2, y + 3.75, 1.2, "F");
        doc.setTextColor(...tema); doc.text(statusTxt, M + 7.5, y + 5.1);
        y += 13;

        // Valor em destaque
        doc.setFillColor(248, 250, 252); doc.setDrawColor(226, 232, 240); doc.setLineWidth(0.3);
        doc.roundedRect(M, y, W - M * 2, extenso ? 31 : 25, 3, 3, "FD");
        doc.setFillColor(...tema); doc.rect(M, y + 3, 1.6, (extenso ? 31 : 25) - 6, "F");
        doc.setFont("helvetica", "normal"); doc.setFontSize(8); doc.setTextColor(100, 116, 139);
        doc.text(pdfTxt(valorLabel).toUpperCase(), M + 8, y + 8.5);
        doc.setFont("helvetica", "bold"); doc.setFontSize(24); doc.setTextColor(15, 23, 42);
        doc.text(pdfTxt(valor), M + 8, y + 19.5);
        if (extenso) {
          doc.setFont("helvetica", "italic"); doc.setFontSize(8); doc.setTextColor(100, 116, 139);
          doc.text(doc.splitTextToSize(pdfTxt(extenso), W - M * 2 - 16)[0], M + 8, y + 26.5);
        }
        y += (extenso ? 31 : 25) + 8;

        const novaPagina = (altura) => {
          if (y + altura <= H - 24) return;
          doc.addPage(); y = 20;
        };
        // Seções (as marcadas com "meia: true" ficam lado a lado, em duplas)
        const desenharSecao = (secao, x, largura, inicio) => {
          let sy = inicio;
          doc.setFont("helvetica", "bold"); doc.setFontSize(7.8); doc.setTextColor(...tema);
          doc.text(pdfTxt(secao.titulo).toUpperCase(), x, sy);
          sy += 2.2;
          doc.setDrawColor(...tema); doc.setLineWidth(0.4); doc.line(x, sy, x + 10, sy);
          doc.setDrawColor(226, 232, 240); doc.setLineWidth(0.2); doc.line(x + 10, sy, x + largura, sy);
          sy += 5.2;
          for (const [rotulo, valorLinha, tom] of secao.linhas) {
            const partes = doc.splitTextToSize(pdfTxt(valorLinha), largura * 0.55);
            const altura = Math.max(6.4, partes.length * 4.2 + 2.2);
            if (tom === "total") { doc.setFillColor(248, 250, 252); doc.rect(x, sy - 4.3, largura, altura, "F"); }
            doc.setFont("helvetica", tom === "total" ? "bold" : "normal"); doc.setFontSize(9);
            if (tom === "total") doc.setTextColor(15, 23, 42); else doc.setTextColor(100, 116, 139);
            doc.text(pdfTxt(rotulo), x + 1.5, sy);
            doc.setFont("helvetica", "bold");
            if (tom === "neg") doc.setTextColor(190, 18, 60);
            else if (tom === "pos") doc.setTextColor(4, 120, 87);
            else doc.setTextColor(15, 23, 42);
            doc.text(partes, x + largura - 1.5, sy, { align: "right" });
            sy += altura;
            if (tom !== "total") { doc.setDrawColor(241, 245, 249); doc.setLineWidth(0.2); doc.line(x, sy - 4.2, x + largura, sy - 4.2); }
          }
          return sy + 3;
        };
        const alturaSecao = (secao, largura) => 8 + secao.linhas.reduce((sum, [, v]) =>
          sum + Math.max(6.4, doc.splitTextToSize(pdfTxt(v), largura * 0.55).length * 4.2 + 2.2), 0) + 3;
        const validas = secoes.map((secao) => ({ ...secao, linhas: (secao.linhas || []).filter(Boolean) })).filter((secao) => secao.linhas.length);
        for (let i = 0; i < validas.length; i++) {
          const secao = validas[i];
          const par = secao.meia && validas[i + 1]?.meia ? validas[i + 1] : null;
          if (par) {
            const largura = (W - M * 2 - 8) / 2;
            novaPagina(Math.max(alturaSecao(secao, largura), alturaSecao(par, largura)));
            const fim = Math.max(desenharSecao(secao, M, largura, y), desenharSecao(par, M + largura + 8, largura, y));
            y = fim;
            i++;
          } else {
            novaPagina(alturaSecao(secao, W - M * 2));
            y = desenharSecao(secao, M, W - M * 2, y);
          }
        }
        y += 2;

        // Próximos passos
        if (passos.length) {
          const textos = passos.map((t) => doc.splitTextToSize(pdfTxt(t), W - M * 2 - 20));
          const altura = 12 + textos.reduce((sum, t) => sum + t.length * 4.3 + 2.2, 0);
          novaPagina(altura);
          doc.setFillColor(...tint); doc.roundedRect(M, y, W - M * 2, altura, 3, 3, "F");
          doc.setFont("helvetica", "bold"); doc.setFontSize(8); doc.setTextColor(...tema);
          doc.text("PRÓXIMOS PASSOS", M + 6, y + 7);
          let py = y + 13;
          textos.forEach((linhas, i) => {
            doc.setFillColor(...tema); doc.circle(M + 8, py - 1.2, 2.3, "F");
            doc.setFont("helvetica", "bold"); doc.setFontSize(7); doc.setTextColor(255, 255, 255);
            doc.text(String(i + 1), M + 8, py - 0.1, { align: "center" });
            doc.setFont("helvetica", "normal"); doc.setFontSize(8.8); doc.setTextColor(51, 65, 85);
            doc.text(linhas, M + 13, py);
            py += linhas.length * 4.3 + 2.2;
          });
          y += altura + 6;
        }

        // Rodapé em todas as páginas
        const total = doc.getNumberOfPages();
        for (let page = 1; page <= total; page++) {
          doc.setPage(page);
          doc.setDrawColor(226, 232, 240); doc.setLineWidth(0.3); doc.line(M, H - 17, W - M, H - 17);
          doc.setFont("helvetica", "normal"); doc.setFontSize(7.2); doc.setTextColor(100, 116, 139);
          doc.text(`Autenticação: ${autenticacao}`, M, H - 12);
          doc.text(`Página ${page} de ${total}`, W - M, H - 12, { align: "right" });
          doc.setTextColor(148, 163, 184);
          doc.text("Documento gerado eletronicamente pelo Portal do SAMU. Valores fictícios de jogo (roleplay), sem relação com dinheiro real.", M, H - 8);
        }
        doc.save(arquivo);
        return { blob: doc.output("blob"), arquivo };
      };

      const RoleForm = ({ currentMember, memberToken }) => {

      const numeroPorExtenso = (v) => {
        if (!v) return "";
        v = Math.round(v);
        if (v === 0) return "zero reais";

        const unidades = [
          "",
          "um",
          "dois",
          "três",
          "quatro",
          "cinco",
          "seis",
          "sete",
          "oito",
          "nove",
        ];
        const dezenas = [
          "",
          "dez",
          "vinte",
          "trinta",
          "quarenta",
          "cinquenta",
          "sessenta",
          "setenta",
          "oitenta",
          "noventa",
        ];
        const d10 = [
          "dez",
          "onze",
          "doze",
          "treze",
          "quatorze",
          "quinze",
          "dezesseis",
          "dezessete",
          "dezoito",
          "dezenove",
        ];
        const centenas = [
          "",
          "cento",
          "duzentos",
          "trezentos",
          "quatrocentos",
          "quinhentos",
          "seiscentos",
          "setecentos",
          "oitocentos",
          "novecentos",
        ];

        const getGroup = (n) => {
          let u = n % 10;
          let d = Math.floor((n % 100) / 10);
          let c = Math.floor(n / 100);
          let str = "";

          if (c > 0) {
            if (n === 100) return "cem";
            str += centenas[c];
          }

          if (d > 0 || u > 0) {
            if (str) str += " e ";
            if (d === 1) {
              str += d10[u];
            } else {
              if (d > 0) str += dezenas[d];
              if (d > 0 && u > 0) str += " e ";
              if (u > 0) str += unidades[u];
            }
          }
          return str;
        };

        let str = "";
        let groups = [];
        let temp = v;

        while (temp > 0) {
          groups.push(temp % 1000);
          temp = Math.floor(temp / 1000);
        }

        const names = ["", "mil", "milhões", "bilhões"];

        for (let i = groups.length - 1; i >= 0; i--) {
          let g = groups[i];
          if (g === 0) continue;

          let gStr = getGroup(g);
          let suffix = names[i];

          if (i === 1 && g === 1) {
            // 1000 -> mil (not um mil)
            gStr = "";

          if (i > 1 && g === 1) {

      const BANK_TIPO_INFO = {

      const bankDateLabel = (iso) => {

      // Detalhes de um lançamento do extrato (usado no cartão ao passar o cursor e no comprovante).
