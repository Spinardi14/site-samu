      const AdminBanco = ({ token, mode, portalMembers = [] }) => {
        const [rows, setRows] = useState(null);
        const [movTip, movTipNode] = useBankMovTip();
        const [loans, setLoans] = useState(null);
        const [msg, setMsg] = useState("");
        const [dias, setDias] = useState(7);
        const [tipo, setTipo] = useState("");
        const [filtro, setFiltro] = useState("");
        const [ajuste, setAjuste] = useState({ busca: "", membro: null, valor: "", motivo: "" });
        const [liberacoes, setLiberacoes] = useState([]);
        const [pagina, setPagina] = useState(1);
        const [limpando, setLimpando] = useState(false);
        const [balanco, setBalanco] = useState(null);
        const POR_PAGINA = 25;
        useEffect(() => { setPagina(1); }, [filtro, tipo, dias, mode]);
        const call = (path, options) => bankFetch(path, token, options);
        const load = async () => {
          setMsg("");
          try {
            if (mode === "movimentos") {
              const [result, pedidos, resumo] = await Promise.all([
                call(`/admin/banco/movimentos?dias=${dias}${tipo ? `&tipo=${tipo}` : ""}`),
                call("/admin/banco/liberacoes").catch(() => []),
                call("/admin/banco/balanco").catch(() => null),
              ]);
              setRows(result);
              setBalanco(resumo);
              setLiberacoes(Array.isArray(pedidos) ? pedidos : []);
            } else {
              setLoans(await call("/admin/banco/emprestimos"));
            }
          } catch (err) { setMsg(err.message); }
        };
        useEffect(() => { load(); }, [mode, dias, tipo]);
        const acao = async (fn, ok) => {

          if (!ajuste.membro || !valor || !ajuste.motivo.trim()) return setMsg("Selecione o membro, o valor e o motivo.");

                    <input value={ajuste.motivo} onChange={(e) => setAjuste({ ...ajuste, motivo: e.target.value.slice(0, 150) })} placeholder="Motivo (aparece no extrato)" className="w-full px-3 border rounded-lg" />

                      {!rows ? <tr><td colSpan="5" className="p-6 text-center text-slate-400">Carregando…</td></tr> : lista.length === 0 ? <tr><td colSpan="5" className="p-6 text-center text-slate-400">Nenhuma movimentação.</td></tr> : listaPagina.map((m) => (

                  const np = prompt("Quantidade total de parcelas:", String(loan.parcelas)); if (np === null) return;
                  const tt = prompt("Total a pagar:", String(loan.total)); if (tt === null) return;
                  const dt = prompt("Próxima parcela (AAAA-MM-DD):", (loan.proxima_parcela_em || "").slice(0, 10)); if (dt === null) return;
                  acao(() => call(`/admin/banco/emprestimos/${loan.id}`, { method: "PATCH", body: JSON.stringify({ valor_parcela: parseMoney(vp), parcelas: Number(np), total: parseMoney(tt), proxima_parcela_em: `${dt}T12:00:00-03:00` }) }), "Empréstimo atualizado.");
                }} className="px-3 py-1.5 bg-slate-900 text-white rounded-lg font-bold text-xs">Editar</button>
                <button type="button" onClick={() => { const o = prompt("Quitar (perdoar o restante). Observação:", "Quitado pela administração"); if (o !== null) acao(() => call(`/admin/banco/emprestimos/${loan.id}/quitar`, { method: "POST", body: JSON.stringify({ observacao: o }) }), "Empréstimo quitado."); }} className="px-3 py-1.5 bg-emerald-600 text-white rounded-lg font-bold text-xs">Quitar</button>
                <button type="button" onClick={() => { if (!confirm("Cancelar este empréstimo?")) return; const estornar = confirm("Estornar também o crédito e as parcelas já cobradas? (OK = sim, Cancelar = não)"); acao(() => call(`/admin/banco/emprestimos/${loan.id}/cancelar`, { method: "POST", body: JSON.stringify({ estornar }) }), "Empréstimo cancelado."); }} className="px-3 py-1.5 bg-rose-600 text-white rounded-lg font-bold text-xs">Cancelar</button>
              </div>
            )}
          </div>
        );
        return (
          <div className="admin-surface bg-white rounded-3xl shadow-xl border overflow-hidden">
            {header("Empréstimos", "Contratos em aberto e encerrados nos últimos 30 dias.")}
            <div className="p-6 md:p-8 space-y-6">
              <div className="grid sm:grid-cols-3 gap-3">
                <div className="rounded-2xl bg-rose-50 px-4 py-3"><p className="text-xs text-rose-700">A receber (em aberto)</p><p className="text-xl font-black tabular-nums text-rose-900">{fmtBRL(loans?.total_aberto)}</p></div>
                <div className="rounded-2xl bg-emerald-50 px-4 py-3"><p className="text-xs text-emerald-700">Capital emprestado</p><p className="text-xl font-black tabular-nums text-emerald-900">{fmtBRL(loans?.total_emprestado)}</p></div>
                <div className="rounded-2xl bg-slate-50 px-4 py-3"><p className="text-xs text-slate-500">Contratos ativos</p><p className="text-xl font-black tabular-nums">{loans?.ativos?.length ?? "—"}</p></div>
              </div>
              {msg && <p role="status" className="p-3 bg-blue-50 border border-blue-100 text-blue-800 rounded-lg text-sm font-bold">{msg}</p>}
              <div className="space-y-3">
                {!loans ? <p className="text-slate-400">Carregando…</p> : loans.ativos.length === 0 ? <p className="text-slate-400">Nenhum empréstimo em aberto.</p> : loans.ativos.map((loan) => <LoanCard key={loan.id} loan={loan} aberto />)}
              </div>
              {loans?.encerrados?.length > 0 && (
                <div>
                  <h3 className="font-black mb-3">Encerrados (30 dias)</h3>
                  <div className="space-y-3">{loans.encerrados.map((loan) => <LoanCard key={loan.id} loan={loan} />)}</div>
                </div>
              )}
            </div>
          </div>
        );
      };

      const SalaryForm = ({ currentMember, memberToken, onViewChange }) => {
        const formatDateInput = (date) => {
          const year = date.getFullYear();
          const month = String(date.getMonth() + 1).padStart(2, "0");
          const day = String(date.getDate()).padStart(2, "0");
          return `${year}-${month}-${day}`;
        };
        // O ciclo fecha no sabado 00h: o pagamento precisa ser agendado ate a sexta.
        const getPaymentWeekRange = () => {
          const today = new Date();
          today.setHours(0, 0, 0, 0);
          const friday = new Date(today);
          friday.setDate(today.getDate() + ((5 - today.getDay() + 7) % 7));
          return { min: formatDateInput(today), max: formatDateInput(friday) };
        };
        const paymentWeek = getPaymentWeekRange();
        const emptyForm = { shift: "noite", time: "", day: paymentWeek.min, outrosNome: "", outrosValor: "" };
        const [tipo, setTipo] = useState("");
        const [form, setForm] = useState(emptyForm);
        const [showMetaConfirmation, setShowMetaConfirmation] = useState(false);
        const [loading, setLoading] = useState(false);
        const [status, setStatus] = useState("idle");
        const [errorMessage, setErrorMessage] = useState("");
        const [salaryNotice, setSalaryNotice] = useState("");
        const [salaryFines, setSalaryFines] = useState([]);
        const [loadingFines, setLoadingFines] = useState(false);
        const [donationBalance, setDonationBalance] = useState({ advertencias_desconto: 0 });
        const [donationBalanceStatus, setDonationBalanceStatus] = useState("loading");
        const [donationBalanceError, setDonationBalanceError] = useState("");
        const [salaryPermission, setSalaryPermission] = useState({ status: "loading", message: "" });
        const [conta, setConta] = useState(null);
        const [contaError, setContaError] = useState("");

        const verifySalaryPermission = async () => {
          setSalaryPermission({ status: "loading", message: "" });
          try {
            const response = await fetch(`${BANK_API}/portal/salario/permissao`, { headers: { Authorization: "Bearer " + memberToken } });
            if (response.status === 404) throw new Error("A API publicada está desatualizada. Publique o index.js atualizado.");
            const data = await response.json().catch(() => ({}));
            if (!response.ok) throw new Error(data.erro || `Não foi possível verificar a Meta Financeira (HTTP ${response.status}).`);
            setSalaryPermission(data.autorizado ? { status: "allowed", message: data.mensagem || "", soRetido: Number(data.so_retido || 0) } : { status: "blocked", message: data.mensagem || "Efetue o pagamento da Meta Financeira para finalizar a solicitação." });
          } catch (err) {
            setSalaryPermission({ status: "error", message: err.message || "Não foi possível verificar a Meta Financeira." });
          }
        };
        const loadConta = async () => {
          try { setConta(await bankFetch("/portal/banco?resumo=1", memberToken)); setContaError(""); }
          catch (err) { setContaError(err.message); }
        };
        useEffect(() => { verifySalaryPermission(); loadConta(); }, [memberToken]);
        useEffect(() => {
          if (salaryPermission.status !== "allowed") return;
          let active = true;
          setDonationBalanceStatus("loading");
          fetch(`${BANK_API}/portal/doacoes/saldo`, { headers: { Authorization: "Bearer " + memberToken } })
            .then(async (response) => {
              const data = await response.json().catch(() => ({}));
              if (!response.ok) throw new Error(data.erro || `A API recusou a consulta de advertências (HTTP ${response.status}).`);
              return data;
            })
            .then((data) => { if (active) { setDonationBalance(data); setDonationBalanceStatus("ready"); } })
            .catch((err) => { if (active) { setDonationBalanceError(err.message || "Falha de conexão com a API."); setDonationBalanceStatus("error"); } });
          return () => { active = false; };
        }, [memberToken, salaryPermission.status]);
        useEffect(() => {
          if (salaryPermission.status !== "allowed" || !currentMember.ingame_id) return;
          let active = true;
          setLoadingFines(true);
          fetch(`${BANK_API}/multas/${encodeURIComponent(currentMember.ingame_id)}?status=pendente`)
            .then((r) => r.json())
            .then((data) => { if (active) setSalaryFines(Array.isArray(data) ? data : []); })
            .catch(() => { if (active) setSalaryFines([]); })
            .finally(() => { if (active) setLoadingFines(false); });
          return () => { active = false; };
        }, [currentMember.ingame_id, salaryPermission.status]);

        const salario = conta?.salario_cargo || { valor: 0, pendente: false, nome: "" };
        const contaLiberadaTotal = Number(conta?.setores_disponivel ?? conta?.disponivel_saque ?? 0);
        // Sem Meta Financeira: só o valor retido pelo limite (liberado na virada) pode sair em Setores.
        const retidoSemMeta = !(conta?.meta_paga || conta?.meta_isento) ? Number(conta?.retido_sacavel || 0) : 0;
        const contaLiberada = retidoSemMeta > 0 ? Math.min(contaLiberadaTotal, retidoSemMeta) : contaLiberadaTotal;
        const outrosDisponivel = Number(conta?.outros_disponivel || 0);
        const emApuracao = Number(conta?.em_apuracao || 0);
        const metaPaga = Boolean(conta?.meta_paga || conta?.meta_isento);
        const libera = conta?.fechamento ? bankShortDate(conta.fechamento) : "sábado";
        const setoresBadge = retidoSemMeta > 0 ? `⏸️ Valor retido pelo limite: ${fmtBRL(contaLiberada)} liberado sem precisar da Meta Financeira`
          : !metaPaga && (contaLiberada > 0 || emApuracao > 0) ? "🔒 Pague a Meta Financeira para liberar"
          : contaLiberada <= 0 ? (emApuracao ? `⏳ ${fmtBRL(emApuracao)} liberam em ${libera}` : "Sem valor de setores no momento") : "";
        const cargoBadge = salario.valor && salario.pendente && !metaPaga ? "🔒 Pague a Meta Financeira para liberar"
          : !salario.valor || salario.pendente ? ""
          : salario.situacao === "pago" ? "✓ Já pago nesta semana · volta no próximo ciclo"
          : salario.situacao === "retido" ? "⏸️ Retido pelo limite semanal do SAMU · libera no próximo ciclo"
          : salario.situacao ? "⏳ Já solicitado · aguardando o Financeiro"
          : `⏱️ Complete 4h de bate-ponto na semana para liberar (você tem ${fmtHorasPonto(salario.horas_minutos)})`;
        const options = [
          { type: "salario", title: "Salário do Cargo", description: salario.valor ? `${salario.nome} · ${fmtBRL(salario.valor)} · pode sacar a qualquer momento da semana` : "Seu cargo atual não possui salário cadastrado.",
            disabled: !salario.pendente || !metaPaga, badge: cargoBadge },
          { type: "setor", title: "Setores", description: `Cursos, recrutamentos, tarefas e comissões · disponível ${fmtBRL(contaLiberada)}`,
            disabled: contaLiberada <= 0 || (!metaPaga && retidoSemMeta <= 0), badge: setoresBadge },
          { type: "ambos", title: "Salário do Cargo + Setores", description: "Os dois de uma vez, em um único pagamento.",
            disabled: !salario.pendente || contaLiberada <= 0 || !metaPaga, badge: !salario.pendente || contaLiberada <= 0 || !metaPaga ? "Disponível quando as duas opções acima estiverem liberadas" : "" },
          { type: "outros", title: "Outros", description: `Envios recebidos, sorteios, bônus e eventos · disponível ${fmtBRL(outrosDisponivel)}`,
            disabled: outrosDisponivel <= 0 || !metaPaga,
            badge: outrosDisponivel > 0 && !metaPaga ? "🔒 Pague a Meta Financeira para liberar" : outrosDisponivel <= 0 ? "Sem saldo de outros no momento" : "" },
        ];
        const incluiCargo = tipo === "salario" || tipo === "ambos";
        const incluiConta = tipo === "setor" || tipo === "ambos";
        const cargoPedido = incluiCargo ? salario.valor : 0;
        const contaPedido = incluiConta && contaLiberada > 0 ? contaLiberada : 0;
        const outrosVal = tipo === "outros" ? parseMoney(form.outrosValor) : 0;
        const totalPedido = cargoPedido + contaPedido + outrosVal;
        // Limite semanal de gastos do SAMU: só é pago o que cabe no limite do ciclo.
        // O resto fica retido (salário do cargo, depois setores, depois outros).
        const samuLim = conta?.samu_limite || null;
        // O retido do ciclo anterior tem prioridade (passa mesmo sem limite) e o
        // limite libera o bruto cujo custo real (sem as taxas de 3%/7%) cabe nele.
        const prioridadeRetido = Math.min(contaPedido, Number(conta?.retido_sacavel || 0));
        const capacidadeLimite = (() => {
          const d = Math.max(0, Number(samuLim?.disponivel || 0));
          if (!d || outrosVal > 0) return d;
          const comSuper = Math.floor(d / 0.9);
          return comSuper >= 4000000 ? comSuper : Math.min(Math.floor(d / 0.97), 3999999);
        })();
        const retidoPrev = samuLim && !samuLim.isento && !conta?.conta_corporativa ? Math.max(0, totalPedido - prioridadeRetido - capacidadeLimite) : 0;
        const retCargo = Math.min(cargoPedido, retidoPrev);
        const retConta = Math.min(contaPedido - prioridadeRetido, retidoPrev - retCargo);
        const retOutros = Math.min(outrosVal, retidoPrev - retCargo - retConta);
        const bonusPrev = retidoPrev > 0 && !samuLim?.bonus_recebido ? Number(samuLim?.bonus_valor || 500000) : 0;
        const cargoVal = cargoPedido - retCargo;
        const contaCred = contaPedido - retConta;
        const outrosPago = outrosVal - retOutros;
        const total = cargoVal + contaCred + outrosPago;
        // Empréstimo ainda não sacado sai sem nenhuma taxa.
        const emprestimoCred = Math.min(outrosPago, Math.max(0, Number(conta?.emprestimo_disponivel || 0)));
        const setoresCred = contaCred;
        const tributavel = conta?.conta_corporativa ? 0 : total - emprestimoCred;
        const commission = Math.round(tributavel * 0.1);
        const withdrawalTax = Math.round(tributavel * 0.03);
        const superTax = tributavel >= 4000000 ? Math.round(tributavel * 0.07) : 0;
        const liquidoAntesConta = total - commission - withdrawalTax - superTax;
        const debitoEnviado = Number(conta?.debito_salario || 0);
        const contaDeb = debitoEnviado > 0 && tipo !== "outros" ? Math.min(debitoEnviado, Math.max(liquidoAntesConta, 0)) : 0;
        const parcelaPendente = Number(conta?.parcela_pendente || 0);
        const parcelaDeb = parcelaPendente > 0 && tipo !== "outros" && !conta?.conta_corporativa ? Math.min(parcelaPendente, Math.max(liquidoAntesConta - contaDeb, 0)) : 0;
        const afterFees = Math.max(liquidoAntesConta - contaDeb - parcelaDeb, 0);
        const fineTotal = salaryFines.reduce((sum, fine) => sum + Number(fine.valor || 0), 0);
        const fineDiscount = Math.min(afterFees, fineTotal);
        const fineRemaining = Math.max(fineTotal - fineDiscount, 0);
        const net = Math.max(afterFees - fineDiscount, 0) - Number(donationBalance.advertencias_desconto || 0);

        const generateSalaryReceipt = async (r) => {
          try {
            const tipoTitulo = options.find((o) => o.type === r.tipo_pagamento)?.title || r.tipo_pagamento;
            const neg = (v) => "-" + fmtBRL(v);
            await gerarComprovanteModerno({
              tema: [37, 99, 235], escuro: [11, 27, 66],
              titulo: "Comprovante de solicitação de salário",
              status: "Solicitação registrada · aguardando pagamento",
              protocolo: `SAL-${r.pagamento?.id || protocoloPdf("X").slice(2)}`, data: new Date().toISOString(),
              valorLabel: "Valor líquido a receber", valor: fmtBRL(Math.max(0, r.valor_pago)), extenso: extensoPdf(r.valor_pago),
              secoes: [
                { titulo: "Colaborador", meia: true, linhas: [["Nome", currentMember.nome], ["ID in-game", currentMember.ingame_id], r.cargo_nome ? ["Cargo atual", r.cargo_nome] : null] },
                { titulo: "Agendamento", meia: true, linhas: [
                  ["Tipo de pagamento", tipoTitulo],
                  ["Data", form.day.split("-").reverse().join("/")],
                  ["Turno", form.shift.charAt(0).toUpperCase() + form.shift.slice(1)],
                  ["Horário", form.time],
                ] },
                { titulo: "Composição", linhas: [
                  r.salario_cargo ? [`Salário do cargo (${r.cargo_nome})`, fmtBRL(r.salario_cargo)] : null,
                  Number(r.conta_credito) - Number(r.conta_emprestimo || 0) > 0 ? ["Setores", fmtBRL(Number(r.conta_credito) - Number(r.conta_emprestimo || 0))] : null,
                  Number(r.conta_emprestimo) > 0 ? ["Empréstimo (sem taxas)", fmtBRL(r.conta_emprestimo)] : null,
                  r.outros_valor ? [`Outros (${r.outros_nome})`, fmtBRL(r.outros_valor)] : null,
                  ["Salário bruto", fmtBRL(r.valor_bruto), "total"],
                ] },
                { titulo: "Descontos", linhas: [
                  ["Comissão do Financeiro (10%)", neg(r.comissao_financeiro), "neg"],
                  ["Taxa de saque (3%)", neg(r.taxa_saque), "neg"],
                  r.taxa_super_salario ? ["Imposto super salário (7%)", neg(r.taxa_super_salario), "neg"] : null,
                  r.conta_debito ? ["Envios acima do saldo", neg(r.conta_debito), "neg"] : null,
                  Number(r.conta_parcela) > 0 ? ["Parcela de empréstimo (paga após o pagamento do saque)", neg(r.conta_parcela), "neg"] : null,
                  r.valor_descontado ? ["Multas", neg(r.valor_descontado), "neg"] : null,
                  Number(r.valor_advertencias) > 0 ? ["Advertências", neg(r.valor_advertencias), "neg"] : null,
                ] },
                { titulo: "Resultado", linhas: [
                  ["Valor líquido a receber", fmtBRL(Math.max(0, r.valor_pago)), "total"],
                  r.valor_pendente_multas ? ["Multa restante a pagar", fmtBRL(r.valor_pendente_multas), "neg"] : null,
                ] },
              ],
              passos: [
                "Confirme o seu saque no Discord, no canal de pagamentos pendentes.",
                "O Setor Financeiro realiza o pagamento no dia e horário agendados.",
                "Membros acima de Médico-Chefe devem estar com a meta financeira semanal em dia (R$ 500.000).",
              ],
              arquivo: `comprovante-salario-${currentMember.ingame_id}-${r.pagamento?.id || "samu"}.pdf`,
            });
          } catch (err) {
            console.error("Erro ao gerar comprovante do salário:", err);
          }
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          setStatus("idle");
          setErrorMessage("");
          if (donationBalanceStatus !== "ready") return setErrorMessage(donationBalanceError || "Não foi possível confirmar as advertências pendentes. Atualize a página antes de agendar.");
          if (tipo === "outros" && (!form.outrosNome.trim() || outrosVal <= 0)) return setErrorMessage("Informe a descrição e o valor do pagamento.");
          if (tipo === "outros" && outrosVal > outrosDisponivel) return setErrorMessage(`Em "Outros" você pode sacar até ${fmtBRL(outrosDisponivel)}. Salário, cursos e recrutamentos não entram aqui.`);
          if (!/^([01]\d|2[0-3]):[0-5]\d$/.test(form.time)) return setErrorMessage("Informe o horário no formato 00:00.");
          if (totalPedido <= 0) return setErrorMessage("Não há valor a sacar nesta opção.");
          setShowMetaConfirmation(true);
        };

        const confirmSubmit = async () => {
          setShowMetaConfirmation(false);
          setLoading(true);
          setStatus("idle");
          setErrorMessage("");
          try {
            const response = await fetch(`${BANK_API}/solicitar-salario`, {
              method: "POST",
              headers: { "Content-Type": "application/json", Authorization: "Bearer " + memberToken },
              body: JSON.stringify({ tipo_pagamento: tipo, dia: form.day, horario: form.time, turno: form.shift, outros_nome: form.outrosNome.trim(), outros_valor: outrosVal }),
            });
            const result = await response.json().catch(() => ({}));
            if (!response.ok || !result.sucesso) throw new Error(result.erro || "Falha ao enviar solicitação");
            setStatus("success");
            setSalaryNotice(result.aviso || (result.conta_credito
              ? `Solicitação enviada ao Financeiro. ${fmtBRL(result.conta_credito)} da Conta SAMU ficam reservados e são descontados do saldo quando o pagamento for realizado.`
              : "Solicitação enviada ao Financeiro. Acompanhe em pagamentos pendentes no Discord."));
            if (result.pagamento) generateSalaryReceipt(result);
            setForm(emptyForm);
            setTipo("");
            setSalaryFines([]);
            loadConta();
          } catch (error) {
            setStatus("error");
            setErrorMessage(error.message || "Ocorreu um erro ao enviar a solicitação. Tente novamente.");
          } finally {
            setLoading(false);
          }
        };

        const salaryRow = (label, value, tone = "") => (
          <div className={`flex justify-between items-center gap-4 py-1.5 text-sm ${tone}`}>
            <span>{label}</span>
            <span className="font-medium tabular-nums">{value}</span>
          </div>
        );

        if (salaryPermission.status !== "allowed") {
          return (
            <div className="max-w-2xl mx-auto">
              <PageTitle title="Solicitar Salário" />
              <div className={ui.card + " p-8 text-center"}>
                <p role="alert" className={`rounded-xl px-4 py-3 text-sm font-medium ${salaryPermission.status === "loading" ? "bg-slate-50 text-slate-500" : salaryPermission.status === "blocked" ? "bg-red-50 text-red-700" : "bg-amber-50 text-amber-800"}`}>
                  {salaryPermission.status === "loading" ? "Verificando Meta Financeira no Discord..." : salaryPermission.message}
                </p>
                {salaryPermission.status !== "loading" && <button type="button" onClick={verifySalaryPermission} className="mt-5 h-10 px-5 rounded-xl bg-slate-900 text-sm font-semibold text-white hover:bg-slate-700 transition">Verificar novamente</button>}
              </div>
            </div>
          );
        }

        if (!tipo) {
          return (
            <div className="max-w-2xl mx-auto">
              <PageTitle title="Solicitar Salário" subtitle="Escolha o que deseja sacar.">
                <MemberChip member={currentMember} />
              </PageTitle>
              {salaryNotice && <p role="status" className={`mb-4 rounded-xl px-4 py-3 text-sm font-medium ${salaryNotice.includes("mas") || salaryNotice.includes("Atenção") ? "bg-amber-50 text-amber-800" : "bg-emerald-50 text-emerald-800"}`}>{salaryNotice}</p>}
              <button type="button" onClick={() => onViewChange && onViewChange("banco")} className="mb-4 w-full text-left rounded-2xl p-4 flex items-center gap-4 text-white" style={{ background: "linear-gradient(120deg, #04261a, #062f22 60%, #0b1220)" }}>
                <span className="min-w-0 flex-1">
                  <span className="block text-xs text-emerald-200/80">Setores · disponível para saque</span>
                  <span className="block text-xl font-bold tabular-nums">{conta ? fmtBRL(contaLiberada) : contaError ? "indisponível" : "…"}</span>
                  {emApuracao > 0 && <span className="block text-[11px] text-amber-200">+ {fmtBRL(emApuracao)} liberam em {libera}</span>}
                </span>
                <span className="text-sm font-semibold text-emerald-200">Ver extrato →</span>
              </button>
              {contaError && <p className="mb-4 rounded-xl bg-amber-50 px-4 py-3 text-sm text-amber-800">{contaError}</p>}
              <div className={ui.card + " p-2"}>
                {options.map((option) => (
                  <button key={option.type} type="button" disabled={!conta || option.disabled} onClick={() => { setTipo(option.type); setStatus("idle"); setErrorMessage(""); setSalaryNotice(""); }}
                    className="group w-full text-left rounded-xl px-4 py-4 flex items-center gap-4 hover:bg-slate-50 transition disabled:opacity-50 disabled:hover:bg-transparent">
                    <span className="w-10 h-10 shrink-0 rounded-xl bg-slate-100 text-slate-600 group-hover:bg-red-50 group-hover:text-red-600 flex items-center justify-center transition">
                      <SalaryOptionIcon type={option.type} size={20} />
                    </span>
                    <span className="min-w-0 flex-1">
                      <span className="block font-semibold text-slate-900">{option.title}</span>
                      <span className="block text-sm text-slate-500 mt-0.5">{option.description}</span>
                      {option.badge && <span className="inline-block mt-1.5 rounded-full bg-slate-100 px-2 py-0.5 text-[11px] font-semibold text-slate-600">{option.badge}</span>}
                    </span>
                    <span className="text-slate-300 group-hover:text-slate-900 group-hover:translate-x-0.5 transition">→</span>

              </div>
            </div>
          );
        };

        useEffect(() => {
          fetch(API_URL + "/membros")
            .then((res) => res.json())
            .then((data) => {
              if (data && typeof data === "object") setCourseLeaders(data);
            })
            .catch(() => {});
        }, []);

        const authHeaders = () => ({
          "Content-Type": "application/json",
          Authorization: `Bearer ${leaderAuth.token}`,
        });
        const courseName = (code) =>
          courseOptions.find((course) => course.code === code)?.title || code;
        const formatExpiry = (value) => new Date(value).toLocaleString("pt-BR");
        const readApiResponse = async (res) => {
          const raw = await res.text();
          try {
            return raw ? JSON.parse(raw) : {};
          } catch {
            if (raw.trim().startsWith("<")) {
              throw new Error(
                "O sistema de cursos ainda não está ativo na API. Atualize o arquivo da API no GitHub e aguarde o Render ficar Live.",
              );
            }
            throw new Error(
              "A API retornou uma resposta inválida. Tente novamente em alguns instantes.",
            );
          }
        };

        const validarAcesso = async (e) => {
          e.preventDefault();
          const cleanId = memberId.replace(/\s/g, "");
          setCourseLoading(true);
          setCourseMsg("");
          setMemberAccess(null);
          try {
            const res = await fetch(API_URL + "/cursos/validar", {
              method: "POST",
              headers: { "Content-Type": "application/json" },
              body: JSON.stringify({
                discord_id: cleanId,
                curso: selectedCourse,
              }),
            });
            const data = await readApiResponse(res);
            if (!res.ok || !data.sucesso)
              throw new Error(data.erro || "Acesso não autorizado.");
            setMemberAccess(data);
            setCourseConfig(data.config || null);
            setCourseAnswers({});
            setValidatedCourse(selectedCourse);
            setSelectedCourse("");
            setMemberId("");
            setCourseMsg("");
          } catch (err) {
            setCourseMsg(err.message || "Não foi possível validar o acesso.");
          } finally {
            setCourseLoading(false);
          }
        };

        const carregarAcessos = async (token = leaderAuth.token) => {
          if (!token) return;
          const res = await fetch(API_URL + "/cursos/acessos", {
            headers: { Authorization: `Bearer ${token}` },
          });
          const data = await readApiResponse(res);
          if (!res.ok)
            throw new Error(data.erro || "Erro ao carregar acessos.");
          setActiveAccesses(Array.isArray(data) ? data : []);
        };

        useEffect(() => {
          if (courseArea !== "leader") return;
          let cancelled = false;
          setLeaderAuth({ token: "", admin: null });
          setCourseMsg("");
          fetch(API_URL + "/portal/cursos/leader-access", {
            headers: { Authorization: "Bearer " + memberToken },
          })
            .then(async (response) => {
              const data = await readApiResponse(response);
              if (!response.ok) throw new Error(data.erro || "Acesso ao painel de liberação negado.");
              if (cancelled) return;
              setLeaderAuth({ token: memberToken, admin: { usuario: data.usuario } });
              await carregarAcessos(memberToken);
            })
            .catch((err) => { if (!cancelled) setCourseMsg(err.message); });
          return () => { cancelled = true; };
        }, [courseArea, memberToken]);


        const liberarId = async (e) => {
          e.preventDefault();
          setCourseLoading(true);
          setCourseMsg("");
          try {
            const res = await fetch(API_URL + "/cursos/acessos", {
              method: "POST",
              headers: authHeaders(),
              body: JSON.stringify({
                discord_id: grantId.replace(/\s/g, ""),
                curso: grantCourse,
              }),
            });
            const data = await readApiResponse(res);
            if (!res.ok || !data.sucesso)
              throw new Error(data.erro || "Erro ao liberar acesso.");
            setGrantId("");
            setGrantCourse("");
            setCourseMsg("Curso liberado para este ID por 60 minutos.");
            await carregarAcessos();
          } catch (err) {
            setCourseMsg(err.message || "Erro ao liberar acesso.");
          } finally {
            setCourseLoading(false);
          }
        };

        const revogarId = async (id) => {
          if (!confirm("Revogar agora o acesso deste ID?")) return;
          setCourseLoading(true);
          setCourseMsg("");
          try {
            const res = await fetch(API_URL + "/cursos/acessos/" + id, {
              method: "DELETE",
              headers: authHeaders(),
            });
            const data = await readApiResponse(res);
            if (!res.ok || !data.sucesso)
              throw new Error(data.erro || "Erro ao revogar acesso.");
            setCourseMsg("Acesso revogado.");
            await carregarAcessos();
          } catch (err) {
            setCourseMsg(err.message || "Erro ao revogar acesso.");
          } finally {
            setCourseLoading(false);
          }
        };

        useEffect(() => {
          if (!readerCourse || !memberAccess?.expires_at) return;
          const closeExpiredAccess = () => {
            if (Date.now() >= new Date(memberAccess.expires_at).getTime()) {
              setReaderCourse("");
              setMemberAccess(null);
              setValidatedCourse("");
              setCourseMsg(
                "Seu período de acesso terminou. Solicite uma nova liberação ao líder.",
              );
            }
          };
          closeExpiredAccess();
          const timer = setInterval(closeExpiredAccess, 1000);
          return () => clearInterval(timer);
        }, [readerCourse, memberAccess]);

        const openCourseReader = () => {
          const code = memberAccess?.curso?.codigo;
          if (!code) return;
          setReaderCourse(code);
          setReaderModule(0);
          setCompletedModules([]);
          window.scrollTo({ top: 0, behavior: "smooth" });
        };

        const formOnlyCourses = ["recrutadores", "professores", "financeiro"];
        const documentCourses = ["cfs", "cfm", "cig", "desligamento"];
        const loadEditorConfig = (config = courseConfig) => {
          setEditorConfig({
            titulo_documento: config?.titulo_documento || "",
            conteudo_documento: config?.conteudo_documento || "",
            imagens: Array.isArray(config?.imagens)
              ? config.imagens.join("\n")
              : "",
            perguntas: Array.isArray(config?.perguntas)
              ? config.perguntas
                  .map((item) => item.pergunta || "")
                  .filter(Boolean)
                  .join("\n")
              : "",
          });
        };

        const rememberEditorSelection = () => {
          const selection = window.getSelection();
          if (selection && selection.rangeCount) {
            savedSelectionRef.current = selection.getRangeAt(0).cloneRange();
          }
        };

        const restoreEditorSelection = () => {
          const selection = window.getSelection();
          if (!selection || !savedSelectionRef.current) return;
          selection.removeAllRanges();
          selection.addRange(savedSelectionRef.current);
        };

        const runDocCommand = (command, value = null) => {
          restoreEditorSelection();
          docEditorRef.current?.focus();
          document.execCommand(command, false, value);
          rememberEditorSelection();
        };

        const prepareEditorImages = () => {
          docEditorRef.current
            ?.querySelectorAll("img")
            .forEach((image) => {
              image.setAttribute("draggable", "true");
              image.setAttribute("contenteditable", "false");
              image.style.resize = "both";
              image.style.overflow = "auto";
              image.style.minWidth = image.style.minWidth || "56px";
              image.style.minHeight = image.style.minHeight || "56px";
              if (!image.style.width) image.style.width = "160px";
              if (!image.style.height) image.style.height = "auto";
            });
        };

        const resizeEditorImage = (event) => {
          const image = resizingImageRef.current;
          const start = resizeStartRef.current;
          const editor = docEditorRef.current;
          if (!image || !start || !editor) return;
          const editorWidth = editor.getBoundingClientRect().width - 48;
          const nextWidth = Math.max(
            56,
            Math.min(editorWidth, start.width + event.clientX - start.x),
          );
          image.style.width = `${Math.round(nextWidth)}px`;
          image.style.height = "auto";
        };

        const stopEditorImageResize = () => {
          document.removeEventListener("mousemove", resizeEditorImage);
          resizingImageRef.current = null;
          resizeStartRef.current = null;
          rememberEditorSelection();
        };

        const startEditorImageResize = (event) => {
          if (event.target?.tagName !== "IMG") return;
          const rect = event.target.getBoundingClientRect();
          const isResizeCorner =
            rect.right - event.clientX <= 28 && rect.bottom - event.clientY <= 28;
          if (!isResizeCorner) return;
          event.preventDefault();
          event.stopPropagation();
          resizingImageRef.current = event.target;
          resizeStartRef.current = {
            x: event.clientX,
            width: rect.width,
          };
          document.addEventListener("mousemove", resizeEditorImage);
          document.addEventListener("mouseup", stopEditorImageResize, {
            once: true,
          });
        };

        const insertEditorImage = (file) => {
          if (!file) return;
          if (!file.type.startsWith("image/")) {
            setCourseMsg("Selecione um arquivo de imagem.");
            return;
          }
          if (file.size > 2 * 1024 * 1024) {
            setCourseMsg("A imagem deve ter no máximo 2 MB.");
            return;
          }
          const reader = new FileReader();
          reader.onload = () => {
            restoreEditorSelection();
            docEditorRef.current?.focus();
            document.execCommand(
              "insertHTML",
              false,
              `<img src="${reader.result}" alt="Imagem do curso" draggable="true" contenteditable="false" style="width: 160px; height: auto; resize: both; overflow: auto; min-width: 56px; min-height: 56px;">`,
            );
            prepareEditorImages();
            rememberEditorSelection();
          };
          reader.readAsDataURL(file);
        };

        const moveEditorImage = (event) => {
          if (!draggedImageRef.current) return;
          event.preventDefault();
          let range = document.caretRangeFromPoint?.(
            event.clientX,
            event.clientY,
          );
          if (!range && document.caretPositionFromPoint) {
            const position = document.caretPositionFromPoint(
              event.clientX,
              event.clientY,
            );
            if (position) {
              range = document.createRange();
              range.setStart(position.offsetNode, position.offset);
              range.collapse(true);
            }
          }
          if (!range) return;
          range.insertNode(draggedImageRef.current);
          draggedImageRef.current = null;
          prepareEditorImages();
        };

        const autenticarEditor = async (e) => {
          e.preventDefault();
          setCourseLoading(true);
          setCourseMsg("");
          try {
            const configRes = await fetch(
              API_URL + "/admin/cursos/" + readerCourse + "/config",
              { headers: { Authorization: "Bearer " + memberToken } },
            );
            const configData = await readApiResponse(configRes);
            if (!configRes.ok)
              throw new Error(
                configData.erro || "Erro ao carregar o editor.",
              );
            setEditorToken(memberToken);
            setCourseConfig(configData.config);
            loadEditorConfig(configData.config);
            setCourseMsg("");
            setTimeout(prepareEditorImages, 0);
          } catch (err) {
            setCourseMsg(err.message || "Erro ao liberar edição.");
          } finally {
            setCourseLoading(false);
          }
        };

        const salvarEditor = async () => {
          setCourseLoading(true);
          setCourseMsg("");
          try {
            const perguntas = editorConfig.perguntas
              .split("\n")
              .map((pergunta, index) => ({
                id: `q${index + 1}`,
                pergunta: pergunta.trim(),
                obrigatoria: true,
              }))
              .filter((item) => item.pergunta);
            const payload = {
              titulo_documento: editorConfig.titulo_documento,
              conteudo_documento:
                docEditorRef.current?.innerHTML ||
                editorConfig.conteudo_documento,
              imagens: [],
              perguntas,
            };
            const res = await fetch(
              API_URL + "/admin/cursos/" + readerCourse + "/config",
              {
                method: "PUT",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: "Bearer " + editorToken,
                },
                body: JSON.stringify(payload),
              },
            );
            const data = await readApiResponse(res);
            if (!res.ok || !data.sucesso)
              throw new Error(data.erro || "Erro ao salvar o curso.");

            setCourseConfig(data.config);
            setEditingCourse(false);
            setEditorToken("");
            setCourseMsg("Curso atualizado com sucesso.");
          } catch (err) {
            setCourseMsg(err.message || "Erro ao salvar o curso.");
          } finally {
            setCourseLoading(false);
          }
        };

        const enviarRespostas = async (e) => {
          e.preventDefault();
          setCourseLoading(true);
          setCourseMsg("");
          try {
            const perguntas = Array.isArray(courseConfig?.perguntas)
              ? courseConfig.perguntas
              : [];
            const faltaSetor = perguntas.find((item) => /qual\s+setor/i.test(String(item.pergunta || "")) && item.obrigatoria !== false && !courseAnswers[item.id]);
            if (faltaSetor) throw new Error("Escolha o setor: Recrutamento ou Professores.");
            const res = await fetch(
              API_URL + "/cursos/" + readerCourse + "/respostas",
              {
                method: "POST",
                headers: {
                  "Content-Type": "application/json",
                  Authorization: "Bearer " + memberToken,
                },
                body: JSON.stringify({
                  respostas: perguntas.map((item) => ({
                    id: item.id,
                    resposta: courseAnswers[item.id] || "",
                  })),
                }),
              },
            );
            const data = await readApiResponse(res);
            if (!res.ok || !data.sucesso)
              throw new Error(data.erro || "Erro ao enviar respostas.");
            setCourseAnswers({});
            setCourseMsg(["Respostas enviadas ao setor responsável.", data.aviso].filter(Boolean).join(" "));
          } catch (err) {
            setCourseMsg(err.message || "Erro ao enviar respostas.");
          } finally {
            setCourseLoading(false);
          }
        };

        const renderEditor = () => {
          if (!editingCourse) return null;
          return (
            <div className="fixed inset-0 z-[80] bg-black/60 flex items-center justify-center p-4">
              <div className="bg-white rounded-xl shadow-2xl border w-full max-w-3xl max-h-[92vh] overflow-y-auto">
                <div className="px-6 py-5 bg-gray-900 text-white flex items-center justify-between gap-4">
                  <div>
                    <h3 className="text-xl font-black">Editar curso</h3>
                    <p className="text-sm text-gray-300">
                      Conteúdo, PDF e perguntas do formulário.
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => {
                      setEditingCourse(false);
                      setEditorToken("");
                      setCourseMsg("");
                    }}
                    className="px-3 py-2 bg-white text-gray-900 rounded-lg font-black"
                  >
                    Fechar
                  </button>
                </div>

                {!editorToken ? (
                  <form onSubmit={autenticarEditor} className="p-6">
                    <button disabled={courseLoading} className="w-full bg-gray-900 text-white py-3 rounded-lg font-black disabled:opacity-60">
                      {courseLoading ? "Verificando cargo..." : "Abrir editor"}
                    </button>
                  </form>
                ) : (
                  <div className="p-6 space-y-5">
                    {!formOnlyCourses.includes(readerCourse) && (
                      <React.Fragment>
                        <div>
                          <label className="block text-sm font-black mb-1">
                            Título do material
                          </label>
                          <input
                            value={editorConfig.titulo_documento}
                            onChange={(e) =>
                              setEditorConfig({
                                ...editorConfig,
                                titulo_documento: e.target.value,
                              })
                            }
                            className="w-full px-4 py-3 border rounded-lg"
                            placeholder="Ex.: Introdução à gestão"
                          />
                        </div>
                        <div>
                          <label className="block text-sm font-black mb-1">
                            Documento do curso
                          </label>
                          <div className="border rounded-lg overflow-hidden bg-white">
                            <div className="flex flex-wrap gap-2 p-3 border-b bg-gray-50">
                              <button
                                type="button"
                                onMouseDown={rememberEditorSelection}
                                onClick={() =>
                                  runDocCommand("formatBlock", "h2")
                                }
                                className="px-3 py-2 border bg-white rounded font-black text-sm"
                              >
                                Título
                              </button>
                              <button
                                type="button"
                                onMouseDown={rememberEditorSelection}
                                onClick={() =>
                                  runDocCommand("formatBlock", "p")
                                }
                                className="px-3 py-2 border bg-white rounded font-bold text-sm"
                              >
                                Parágrafo
                              </button>
                              <button
                                type="button"
                                onMouseDown={rememberEditorSelection}
                                onClick={() => runDocCommand("bold")}
                                className="w-10 h-10 border bg-white rounded font-black"
                                title="Negrito"
                              >
                                B
                              </button>
                              <button
                                type="button"
                                onMouseDown={rememberEditorSelection}
                                onClick={() =>
                                  runDocCommand("foreColor", "#7f1d1d")
                                }
                                className="px-3 py-2 border border-red-200 bg-red-50 text-red-900 rounded font-black text-sm"
                              >
                                Vermelho escuro
                              </button>
                              <button
                                type="button"
                                onMouseDown={rememberEditorSelection}
                                onClick={() =>
                                  runDocCommand("foreColor", "#111827")
                                }
                                className="px-3 py-2 border bg-gray-900 text-white rounded font-black text-sm"
                              >
                                Preto
                              </button>
                              <button
                                type="button"
                                onMouseDown={rememberEditorSelection}
                                onClick={() => imageInputRef.current?.click()}
                                className="px-3 py-2 border bg-white rounded font-black text-sm"
                              >
                                + Imagem
                              </button>
                            </div>
                            <div
                              ref={docEditorRef}
                              contentEditable
                              suppressContentEditableWarning
                              className="course-document course-document-editor p-6"
                              dangerouslySetInnerHTML={{
                                __html: editorConfig.conteudo_documento || "",
                              }}
                              onMouseUp={rememberEditorSelection}
                              onMouseDown={startEditorImageResize}
                              onKeyUp={rememberEditorSelection}
                              onInput={prepareEditorImages}
                              onDragStart={(event) => {
                                if (event.target?.tagName === "IMG") {
                                  draggedImageRef.current = event.target;
                                }
                              }}
                              onDragOver={(event) => event.preventDefault()}
                              onDrop={moveEditorImage}
                            ></div>
                          </div>
                          <input
                            ref={imageInputRef}
                            type="file"
                            accept="image/*"
                            onChange={(e) => {
                              insertEditorImage(e.target.files?.[0]);
                              e.target.value = "";
                            }}
                            className="hidden"
                          />
                          <p className="text-xs text-gray-500 mt-1">
                            Selecione a imagem e arraste-a dentro do documento
                            para mudar sua posição. Limite de 2 MB por imagem.
                          </p>
                        </div>
                      </React.Fragment>
                    )}

                    <div>
                      <label className="block text-sm font-black mb-1">
                        Perguntas do formulário
                      </label>
                      <textarea
                        rows="8"
                        value={editorConfig.perguntas}
                        onChange={(e) =>
                          setEditorConfig({
                            ...editorConfig,
                            perguntas: e.target.value,
                          })
                        }
                        className="w-full px-4 py-3 border rounded-lg"
                        placeholder="Digite uma pergunta por linha"
                      />
                      <p className="text-xs text-gray-500 mt-1">
                        Cada linha será uma pergunta obrigatória enviada ao
                        Discord.
                      </p>
                    </div>
                    <button
                      type="button"
                      disabled={courseLoading}
                      onClick={salvarEditor}
                      className="w-full bg-green-600 text-white py-3 rounded-lg font-black disabled:opacity-60"
                    >
                      Salvar alterações
                    </button>
                  </div>
                )}

                {courseMsg && (
                  <div className="mx-6 mb-6 p-3 bg-blue-50 border border-blue-100 text-blue-800 rounded-lg text-sm font-bold">
                    {courseMsg}
                  </div>
                )}
              </div>
            </div>
          );
        };

        const renderCourseForm = () => {
          const perguntas = Array.isArray(courseConfig?.perguntas)
            ? courseConfig.perguntas
            : [];
          return (
            <section className="bg-white border rounded-xl shadow-sm overflow-hidden mt-6">
              <div className="px-6 py-5 bg-gray-900 text-white">
                <p className="text-xs font-black tracking-[0.2em] text-red-400">
                  AVALIAÇÃO
                </p>
                <h3 className="text-2xl font-black mt-1">
                  Formulário do curso
                </h3>
                <p className="text-sm text-gray-300 mt-1">
                  As respostas serão identificadas com seu perfil e encaminhadas
                  ao setor responsável.
                </p>
              </div>
              {perguntas.length ? (
                <form onSubmit={enviarRespostas} className="p-6 space-y-5">
                  {perguntas.map((item, index) => (
                    <div key={item.id}>
                      <label className="block text-sm font-black mb-2">
                        {index + 1}. {item.pergunta}
                      </label>
                      {/qual\s+setor/i.test(String(item.pergunta || "")) ? (
                        <div className="grid grid-cols-2 gap-3">
                          {["Recrutamento", "Professores"].map((opcao) => {
                            const ativo = courseAnswers[item.id] === opcao;
                            return (
                              <button
                                key={opcao}
                                type="button"
                                aria-pressed={ativo}
                                onClick={() => setCourseAnswers({ ...courseAnswers, [item.id]: opcao })}
                                className={`py-3 rounded-lg border-2 font-black transition ${ativo ? "bg-red-600 border-red-600 text-white" : "bg-white border-gray-200 text-gray-800 hover:border-red-400"}`}
                              >
                                {opcao}
                              </button>
                            );
                          })}
                        </div>
                      ) : (
                      <textarea
                        required={item.obrigatoria !== false}
                        rows="4"
                        value={courseAnswers[item.id] || ""}
                        onChange={(e) =>
                          setCourseAnswers({
                            ...courseAnswers,
                            [item.id]: e.target.value,
                          })
                        }
                        className="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-red-500 outline-none"
                      />
                      )}
                    </div>
                  ))}
                  <button
                    disabled={courseLoading}
                    className="w-full bg-red-600 text-white py-3 rounded-lg font-black disabled:opacity-60"
                  >
                    {courseLoading ? "Enviando..." : "Enviar respostas"}
                  </button>
                </form>
              ) : (
                <div className="p-6 text-gray-500">
                  O formulário deste curso ainda está sendo preparado.
                </div>
              )}
            </section>
          );
        };

        const renderDynamicMaterial = () => {
          const hasText = Boolean(courseConfig?.conteudo_documento);
          return (
            <section className="bg-white border rounded-xl shadow-sm overflow-hidden mt-6">
              <div className="px-6 py-5 border-b bg-gray-50 flex items-center justify-between gap-4">
                <h3 className="text-2xl font-black">
                  {courseConfig?.titulo_documento || courseName(readerCourse)}
                </h3>
                <button
                  type="button"
                  onClick={() => {
                    loadEditorConfig();
                    setEditingCourse(true);
                  }}
                  className="w-10 h-10 bg-gray-900 text-white rounded-lg font-black"
                  title="Editar documento e formulário"
                >
                  ✎
                </button>
              </div>
              {hasText ? (
                <div
                  className="course-document p-6 md:p-9"
                  dangerouslySetInnerHTML={{
                    __html: courseConfig.conteudo_documento,
                  }}
                ></div>
              ) : (
                <div className="p-8 text-center text-gray-500">
                  O documento deste curso ainda está sendo preparado.
                </div>
              )}
            </section>
          );
        };

        const activeCourse = courseLessons[readerCourse];
        if (readerCourse && memberAccess) {
          if (formOnlyCourses.includes(readerCourse)) {
            return (
              <div className="max-w-4xl mx-auto py-2">
                {renderEditor()}
                <div className="flex items-center justify-between gap-4 mb-6">
                  <button
                    type="button"
                    onClick={() => setReaderCourse("")}
                    className="px-4 py-2 border bg-white rounded-lg font-black text-sm"
                  >
                    ← Voltar aos cursos
                  </button>
                  <button
                    type="button"
                    onClick={() => {
                      loadEditorConfig();
                      setEditingCourse(true);
                    }}

                reject(new Error("Imagem inválida."));
              };
              image.src = url;
